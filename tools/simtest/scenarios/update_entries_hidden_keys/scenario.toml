# Settings > System in the Picco simulator lists no firmware-update entries (task D4).
# Upstream hides "Check for Updates" and "SD Card Firmware Update" on the Picco; feature builds ask
# the running partition table instead (src/update/UpdateGate.h), and the simulator has none, so the
# entries stay hidden there, between "Clock" and "Display Refresh" where other devices show them.
description = "Home -> Settings -> System: no Check for Updates and no SD Card Firmware Update entry"

steps = [
  { wait_screen = "Browse Files | Library | File Transfer | Settings" },
  { press = "DOWN" },
  { press = "DOWN" },
  { press = "DOWN", note = "Settings is the fourth Home entry" },
  { press = "ENTER" },
  { wait_screen = "Settings | dev-simulator | System" },
  { press = "ENTER", note = "System is selected first" },
  { wait_screen = "System | Language" },
  { screen_has = "Clock | Display Refresh | About", note = "the whole list fits on one screen" },
  { screen_lacks = "Check for Updates" },
  { screen_lacks = "SD Card Firmware Update" },
  { quit = true },
]
