# The upstream screens the device session checklist shows (task D6, docs/DEVICE_SESSION.md):
# Home > File Transfer (copying the books by Wi-Fi, session step 6), Settings with the firmware
# version at the top right (first boot, step 6), Settings > Controls and its Side buttons and
# Power button pages (the two settings the Controls check may change, step 7), and Settings >
# System (where the SD-card update appears on the device, step 8; the simulator has no partition
# table, so it shows no update entry). The references are copied, unchanged, to docs/device-session/;
# tools/device/tests/test_session_doc.py checks that the two copies are equal.
