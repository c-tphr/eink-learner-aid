  { wait_log = "\\[CTL\\] Answer focus=Correct" },
  { press = "DOWN", hold_ms = 900, note = "Correct: the file keeps Incorrect" },
  { wait_log = "\\[CPT\\] event=correct prompt=c0002-p2 accepted=1 refusal=0 state=prompt-hidden grade_recorded=0 save=now" },
  { wait_log = "\\[CPT\\] screen=Prompt question=3/3 prompt=c0002-p3 recorded=none focus=Reveal " },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { press = "DOWN" },
  { wait_log = "\\[CTL\\] Prompt focus=SkipPrompt" },
  { press = "DOWN" },
  { wait_log = "\\[CTL\\] Prompt focus=SkipCheckpoint" },
  { press = "DOWN", hold_ms = 900, note = "Skip checkpoint" },
  { wait_log = "\\[CPT\\] end result=skipped prompt=2 ch=3 word=0 mode=page saved=1" },
  { wait_log = "Progress saved: spine=3 offset=0 page=0" },
  { kill = true },
  { expect_json = "books/fixture.prepared.epub.rsvp-state.json", pointer = "/grades/c0002-p2/first", equals = "incorrect" },
  { expect_json = "books/fixture.prepared.epub.rsvp-state.json", pointer = "/position", equals = { chapter = 3, word = 0, mode = "page" } },

  # Run 3: sleep during a reread in RSVP.
  { start = true },
  { wait_log = "No known cover image for thumbnail" },
  { tap = [240, 175], note = "the continue-reading card" },
  { wait_log = "Progress saved: spine=3 offset=0 page=0" },
  { swipe = [80, 400, 400, 400], note = "previous page: chapter 2's last page" },
  { wait_log = "Progress saved: spine=2 offset=\\d+ page=5" },
  { swipe = [400, 400, 80, 400] },
  { wait_log = "\\[CPT\\] fire source=next-page checkpoint=c0002 section=s0004 " },
  { wait_log = "\\[CPT\\] screen=Prompt question=1/3 prompt=c0002-p1 recorded=correct focus=Reveal " },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { tap = [364, 712], note = "Skip question" },
  { wait_log = "\\[CPT\\] screen=Prompt question=2/3 prompt=c0002-p2 recorded=incorrect focus=Reveal " },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { tap = [240, 476], note = "Reveal" },
  { wait_log = "\\[CTL\\] Answer armed" },
  { tap = [360, 620], note = "Incorrect" },
  { wait_log = "\\[CTL\\] Incorrect armed" },
  { tap = [240, 256], note = "Reread in RSVP" },
  { wait_log = "\\[RSVP\\] enter ch=2 page_offset=\\d+ word=311 .* from=reread" },
  { wait_log = "\\[CTL\\] Pause armed" },
  { tap = [240, 340], note = "Play" },
  { wait_log = "\\[RSVP\\] frame ch=2 first=330 " },
  { tap = [240, 600], note = "a touch pauses" },
  { wait_log = "\\[CPT\\] saved after=reread-moved prompt=- grade=none active=c0002 prompt_index=1 position=none ok=1 reread=2:3\\d\\d:rsvp" },
  { wait_log = "\\[CTL\\] Pause armed" },
  { shot = "t_before_sleep_reread_rsvp" },
  { sleep = true },
  { wait_log = "Entering deep sleep" },
  { wake = "POWER" },
  { wait_log = "\\[CPT\\] restore view=reread checkpoint=c0002 prompt=2/3 place=2:3\\d\\d:rsvp resume=3:0:page notes=none " },
  { wait_log = "\\[RSVP\\] enter ch=2 page_offset=\\d+ word=3\\d\\d .* from=reread" },
  { wait_log = "\\[RSVP\\] pause screen focus=Play refresh=clear status=\"Rereading · 1000 WPM target · -- actual\"" },
  { wait_log = "\\[CTL\\] Pause armed" },
  { shot = "t_after_wake_reread_rsvp" },
  { tap = [240, 160], note = "Back to the question" },
  { wait_log = "\\[CPT\\] reread end by=pause-screen event=return-early accepted=1 state=prompt-hidden" },
  { wait_log = "\\[CPT\\] screen=Prompt question=2/3 prompt=c0002-p2 recorded=incorrect focus=Reveal " },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { tap = [116, 712], note = "Skip checkpoint" },
  { wait_log = "\\[CPT\\] end result=skipped prompt=1 ch=3 word=0 mode=page saved=1" },
  { wait_log = "\\[RSVP\\] leave to=checkpoint-done end=skipped" },
  { wait_log = "Progress saved: spine=3 offset=0 page=0", note = "page view after the break, where it fired" },
