  { expect_schema = "books/fixture.prepared.epub.rsvp-state.json", schema = "tools/simtest/scenarios/cp_sleep_restore/final.schema.json" },
  { expect_json = "books/fixture.prepared.epub.rsvp-state.json", pointer = "/position", equals = { chapter = 3, word = 0, mode = "page" } },
  { expect_no_file = "books/fixture.prepared.epub.rsvp-state.json.*" },
