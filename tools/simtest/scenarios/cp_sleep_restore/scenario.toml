# Sleep and wake during a question and during a reread (task C5; PRD criterion 4; see
# sleep_wake_reopens_book for how sleep is scripted). After a sleep from the reader the firmware reopens
# the book by itself, and the book opens as after a power loss: the reread first, then the question with
# its answer hidden. The prepared fixture's c0002 (section s0004, chapter 2 words 311-607, resume
# chapter 3 word 0). The book's state file sets 1000 WPM.
#
# Run 1, touch: c0002 fires in page view; p1 Correct; question 2 shows; sleep; wake: question 2 of 3,
# answer hidden. Reveal, Incorrect, Reread in page view, one swipe (the reread place moves to 381); kill.
# Run 2, keys: ENTER on Home reopens the book in the reread (page 381-489 with the bar); sleep; wake: the
# same page with the bar. Hold: the list, hold: Back to the question; question 2, answer hidden,
# "Recorded earlier: Incorrect". Reveal, Correct (the file keeps Incorrect); p3 Skip checkpoint: page
# view at chapter 3. Kill.
# Run 3, touch: back to chapter 2's last page and on: c0002 fires again. p1 Skip question; p2 Reveal,
# Incorrect, Reread in RSVP; Play; a touch pauses inside the section; sleep; wake: RSVP's reread pause
# screen at the saved word, Play highlighted. Back to the question; Skip checkpoint: page view at
# chapter 3, where it fired. The grades are run 1's: p1 correct, p2 incorrect, p3 never graded.
description = "Sleep while a question shows, and during a reread in page view and in RSVP: after the wake the book reopens on the same screen (the answer hidden), and the way back to the question and the resume work as before"

env = { vars = { CROSSPOINT_SIM_UPDATE_MS = "0", CROSSPOINT_SIM_CLEAR_MS = "0" } }

sd = [
  { src = "fixtures/books/fixture.prepared.epub", dst = "books/fixture.prepared.epub" },
  { json = { openEpubPath = "/books/fixture.prepared.epub", lastSleepFromReader = true }, dst = ".crosspoint/state.json" },
  { text = "{\"version\": 1, \"overrides\": {\"wpm\": 1000}}\n", dst = "books/fixture.prepared.epub.rsvp-state.json" },
]

steps = [
  { wait_log = "Progress saved: spine=0 offset=0 page=0", note = "booted into the book's title page" },

  # Run 1: sleep while a question shows.
  { tap = [240, 400], note = "centre tap: the toolbar" },
  { wait_log = "from clearScreen to displayBuffer" },
  { tap = [95, 752], note = "Contents" },
  { wait_log = "from clearScreen to displayBuffer" },
  { tap = [120, 532], note = "The Fog Season" },
  { wait_log = "Progress saved: spine=2 offset=0 page=0" },
  { swipe = [400, 400, 80, 400] },
  { wait_log = "Progress saved: spine=2 offset=\\d+ page=1" },
  { swipe = [400, 400, 80, 400] },
  { wait_log = "Progress saved: spine=2 offset=\\d+ page=2" },
  { swipe = [400, 400, 80, 400] },
  { wait_log = "Progress saved: spine=2 offset=\\d+ page=3" },
  { swipe = [400, 400, 80, 400] },
  { wait_log = "Progress saved: spine=2 offset=\\d+ page=4" },
  { swipe = [400, 400, 80, 400] },
  { wait_log = "Progress saved: spine=2 offset=\\d+ page=5" },
  { swipe = [400, 400, 80, 400] },
  { wait_log = "\\[CPT\\] fire source=next-page checkpoint=c0002 section=s0004 " },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { tap = [240, 476], note = "Reveal" },
  { wait_log = "\\[CTL\\] Answer armed" },
  { tap = [120, 620], note = "Correct" },
  { wait_log = "\\[CPT\\] saved after=correct prompt=c0002-p1 grade=correct active=c0002 prompt_index=1 position=none ok=1" },
  { wait_log = "\\[CPT\\] screen=Prompt question=2/3 prompt=c0002-p2 recorded=none focus=Reveal " },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { shot = "t_before_sleep_prompt" },
  { sleep = true },
  { wait_log = "Entering deep sleep" },
  { wake = "POWER" },
  { wait_log = "\\[CPT\\] restore view=prompt checkpoint=c0002 prompt=2/3 place=3:0:page resume=3:0:page notes=none ", note = "the reader reopened the book by itself" },
  { wait_log = "\\[CPT\\] screen=Prompt question=2/3 prompt=c0002-p2 recorded=none focus=Reveal " },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { shot = "t_after_wake_prompt" },
  { tap = [240, 476], note = "Reveal" },
  { wait_log = "\\[CTL\\] Answer armed" },
  { tap = [360, 620], note = "Incorrect" },
  { wait_log = "\\[CTL\\] Incorrect armed" },
  { tap = [240, 348], note = "Reread in page view" },
  { wait_log = "\\[CPT\\] reread bar shown" },
  { wait_log = "Progress saved: spine=2 offset=\\d+ page=3" },
  { swipe = [400, 400, 80, 400] },
  { wait_log = "\\[CPT\\] saved after=reread-moved prompt=- grade=none active=c0002 prompt_index=1 position=none ok=1 reread=2:381:page" },
  { wait_log = "Progress saved: spine=2 offset=\\d+ page=4" },
  { kill = true },

  # Run 2: sleep during a reread in page view.
  { start = true },
  { wait_log = "No known cover image for thumbnail" },
  { press = "ENTER", note = "reopen the book" },
  { wait_log = "\\[CPT\\] restore view=reread checkpoint=c0002 prompt=2/3 place=2:381:page " },
  { wait_log = "\\[CPT\\] reread bar shown" },
  { wait_log = "Progress saved: spine=2 offset=\\d+ page=4" },
  { shot = "k_before_sleep_reread_page" },
  { sleep = true },
  { wait_log = "Entering deep sleep" },
  { wake = "POWER" },
  { wait_log = "\\[CPT\\] restore view=reread checkpoint=c0002 prompt=2/3 place=2:381:page resume=3:0:page notes=none " },
  { wait_log = "\\[CPT\\] reread bar shown top=773 " },
  { wait_log = "Progress saved: spine=2 offset=\\d+ page=4" },
  { shot = "k_after_wake_reread_page" },
  { press = "DOWN", hold_ms = 900, note = "hold: the list" },
  { wait_log = "\\[CTL\\] RereadBar hold: the list" },
  { wait_log = "\\[CTL\\] RereadList armed" },
  { press = "DOWN", hold_ms = 900, note = "hold: Back to the question (the default)" },
  { wait_log = "\\[CPT\\] reread end by=list event=return-early accepted=1 state=prompt-hidden" },
  { wait_log = "\\[CPT\\] screen=Prompt question=2/3 prompt=c0002-p2 recorded=incorrect focus=Reveal " },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { press = "DOWN", hold_ms = 900, note = "Reveal" },
  { wait_log = "\\[CTL\\] Answer armed" },
