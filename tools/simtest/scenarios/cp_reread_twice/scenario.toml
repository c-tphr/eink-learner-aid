  { wait_log = "\\[CPT\\] screen=Prompt question=1/3 prompt=c0002-p1 recorded=incorrect focus=Reveal " },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { press = "DOWN", hold_ms = 900, note = "Reveal" },
  { wait_log = "\\[CTL\\] Answer armed" },
  { press = "DOWN" },
  { wait_log = "\\[CTL\\] Answer focus=Correct" },
  { press = "DOWN" },
  { wait_log = "\\[CTL\\] Answer focus=Incorrect" },
  { press = "DOWN", hold_ms = 900, note = "Incorrect" },
  { wait_log = "\\[CPT\\] screen=Incorrect question=1/3 prompt=c0002-p1 recorded=incorrect focus=RereadPage " },
  { wait_log = "\\[CTL\\] Incorrect armed" },
  { press = "UP" },
  { wait_log = "\\[CTL\\] Incorrect focus=RereadRsvp" },
  { press = "UP", hold_ms = 900, note = "hold: Reread in RSVP, the other mode" },
  { wait_log = "\\[CPT\\] reread start mode=rsvp checkpoint=c0002 section=s0004 prompt=0 " },
  { wait_log = "\\[RSVP\\] enter ch=2 page_offset=\\d+ word=311 .* from=reread" },
  { wait_log = "\\[RSVP\\] pause screen focus=Play refresh=clear status=\"Rereading · " },
  { wait_log = "\\[CTL\\] Pause armed" },
  { press = "UP" },
  { wait_log = "\\[CTL\\] Pause focus=SentenceBack" },
  { press = "UP" },
  { wait_log = "\\[CTL\\] Pause focus=BackToQuestion" },
