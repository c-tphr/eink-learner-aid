  { expect_schema = "books/fixture.prepared.epub.rsvp-state.json", schema = "tools/simtest/scenarios/cp_reread_twice/final.schema.json" },
  { compare = "t_rsvp_resume_after_page_reread", mask = [[0, 0, 480, 24]] },
