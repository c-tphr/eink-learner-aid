  { wait_log = "\\[CTL\\] Incorrect armed" },
  { tap = [240, 440], note = "Continue" },
  { wait_log = "\\[CPT\\] saved after=continue prompt=- grade=none active=c0002 prompt_index=1 position=none ok=1" },
  { wait_log = "\\[CPT\\] screen=Prompt question=2/3 prompt=c0002-p2 recorded=none focus=Reveal " },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { tap = [116, 712], note = "Skip checkpoint" },
  { wait_log = "\\[CPT\\] end result=skipped prompt=1 ch=3 word=0 mode=rsvp saved=1" },
  { wait_log = "\\[CPT\\] resume end=skipped mode=rsvp ch=3 word=0 reread=1" },
  { wait_log = "\\[CPT\\] page resume rsvp ch=3 word=0", note = "it fired in RSVP: RSVP opens after the break" },
  { wait_log = "\\[RSVP\\] enter ch=3 page_offset=\\d+ word=0 .* from=checkpoint" },
  { wait_log = "\\[RSVP\\] pause screen focus=Play refresh=clear status=\"Checkpoint done · " },
  { wait_log = "\\[CTL\\] Pause armed" },
  { shot = "t_rsvp_resume_after_page_reread", note = "chapter 3, word 0, Checkpoint done" },

  # Pass 2: keys, the checkpoint fires in page view.
  { press = "UP" },
  { wait_log = "\\[CTL\\] Pause focus=SentenceBack" },
  { press = "UP" },
  { wait_log = "\\[CTL\\] Pause focus=PageView" },
  { press = "UP", hold_ms = 900, note = "Page view" },
