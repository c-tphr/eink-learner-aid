# Two rereads of one prompt, one in each mode, then Continue (task C4; docs/PLAN.md section 7, "Grade
# rules" and "Per-prompt flow" points 4-6). The prepared fixture's c0002 (section s0004, chapter 2 words
# 311-607, ends its chapter: reading resumes at chapter 3 word 0). The book's state file sets 1000 WPM.
#
# Pass 1, touch, fired in RSVP: p1 Reveal, Incorrect; Reread in RSVP; "Back to the question" on the pause
# screen; p1 again, Reveal, Incorrect (nothing saved: it has its first grade); Reread in page view (RSVP
# closes; page view shows the section's first page with the bar); the bar's button; p1 again, Reveal,
# Incorrect, Continue; p2 Skip checkpoint. The checkpoint fired in RSVP, so RSVP opens after the break
# (chapter 3 word 0) with "Checkpoint done", although it ended over page view.
# Pass 2, keys, fired in page view: p1 Reveal, Incorrect, Reread in page view (the default); a hold, then
# a hold on "Back to the question"; p1 Reveal, Incorrect, Up to Reread in RSVP, hold: RSVP opens at word
# 311 with "Back to the question" (Up x2, hold); p1 Reveal, Incorrect, Continue; p2 Skip checkpoint. The
# checkpoint fired in page view, so RSVP closes and page view shows chapter 3's first page.
# Only c0002-p1 has a grade, the first one (incorrect), and nothing is in progress.
description = "Incorrect, reread, back, Incorrect again, reread in the other mode, back, Continue, by touch and by keys: no grade changes, no loop, resume after the break in the mode the checkpoint fired in"

env = { vars = { CROSSPOINT_SIM_UPDATE_MS = "0", CROSSPOINT_SIM_CLEAR_MS = "0" } }

sd = [
  { src = "fixtures/books/fixture.prepared.epub", dst = "books/fixture.prepared.epub" },
  { json = { openEpubPath = "/books/fixture.prepared.epub", lastSleepFromReader = true }, dst = ".crosspoint/state.json" },
  { text = "{\"version\": 1, \"overrides\": {\"wpm\": 1000}}\n", dst = "books/fixture.prepared.epub.rsvp-state.json" },
]

steps = [
  { wait_log = "Progress saved: spine=0 offset=0 page=0", note = "booted into the book's title page" },

  # Pass 1: touch, the checkpoint fires in RSVP.
  { tap = [240, 400], note = "centre tap: the toolbar" },
  { wait_log = "from clearScreen to displayBuffer" },
  { tap = [95, 752], note = "Contents" },
  { wait_log = "from clearScreen to displayBuffer" },
  { tap = [120, 532], note = "The Fog Season" },
  { wait_log = "Progress saved: spine=2 offset=0 page=0" },
  { swipe = [400, 400, 80, 400] },
  { wait_log = "Progress saved: spine=2 offset=\\d+ page=1" },
  { swipe = [400, 400, 80, 400] },
  { wait_log = "Progress saved: spine=2 offset=\\d+ page=2" },
  { swipe = [400, 400, 80, 400] },
  { wait_log = "Progress saved: spine=2 offset=\\d+ page=3" },
  { swipe = [400, 400, 80, 400] },
  { wait_log = "Progress saved: spine=2 offset=\\d+ page=4" },
  { swipe = [400, 400, 80, 400] },
  { wait_log = "Progress saved: spine=2 offset=\\d+ page=5" },
  { tap = [240, 400], note = "centre tap: the toolbar" },
  { wait_log = "from clearScreen to displayBuffer" },
  { tap = [385, 752], note = "More" },
  { wait_screen = "More | 1/3" },
  { tap = [240, 388], note = "Speed read" },
  { wait_log = "\\[RSVP\\] enter ch=2 page_offset=\\d+ word=490 .* from=page" },
  { wait_log = "\\[CTL\\] Pause armed" },
  { tap = [240, 340], note = "Play" },
  { wait_log = "\\[CPT\\] fire source=rsvp-playback checkpoint=c0002 section=s0004 ch=2 last_word=607 resume_ch=3 resume_word=0 crossed=1", timeout_ms = 60000 },
  { wait_log = "\\[CPT\\] screen=Prompt question=1/3 prompt=c0002-p1 recorded=none focus=Reveal " },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { tap = [240, 476], note = "Reveal" },
  { wait_log = "\\[CTL\\] Answer armed" },
  { tap = [360, 620], note = "Incorrect: the first grade" },
  { wait_log = "\\[CPT\\] saved after=incorrect prompt=c0002-p1 grade=incorrect active=c0002 prompt_index=0 position=none ok=1" },
  { wait_log = "\\[CTL\\] Incorrect armed" },
  { tap = [240, 256], note = "Reread in RSVP" },
  { wait_log = "\\[CPT\\] reread start mode=rsvp checkpoint=c0002 section=s0004 prompt=0 " },
  { wait_log = "\\[RSVP\\] pause screen focus=Play refresh=clear status=\"Rereading · " },
  { wait_log = "\\[CTL\\] Pause armed" },
  { tap = [240, 160], note = "Back to the question" },
  { wait_log = "\\[CTL\\] Pause select=BackToQuestion" },
  { wait_log = "\\[CPT\\] reread end by=pause-screen event=return-early accepted=1 state=prompt-hidden" },
  { wait_log = "\\[CPT\\] back checkpoint=c0002 prompt=1/3 mode=rsvp " },
  { wait_log = "\\[CPT\\] screen=Prompt question=1/3 prompt=c0002-p1 recorded=incorrect focus=Reveal " },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { tap = [240, 476], note = "Reveal" },
  { wait_log = "\\[CTL\\] Answer armed" },
