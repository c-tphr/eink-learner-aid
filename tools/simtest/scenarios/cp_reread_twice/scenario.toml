  { tap = [356, 36], note = "the bar's Back to the question" },
  { wait_log = "\\[CPT\\] reread end by=bar event=return-early accepted=1 state=prompt-hidden" },
  { wait_log = "\\[CPT\\] back checkpoint=c0002 prompt=1/3 mode=rsvp " },
