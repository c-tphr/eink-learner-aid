# Grades across skips, restarts and later passes (task C3a; docs/PLAN.md section 7, grade rules and
# "every transition saves state first"). The prepared fixture's three-prompt checkpoint c0002 fires on
# leaving chapter 2's last page (task C3; C3a opened it through a temporary simulator entry). Run 1
# reaches that page through the toolbar's Contents and five swipes. Since task C5 reopening the book
# restores the prompt in progress (answer hidden); a later pass is reached by Skip checkpoint, one
# swipe back to chapter 2's last page and one swipe on, which fires c0002 again from its first prompt.
# Each run ends with SIGKILL (no shutdown code runs) right after a screen has appeared, so the state
# file read after the kill is what was written before that screen showed.
#
# Run 1: p1 Incorrect, Continue; p2 Skip question; the p3 prompt appears; kill.
#        File: p1 incorrect, p2 ungraded, the checkpoint in progress at prompt 3 (index 2).
# Run 2: reopening shows p3 (question 3 of 3); Skip checkpoint; back and on again: c0002 fires from p1,
#        shown as "Recorded earlier: Incorrect". Correct this time; the p2 prompt appears; kill.
#        File: p1 still incorrect (the first grade survives), in progress at prompt 2 (index 1).
# Run 3: reopening shows p2 (skipped in run 1, ungraded); Correct (a prompt skipped before takes its
#        first grade); the p3 prompt appears; kill. File: p2 correct.
# Run 4: reopening shows p3; Skip checkpoint; back and on: p1 and p2 Skip question ("Recorded earlier:
#        Correct" on p2); p3 Skip checkpoint. File: p3 never graded, nothing in progress, the reading
#        position after the section's break (chapter 3, word 0).
description = "Skipped prompts stay ungraded, the first grade survives a later different answer, every grade is in the file before the next screen"

env = { vars = { CROSSPOINT_SIM_UPDATE_MS = "0", CROSSPOINT_SIM_CLEAR_MS = "0" } }

sd = [
  { src = "fixtures/books/fixture.prepared.epub", dst = "books/fixture.prepared.epub" },
  { json = { openEpubPath = "/books/fixture.prepared.epub", lastSleepFromReader = true }, dst = ".crosspoint/state.json" },
]

steps = [
  # Run 1.
  { wait_log = "\\[CPT\\] checkpoint data OEBPS/rsvp/checkpoints.json: .* copy=made" },
  { wait_log = "Progress saved: spine=0 offset=0 page=0", note = "booted into the book's title page" },
  { tap = [240, 400], note = "centre tap: the toolbar" },
  { wait_log = "from clearScreen to displayBuffer" },
  { tap = [95, 752], note = "Contents" },
  { wait_log = "from clearScreen to displayBuffer" },
  { tap = [120, 532], note = "The Fog Season" },
  { wait_log = "Progress saved: spine=2 offset=0 page=0" },
  { swipe = [400, 400, 80, 400] },
  { wait_log = "Progress saved: spine=2 offset=\\d+ page=1" },
  { swipe = [400, 400, 80, 400] },
  { wait_log = "Progress saved: spine=2 offset=\\d+ page=2" },
  { swipe = [400, 400, 80, 400] },
  { wait_log = "Progress saved: spine=2 offset=\\d+ page=3" },
  { swipe = [400, 400, 80, 400] },
  { wait_log = "Progress saved: spine=2 offset=\\d+ page=4" },
  { swipe = [400, 400, 80, 400] },
  { wait_log = "Progress saved: spine=2 offset=\\d+ page=5" },
  { swipe = [400, 400, 80, 400], note = "leaving chapter 2's last page fires c0002" },
  { wait_log = "\\[CPT\\] fire source=next-page checkpoint=c0002 " },
  { wait_log = "\\[CPT\\] open checkpoint=c0002 prompts=3 section=s0004 mode=page resume_ch=3 resume_word=0 state=missing grades=0 " },
  { wait_log = "\\[CPT\\] screen=Prompt question=1/3 prompt=c0002-p1 recorded=none focus=Reveal " },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { tap = [240, 476], note = "Reveal" },
  { wait_log = "\\[CTL\\] Answer armed" },
  { tap = [360, 620], note = "Incorrect" },
  { wait_log = "\\[CPT\\] saved after=incorrect prompt=c0002-p1 grade=incorrect active=c0002 prompt_index=0 position=none ok=1" },
  { wait_log = "\\[CPT\\] screen=Incorrect question=1/3 prompt=c0002-p1 recorded=incorrect " },
  { wait_log = "\\[CTL\\] Incorrect armed" },
  { tap = [240, 440], note = "Continue" },
  { wait_log = "\\[CPT\\] screen=Prompt question=2/3 prompt=c0002-p2 recorded=none " },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { tap = [364, 712], note = "Skip question" },
  { wait_log = "\\[CPT\\] saved after=skip-prompt prompt=- grade=none active=c0002 prompt_index=2 position=none ok=1" },
  { wait_log = "\\[CPT\\] screen=Prompt question=3/3 prompt=c0002-p3 recorded=none focus=Reveal " },
  { kill = true, note = "right after the p3 prompt appeared" },
  { expect_json = "books/fixture.prepared.epub.rsvp-state.json", pointer = "/grades/c0002-p1/first", equals = "incorrect" },
  { expect_json = "books/fixture.prepared.epub.rsvp-state.json", pointer = "/active_checkpoint/id", equals = "c0002" },
  { expect_json = "books/fixture.prepared.epub.rsvp-state.json", pointer = "/active_checkpoint/prompt_index", equals = 2 },
  { expect_json = "books/fixture.prepared.epub.rsvp-state.json", pointer = "/active_checkpoint/resume", equals = { chapter = 3, word = 0, mode = "page" } },
  { expect_schema = "books/fixture.prepared.epub.rsvp-state.json", schema = "tools/simtest/scenarios/cp_skip_grades/run1.schema.json", note = "p2 was skipped: no grade" },

  # Run 2.
  { start = true },
  { wait_log = "No known cover image for thumbnail", note = "after a kill the firmware boots to Home; the book's card is selected" },
  { press = "ENTER", note = "reopen the book" },
  { wait_log = "\\[CPT\\] checkpoint data OEBPS/rsvp/checkpoints.json: .* copy=cached" },
  { wait_log = "\\[CPT\\] restore view=prompt checkpoint=c0002 prompt=3/3 place=3:0:page resume=3:0:page notes=none " },
  { wait_log = "\\[CPT\\] screen=Prompt question=3/3 prompt=c0002-p3 recorded=none focus=Reveal ", note = "the prompt in progress, answer hidden" },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { tap = [116, 712], note = "Skip checkpoint" },
  { wait_log = "\\[CPT\\] end result=skipped prompt=2 ch=3 word=0 mode=page saved=1" },
  { wait_log = "Progress saved: spine=3 offset=0 page=0" },
  { swipe = [80, 400, 400, 400], note = "previous page: chapter 2's last page" },
  { wait_log = "Progress saved: spine=2 offset=\\d+ page=5" },
  { swipe = [400, 400, 80, 400], note = "c0002 fires again: a later pass" },
  { wait_log = "\\[CPT\\] open checkpoint=c0002 prompts=3 section=s0004 mode=page .* state=read grades=1 " },
  { wait_log = "\\[CPT\\] screen=Prompt question=1/3 prompt=c0002-p1 recorded=incorrect focus=Reveal " },
  { screen_has = "Recorded earlier: Incorrect" },
  { shot = "run2_prompt1_recorded" },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { tap = [240, 476], note = "Reveal" },
  { wait_log = "\\[CTL\\] Answer armed" },
  { tap = [120, 620], note = "Correct, this time" },
  { wait_log = "\\[CPT\\] event=correct prompt=c0002-p1 accepted=1 refusal=0 state=prompt-hidden grade_recorded=0 save=now" },
  { wait_log = "\\[CPT\\] saved after=correct prompt=- grade=none active=c0002 prompt_index=1 position=none ok=1" },
  { wait_log = "\\[CPT\\] screen=Prompt question=2/3 prompt=c0002-p2 recorded=none focus=Reveal " },
  { kill = true },
  { expect_json = "books/fixture.prepared.epub.rsvp-state.json", pointer = "/grades/c0002-p1/first", equals = "incorrect", note = "the first grade survives a different second answer" },
  { expect_json = "books/fixture.prepared.epub.rsvp-state.json", pointer = "/active_checkpoint/prompt_index", equals = 1 },
  { expect_schema = "books/fixture.prepared.epub.rsvp-state.json", schema = "tools/simtest/scenarios/cp_skip_grades/run1.schema.json" },

  # Run 3.
  { start = true },
  { wait_log = "No known cover image for thumbnail", note = "after a kill the firmware boots to Home; the book's card is selected" },
  { press = "ENTER", note = "reopen the book" },
  { wait_log = "\\[CPT\\] restore view=prompt checkpoint=c0002 prompt=2/3 " },
  { wait_log = "\\[CPT\\] screen=Prompt question=2/3 prompt=c0002-p2 recorded=none focus=Reveal ", note = "skipped in run 1: still ungraded" },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { tap = [240, 476], note = "Reveal" },
  { wait_log = "\\[CTL\\] Answer armed" },
  { tap = [120, 620], note = "Correct" },
  { wait_log = "\\[CPT\\] saved after=correct prompt=c0002-p2 grade=correct active=c0002 prompt_index=2 position=none ok=1" },
  { wait_log = "\\[CPT\\] screen=Prompt question=3/3 prompt=c0002-p3 recorded=none focus=Reveal " },
  { kill = true },
  { expect_json = "books/fixture.prepared.epub.rsvp-state.json", pointer = "/grades/c0002-p1/first", equals = "incorrect" },
  { expect_json = "books/fixture.prepared.epub.rsvp-state.json", pointer = "/grades/c0002-p2/first", equals = "correct", note = "a prompt skipped earlier takes its first grade" },
  { expect_json = "books/fixture.prepared.epub.rsvp-state.json", pointer = "/active_checkpoint/prompt_index", equals = 2 },

  # Run 4.
  { start = true },
  { wait_screen = "Mara Ellery Quill | Browse Files", note = "after a kill the firmware boots to Home; the book's card is selected. Run 3 drew no page of the book (it opened at the restored prompt), so the reader did not add the book to the recent list again with its cover path, and Home, which found no cover in run 3, draws once without looking for one" },
  { press = "ENTER", note = "reopen the book" },
  { wait_log = "\\[CPT\\] restore view=prompt checkpoint=c0002 prompt=3/3 " },
  { wait_log = "\\[CPT\\] screen=Prompt question=3/3 prompt=c0002-p3 recorded=none focus=Reveal " },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { tap = [116, 712], note = "Skip checkpoint" },
  { wait_log = "\\[CPT\\] end result=skipped prompt=2 ch=3 word=0 mode=page saved=1" },
  { wait_log = "Progress saved: spine=3 offset=0 page=0" },
  { swipe = [80, 400, 400, 400], note = "previous page: chapter 2's last page" },
  { wait_log = "Progress saved: spine=2 offset=\\d+ page=5" },
  { swipe = [400, 400, 80, 400], note = "c0002 fires again" },
  { wait_log = "\\[CPT\\] screen=Prompt question=1/3 prompt=c0002-p1 recorded=incorrect focus=Reveal " },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { tap = [364, 712], note = "Skip question" },
  { wait_log = "\\[CPT\\] screen=Prompt question=2/3 prompt=c0002-p2 recorded=correct focus=Reveal " },
  { screen_has = "Recorded earlier: Correct" },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { tap = [364, 712], note = "Skip question" },
  { wait_log = "\\[CPT\\] screen=Prompt question=3/3 prompt=c0002-p3 recorded=none focus=Reveal " },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { tap = [116, 712], note = "Skip checkpoint" },
  { wait_log = "\\[CPT\\] saved after=skip-checkpoint prompt=- grade=none active=none prompt_index=0 position=3:0:page ok=1" },
  { wait_log = "\\[CPT\\] end result=skipped prompt=2 ch=3 word=0 mode=page saved=1" },
  { quit = true },
  { expect_schema = "books/fixture.prepared.epub.rsvp-state.json", schema = "tools/simtest/scenarios/cp_skip_grades/final.schema.json", note = "p3 never graded; nothing in progress" },
  { expect_json = "books/fixture.prepared.epub.rsvp-state.json", pointer = "/grades/c0002-p1/first", equals = "incorrect" },
  { expect_json = "books/fixture.prepared.epub.rsvp-state.json", pointer = "/grades/c0002-p2/first", equals = "correct" },
  { expect_json = "books/fixture.prepared.epub.rsvp-state.json", pointer = "/position", equals = { chapter = 3, word = 0, mode = "page" } },
  { expect_json = "books/fixture.prepared.epub.rsvp-state.json", pointer = "/book_sha256", equals = "9b35113fe38d8374524edd01a5ef06e20f3035e1fdb4232eb0ed58e0a16ca92c" },
  { expect_no_file = "books/fixture.prepared.epub.rsvp-state.json.*", note = "no temporary or set-aside file left" },
  { compare = "run2_prompt1_recorded" },
]
