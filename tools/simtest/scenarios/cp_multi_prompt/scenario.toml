# A three-prompt checkpoint end to end (tasks C2 and C3; PRD criteria 1 and 3). The prepared fixture's
# c0002 (section s0004, chapter 2 words 311-607), which ends its chapter: reading resumes at chapter 3,
# word 0 (trigger rule 8).
#
# Pass 1, touch, RSVP: the toolbar's Contents jumps to chapter 2 (nothing fires on a jump); page
# forward to its last page (nothing fires: s0003 has no checkpoint); Speed read, Play; c0002 fires
# after "lamp.". p1 Reveal, Correct; p2 Reveal, Incorrect, Continue; p3 Reveal, Correct. RSVP's pause
# screen at chapter 3 word 0, "Checkpoint done".
# Pass 2, keys, page view: Page view from RSVP (chapter 3, page 1); Up to chapter 2's last page; Down
# fires c0002 in page view. The prompts show the recorded grades; p1 Reveal, Incorrect (the first
# grade, Correct, is kept), Continue; p2 Skip question; p3 Reveal, Correct. Page view shows chapter 3's
# first page. The three first grades are those of pass 1.
description = "Three-prompt checkpoint by touch in RSVP and by keys in page view: one prompt at a time, grades, finish, resume at the next chapter in the original mode"

env = { vars = { CROSSPOINT_SIM_UPDATE_MS = "0", CROSSPOINT_SIM_CLEAR_MS = "0" } }

sd = [
  { src = "fixtures/books/fixture.prepared.epub", dst = "books/fixture.prepared.epub" },
  { json = { openEpubPath = "/books/fixture.prepared.epub", lastSleepFromReader = true }, dst = ".crosspoint/state.json" },
  { text = "{\"version\": 1, \"overrides\": {\"wpm\": 1000}}\n", dst = "books/fixture.prepared.epub.rsvp-state.json" },
]

steps = [
  { wait_log = "Progress saved: spine=0 offset=0 page=0", note = "booted into the book's title page" },

  # Pass 1: touch, RSVP.
  { tap = [240, 400], note = "centre tap: the toolbar" },
  { wait_log = "from clearScreen to displayBuffer" },
  { tap = [95, 752], note = "Contents" },
  { wait_log = "from clearScreen to displayBuffer" },
  { tap = [120, 532], note = "The Fog Season" },
  { wait_log = "Progress saved: spine=2 offset=0 page=0" },
  { swipe = [400, 400, 80, 400] },
  { wait_log = "Progress saved: spine=2 offset=\\d+ page=1" },
  { swipe = [400, 400, 80, 400] },
  { wait_log = "Progress saved: spine=2 offset=\\d+ page=2" },
  { swipe = [400, 400, 80, 400] },
  { wait_log = "Progress saved: spine=2 offset=\\d+ page=3" },
  { swipe = [400, 400, 80, 400], note = "s0003 ends on this page; it has no checkpoint" },
  { wait_log = "\\[CPT\\] page advance ch=2 first=282 from=282 last=380 step=none" },
  { wait_log = "Progress saved: spine=2 offset=\\d+ page=4" },
  { swipe = [400, 400, 80, 400] },
  { wait_log = "Progress saved: spine=2 offset=\\d+ page=5" },
  { tap = [240, 400], note = "centre tap: the toolbar" },
  { wait_log = "from clearScreen to displayBuffer" },
  { tap = [385, 752], note = "More" },
  { wait_screen = "More | 1/3" },
  { tap = [240, 388], note = "Speed read" },
  { wait_log = "\\[RSVP\\] enter ch=2 page_offset=\\d+ word=490 .* from=page" },
  { wait_log = "\\[CTL\\] Pause armed" },
  { tap = [240, 340], note = "Play" },
  { wait_log = "\\[RSVP\\] frame ch=2 first=607 last=607 words=1 .* text=\"lamp.\"" },
  { wait_log = "\\[CPT\\] fire source=rsvp-playback checkpoint=c0002 section=s0004 ch=2 last_word=607 resume_ch=3 resume_word=0 crossed=1" },
  { wait_log = "\\[CPT\\] open checkpoint=c0002 prompts=3 section=s0004 mode=rsvp resume_ch=3 resume_word=0 state=read grades=0 " },
  { wait_log = "\\[CPT\\] screen=Prompt question=1/3 prompt=c0002-p1 recorded=none focus=Reveal " },
  { shot = "t_prompt1" },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { tap = [240, 476], note = "Reveal" },
  { wait_log = "\\[CPT\\] screen=Answer question=1/3 prompt=c0002-p1 " },
  { wait_log = "\\[CTL\\] Answer armed" },
  { tap = [120, 620], note = "Correct" },
  { wait_log = "\\[CPT\\] saved after=correct prompt=c0002-p1 grade=correct active=c0002 prompt_index=1 position=none ok=1" },
  { wait_log = "\\[CPT\\] screen=Prompt question=2/3 prompt=c0002-p2 recorded=none focus=Reveal " },
  { shot = "t_prompt2" },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { tap = [240, 476], note = "Reveal" },
  { wait_log = "\\[CPT\\] screen=Answer question=2/3 prompt=c0002-p2 " },
  { shot = "t_answer2" },
  { wait_log = "\\[CTL\\] Answer armed" },
  { tap = [360, 620], note = "Incorrect" },
  { wait_log = "\\[CPT\\] saved after=incorrect prompt=c0002-p2 grade=incorrect active=c0002 prompt_index=1 position=none ok=1" },
  { wait_log = "\\[CPT\\] screen=Incorrect question=2/3 prompt=c0002-p2 recorded=incorrect focus=RereadRsvp " },
  { wait_log = "\\[CTL\\] Incorrect armed" },
  { tap = [240, 440], note = "Continue" },
  { wait_log = "\\[CPT\\] saved after=continue prompt=- grade=none active=c0002 prompt_index=2 position=none ok=1" },
  { wait_log = "\\[CPT\\] screen=Prompt question=3/3 prompt=c0002-p3 recorded=none focus=Reveal " },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { tap = [240, 476], note = "Reveal" },
  { wait_log = "\\[CPT\\] screen=Answer question=3/3 prompt=c0002-p3 " },
  { wait_log = "\\[CTL\\] Answer armed" },
  { tap = [120, 620], note = "Correct" },
  { wait_log = "\\[CPT\\] saved after=correct prompt=c0002-p3 grade=correct active=none prompt_index=0 position=3:0:rsvp ok=1" },
  { wait_log = "\\[CPT\\] end result=finished prompt=2 ch=3 word=0 mode=rsvp saved=1" },
  { wait_log = "\\[RSVP\\] chapter ch=3 word=0 chapter_words=321" },
  { wait_log = "\\[RSVP\\] pause screen focus=Play refresh=clear status=\"Checkpoint done · 1000 WPM target · \\d+ actual\"" },
  { wait_log = "\\[CTL\\] Pause armed" },
  { screen_has = "The Keeper's Log · chapter 0% " },
  { shot = "t_rsvp_resume" },

  # Pass 2: keys, page view.
  { press = "UP" },
  { wait_log = "\\[CTL\\] Pause focus=SentenceBack" },
  { press = "UP" },
  { wait_log = "\\[CTL\\] Pause focus=PageView" },
  { press = "UP", hold_ms = 900, note = "Page view" },
  { wait_log = "\\[RSVP\\] leave to=page-view ch=3 word=0 " },
  { wait_log = "Progress saved: spine=3 offset=0 page=0" },
  { press = "UP" },
  { wait_log = "Progress saved: spine=2 offset=\\d+ page=5" },
  { press = "DOWN" },
  { wait_log = "\\[CPT\\] fire source=next-page checkpoint=c0002 " },
  { wait_log = "\\[CPT\\] open checkpoint=c0002 prompts=3 section=s0004 mode=page resume_ch=3 resume_word=0 state=read grades=3 " },
  { wait_log = "\\[CPT\\] screen=Prompt question=1/3 prompt=c0002-p1 recorded=correct focus=Reveal " },
  { screen_has = "Recorded earlier: Correct" },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { press = "DOWN", hold_ms = 900, note = "Reveal" },
  { wait_log = "\\[CPT\\] screen=Answer question=1/3 prompt=c0002-p1 recorded=correct focus=AnswerBox " },
  { wait_log = "\\[CTL\\] Answer armed" },
  { press = "DOWN" },
  { wait_log = "\\[CTL\\] Answer focus=Correct" },
  { press = "DOWN" },
  { wait_log = "\\[CTL\\] Answer focus=Incorrect" },
  { press = "DOWN", hold_ms = 900, note = "Incorrect: nothing is saved, the first grade stays Correct" },
  { wait_log = "\\[CPT\\] event=incorrect prompt=c0002-p1 accepted=1 refusal=0 state=incorrect-choice grade_recorded=0 save=no" },
  { wait_log = "\\[CPT\\] screen=Incorrect question=1/3 prompt=c0002-p1 recorded=correct focus=RereadPage " },
  { wait_log = "\\[CTL\\] Incorrect armed" },
  { press = "DOWN" },
  { wait_log = "\\[CTL\\] Incorrect focus=Continue" },
  { press = "DOWN", hold_ms = 900, note = "Continue" },
  { wait_log = "\\[CPT\\] screen=Prompt question=2/3 prompt=c0002-p2 recorded=incorrect focus=Reveal " },
  { screen_has = "Recorded earlier: Incorrect" },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { press = "DOWN" },
  { wait_log = "\\[CTL\\] Prompt focus=SkipPrompt" },
  { press = "DOWN", hold_ms = 900, note = "Skip question" },
  { wait_log = "\\[CPT\\] saved after=skip-prompt prompt=- grade=none active=c0002 prompt_index=2 position=none ok=1" },
  { wait_log = "\\[CPT\\] screen=Prompt question=3/3 prompt=c0002-p3 recorded=correct focus=Reveal " },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { press = "DOWN", hold_ms = 900, note = "Reveal" },
  { wait_log = "\\[CPT\\] screen=Answer question=3/3 prompt=c0002-p3 " },
  { wait_log = "\\[CTL\\] Answer armed" },
  { press = "DOWN" },
  { wait_log = "\\[CTL\\] Answer focus=Correct" },
  { press = "DOWN", hold_ms = 900, note = "Correct" },
  { wait_log = "\\[CPT\\] event=correct prompt=c0002-p3 accepted=1 refusal=0 state=finished grade_recorded=0 save=now" },
  { wait_log = "\\[CPT\\] saved after=correct prompt=- grade=none active=none prompt_index=0 position=3:0:page ok=1" },
  { wait_log = "\\[CPT\\] end result=finished prompt=2 ch=3 word=0 mode=page saved=1" },
  { wait_log = "\\[CPT\\] page resume chapter ch=3 word=0 " },
  { wait_log = "Progress saved: spine=3 offset=0 page=0", note = "the page holding the first word after the break" },
  { screen_has = "The Keeper's Log" },
  { shot = "k_page_resume" },
  { quit = true },

  { expect_json = "books/fixture.prepared.epub.rsvp-state.json", pointer = "/grades/c0002-p1/first", equals = "correct" },
  { expect_json = "books/fixture.prepared.epub.rsvp-state.json", pointer = "/grades/c0002-p2/first", equals = "incorrect" },
  { expect_json = "books/fixture.prepared.epub.rsvp-state.json", pointer = "/grades/c0002-p3/first", equals = "correct" },
  { expect_json = "books/fixture.prepared.epub.rsvp-state.json", pointer = "/position", equals = { chapter = 3, word = 0, mode = "page" } },
  { expect_schema = "books/fixture.prepared.epub.rsvp-state.json", schema = "tools/simtest/scenarios/cp_multi_prompt/final.schema.json" },
  { compare = "t_prompt1" },
  { compare = "t_prompt2" },
  { compare = "t_answer2" },
  { compare = "t_rsvp_resume", mask = [[0, 0, 480, 24]] },
  { compare = "k_page_resume" },
]
