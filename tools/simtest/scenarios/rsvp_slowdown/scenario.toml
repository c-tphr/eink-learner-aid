# The PRD's slowdown rule in the simulator (task R4a; PRD "Display performance"): with the stock
# profile's modelled word update of 540 ms (CROSSPOINT_SIM_UPDATE_MS; the clearing refresh is set to
# 100 ms only to keep the run short) and the 240 WPM default, play 13 or 14 words, pause, and check the
# firmware's own meter and word-order audit from its pause log line.
#
# Bounds on the delivered WPM, from the scheduler's rules (lib/RsvpCore/README.md, "Playback
# scheduler" and "Delivered-WPM meter"): every word here has an ideal hold of at most 560 ms, so each
# frame's slot is the refresh plus the 60 ms dwell, at least 600 ms, and the meter counts the last
# frame before the pause for at least its 540 ms refresh. With N >= 12 words the delivered WPM is at
# most N * 60000 / ((N - 1) * 600 + 540) <= 100.8. It is lower by any lateness: the main loop polls
# every 10 ms, so on an idle machine a slot is about 600-620 ms (97-100 WPM). The lower bound, 75.0,
# allows 200 ms of extra lateness per word on a loaded CI runner. Accepted: 75.0 to 101.9.
#
# The word frame is shot when the simulator backend reports word 2 ("Room") presented (update 3 of this
# run: the pause screen and Play used clearing refreshes); it then stays for the modelled 540 ms.
description = "Slowdown at a modelled 540 ms update: delivered WPM below the 240 target, about 100, every word once and in order"

env = { vars = { CROSSPOINT_SIM_UPDATE_MS = "540", CROSSPOINT_SIM_CLEAR_MS = "100" } }

sd = [
  { src = "fixtures/books/fixture.epub", dst = "books/fixture.epub" },
]

steps = [
  { wait_screen = "Browse Files" },
  { tap = [240, 346] },
  { wait_screen = "SD card | books" },
  { tap = [240, 138] },
  { wait_screen = "fixture | .epub" },
  { tap = [240, 138] },
  { wait_log = "Progress saved: spine=0 offset=0 page=0" },
  { swipe = [400, 400, 80, 400] },
  { wait_log = "Progress saved: spine=1 offset=0 page=0" },
  { tap = [240, 400] },
  { wait_log = "from clearScreen to displayBuffer" },
  { tap = [385, 752] },
  { wait_screen = "More | 1/3" },
  { tap = [240, 388], note = "Speed read" },
  { wait_log = "\\[DSP\\] Simulator model stock: update 540 ms \\(env\\), clear 100 ms \\(env\\)" },
  { wait_log = "\\[RSVP\\] pause screen focus=Play refresh=clear" },
  { wait_log = "\\[CTL\\] Pause armed" },
  { shot = "pause_entry" },
  { tap = [240, 340], note = "Play" },
  { wait_log = "\\[RSVP\\] play ch=1 word=0 wpm=240 words_per_update=1" },
  { wait_log = "\\[RSVP\\] frame ch=1 first=0 last=0 words=1 hold=\\d+ ms=(5[4-9]\\d|[6-9]\\d\\d|\\d{4,}) text=\"The\"", note = "each update takes at least the modelled 540 ms" },
  { wait_log = "\\[RSVP\\] frame ch=1 first=1 last=1 words=1 hold=\\d+ ms=(5[4-9]\\d|[6-9]\\d\\d|\\d{4,}) text=\"Lamp\"" },
  { wait_log = "\\[DSP\\] presented update n=3$", note = "word 2 is on screen for the next 540 ms" },
  { shot = "frame_room" },
  { wait_log = "\\[RSVP\\] frame ch=1 first=3 last=3 " },
  { wait_log = "\\[RSVP\\] frame ch=1 first=4 last=4 " },
  { wait_log = "\\[RSVP\\] frame ch=1 first=5 last=5 " },
  { wait_log = "\\[RSVP\\] frame ch=1 first=6 last=6 " },
  { wait_log = "\\[RSVP\\] frame ch=1 first=7 last=7 " },
  { wait_log = "\\[RSVP\\] frame ch=1 first=8 last=8 " },
  { wait_log = "\\[RSVP\\] frame ch=1 first=9 last=9 " },
  { wait_log = "\\[RSVP\\] frame ch=1 first=10 last=10 " },
  { wait_log = "\\[RSVP\\] frame ch=1 first=11 last=11 " },
  { wait_log = "\\[RSVP\\] frame ch=1 first=12 last=12 words=1 .* text=\"noon.\"" },
  { tap = [240, 600], note = "pause after 13 (or 14) words" },
  { wait_log = "\\[CTL\\] Playing pause=touch" },
  { wait_log = "\\[RSVP\\] pause reason=pause ch=1 word=1[34] target=240 delivered=(7[5-9]|[89]\\d|10[01])\\.\\d words=1[34] active_ms=\\d+ updates=1[34] clears=0 mean_update_ms=(5[4-9]\\d|[6-9]\\d\\d) max_update_ms=\\d+ audit=ok drawn=1[34] segments=1 violations=0 gaps=0 repeats=0 skipped=0 declared=0", note = "delivered 75.0-101.9 WPM; 13 or 14 words, each once, in order" },
  { wait_log = "\\[RSVP\\] pause screen focus=Play refresh=clear status=\"Paused · 240 WPM target · (7[5-9]|[89]\\d|10[0-2]) actual\"", note = "the screen shows both numbers (delivered rounded to whole WPM)" },
  { wait_log = "\\[CTL\\] Pause armed" },
  { screen_has = "240 WPM target · " },
  { screen_has = " actual | The Lamp Room · chapter " },
  { shot = "pause_slowed" },
  { compare = "pause_entry" },
  { compare = "frame_room" },
  { compare = "pause_slowed", mask = [[0, 0, 480, 50], [0, 124, 480, 72]] },
]
