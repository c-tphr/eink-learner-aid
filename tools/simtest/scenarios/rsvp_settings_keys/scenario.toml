  { wait_log = "\\[RSVP\\] frame ch=1 first=2 last=2 words=1 .* text=\"Room\"", note = "a group never crosses a paragraph end" },
  { wait_log = "\\[RSVP\\] frame ch=1 first=3 last=4 words=2 .* text=\"The supply\"" },
  { wait_log = "\\[RSVP\\] frame ch=1 first=5 last=6 words=2 " },
  { press = "DOWN", note = "any key pauses" },
  { wait_log = "\\[RSVP\\] pause reason=pause ch=1 word=\\d+ target=1000 " },
  { wait_log = "\\[RSVP\\] position saved reason=pause ch=1 word=\\d+ mode=rsvp ok=1" },
  { wait_log = "\\[CTL\\] Pause armed" },
  { press = "UP" },
  { wait_log = "\\[CTL\\] Pause focus=SentenceBack" },
  { press = "UP" },
  { wait_log = "\\[CTL\\] Pause focus=PageView" },
  { press = "UP" },
  { wait_log = "\\[CTL\\] Pause focus=Menu" },
  { press = "UP" },
  { wait_log = "\\[CTL\\] Pause focus=Exit" },
  { press = "UP", hold_ms = 900, note = "hold: Exit" },
  { wait_log = "\\[RSVP\\] leave to=exit ch=1 word=\\d+ offset=\\d+" },
  { wait_log = "Entering activity: Home" },
  { quit = true },

  { expect_json = ".crosspoint/settings.json", pointer = "/rsvpWpmTens", equals = 100 },
  { expect_json = ".crosspoint/settings.json", pointer = "/rsvpWordsPerUpdate", equals = 2 },
  { expect_json = "books/fixture.epub.rsvp-state.json", pointer = "/version", equals = 1 },
  { expect_json = "books/fixture.epub.rsvp-state.json", pointer = "/overrides", equals = { wpm = 1000, words_per_update = 2 } },
  { expect_json = "books/fixture.epub.rsvp-state.json", pointer = "/position/chapter", equals = 1 },
  { expect_json = "books/fixture.epub.rsvp-state.json", pointer = "/position/mode", equals = "rsvp" },
  { expect_no_file = "books/fixture.epub.rsvp-state.json.*" },
  { compare = "focus_wpm_up" },
  { compare = "saved_default" },
  { compare = "saved_book" },
]
