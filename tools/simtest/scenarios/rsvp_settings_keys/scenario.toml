# The pause screen's steppers and save buttons with the two side keys only (task R4b; S4 rows 6-11
# key paths: Down x2..x7 from Play, a 0.7 s hold activates, steppers repeat every 0.4 s while held).
# The settings file is seeded with a global default of 940 WPM (rsvpWpmTens 94), so RSVP opens at
# 940 WPM and 1 word (no state file yet). Down x3 reaches WPM +; a 2.3 s hold activates at 0.7 s and
# repeats at 1.1, 1.5 and 1.9 s: 960, 980, 1000, and 1000 again (upper limit). Down to words -: a hold
# at 1 changes nothing (lower limit). Words +: a 2.3 s hold gives 2, 3, 4 and 4 again (upper limit).
# Back to words - (Up): a 1.3 s hold gives 3 and 2 (one repeat). Save as default (Down x2) and Save
# for this book (Down) are confirmed on the status line; Up x7 reaches Play, and Play runs at 1000 WPM
# with two words per update. Any key pauses; Up x4 and a hold leave by Exit.
description = "RSVP settings by Up/Down only: held repeats, both limits of both steppers, Play uses them, both saves written"

env = { vars = { CROSSPOINT_SIM_UPDATE_MS = "0", CROSSPOINT_SIM_CLEAR_MS = "0" } }

sd = [
  { src = "fixtures/books/fixture.epub", dst = "books/fixture.epub" },
  { json = { openEpubPath = "/books/fixture.epub", lastSleepFromReader = true }, dst = ".crosspoint/state.json" },
  { json = { rsvpWpmTens = 94 }, dst = ".crosspoint/settings.json" },
]

steps = [
  { wait_log = "Progress saved: spine=0 offset=0 page=0", note = "booted into the book's title page" },
  { press = "DOWN" },
  { wait_log = "Progress saved: spine=1 offset=0 page=0" },
  { press = "DOWN", hold_ms = 900, note = "hold: Speed read" },
  { wait_log = "\\[RSVP\\] state missing book_wpm=0 book_words=0 default_wpm=940 default_words=1 wpm=940 words_per_update=1 position=none", note = "the global default from the settings file" },
  { wait_log = "\\[RSVP\\] enter ch=1 page_offset=0 word=0 .* from=page" },
  { wait_log = "\\[RSVP\\] pause screen focus=Play refresh=clear status=\"Paused · 940 WPM target · -- actual\"" },
  { wait_log = "\\[CTL\\] Pause armed" },
  { press = "DOWN" },
  { wait_log = "\\[CTL\\] Pause focus=SentenceForward" },
  { press = "DOWN" },
  { wait_log = "\\[CTL\\] Pause focus=WpmDown" },
  { press = "DOWN" },
  { wait_log = "\\[CTL\\] Pause focus=WpmUp" },
  { wait_log = "\\[RSVP\\] pause screen focus=WpmUp refresh=update" },
  { shot = "focus_wpm_up" },
  { press = "DOWN", hold_ms = 2300, note = "hold: WPM + at 0.7 s, repeats at 1.1, 1.5, 1.9 s" },
  { wait_log = "\\[CTL\\] Pause select=WpmUp" },
  { wait_log = "\\[RSVP\\] values wpm=960 words_per_update=1 changed=1" },
  { wait_log = "\\[RSVP\\] values wpm=980 words_per_update=1 changed=1" },
  { wait_log = "\\[RSVP\\] values wpm=1000 words_per_update=1 changed=1" },
  { wait_log = "\\[RSVP\\] values wpm=1000 words_per_update=1 changed=0", note = "the upper limit holds" },
  { press = "DOWN" },
  { wait_log = "\\[CTL\\] Pause focus=WordsDown" },
  { press = "DOWN", hold_ms = 900, note = "hold: words - at 1" },
  { wait_log = "\\[RSVP\\] values wpm=1000 words_per_update=1 changed=0", note = "the lower limit holds" },
  { press = "DOWN" },
  { wait_log = "\\[CTL\\] Pause focus=WordsUp" },
  { press = "DOWN", hold_ms = 2300, note = "hold: words + at 0.7 s, repeats at 1.1, 1.5, 1.9 s" },
  { wait_log = "\\[RSVP\\] values wpm=1000 words_per_update=2 changed=1" },
  { wait_log = "\\[RSVP\\] values wpm=1000 words_per_update=3 changed=1" },
  { wait_log = "\\[RSVP\\] values wpm=1000 words_per_update=4 changed=1" },
  { wait_log = "\\[RSVP\\] values wpm=1000 words_per_update=4 changed=0", note = "the upper limit holds" },
  { press = "UP" },
  { wait_log = "\\[CTL\\] Pause focus=WordsDown" },
  { press = "UP", hold_ms = 1300, note = "hold: words - at 0.7 s, one repeat at 1.1 s" },
  { wait_log = "\\[RSVP\\] values wpm=1000 words_per_update=3 changed=1" },
  { wait_log = "\\[RSVP\\] values wpm=1000 words_per_update=2 changed=1" },
  { wait_screen = "| 1000 WPM | 2 words per update |" },

  { press = "DOWN" },
  { wait_log = "\\[CTL\\] Pause focus=WordsUp" },
  { press = "DOWN" },
  { wait_log = "\\[CTL\\] Pause focus=SaveDefault" },
  { press = "DOWN", hold_ms = 900, note = "hold: Save as default" },
  { wait_log = "\\[RSVP\\] saved default wpm=1000 words_per_update=2 ok=1" },
