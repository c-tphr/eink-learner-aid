  { press = "DOWN", hold_ms = 900, note = "hold: Save for this book" },
  { wait_log = "\\[RSVP\\] saved book wpm=1000 words_per_update=2 ok=1" },
  { wait_log = "\\[RSVP\\] pause screen focus=SaveBook refresh=update status=\"Saved for this book · 1000 WPM target · -- actual\"" },
  { shot = "saved_book" },

  { press = "UP" },
  { wait_log = "\\[CTL\\] Pause focus=SaveDefault" },
  { press = "UP" },
  { wait_log = "\\[CTL\\] Pause focus=WordsUp" },
  { press = "UP" },
  { wait_log = "\\[CTL\\] Pause focus=WordsDown" },
  { press = "UP" },
  { wait_log = "\\[CTL\\] Pause focus=WpmUp" },
  { press = "UP" },
  { wait_log = "\\[CTL\\] Pause focus=WpmDown" },
  { press = "UP" },
  { wait_log = "\\[CTL\\] Pause focus=SentenceForward" },
