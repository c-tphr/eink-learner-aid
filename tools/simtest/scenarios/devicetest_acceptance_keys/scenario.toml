# The guided acceptance by the two side keys only (task D3b; plan section 10, step 10; S4 row 34: a
# short press moves, a 0.7 s hold chooses). Settings > Display > Device test is reached with ENTER
# (upstream's lists need Confirm or touch on the Picco, S4 section 4.4); every screen of ours is
# operated with UP and DOWN alone, and a key press stops a run or opens the question after it.
#
# Part A: both runs answered readable and slower. Part B: step 1 passed; step 2 left ("Leave to do this
# step"), the device test opened again from Settings: it resumes at step 2's question, answered Fail
# "It did not appear"; step 3 answered "Not done yet" (back to its instructions), then left, then the
# simulator is killed; after the restart Guided acceptance resumes at step 3's question, answered Skip;
# steps 4 to 11 passed, step 12 failed with "Something else". Modelled times are small and the device
# test's clock runs 50 times faster, as in devicetest_acceptance.
description = "Guided acceptance by Up/Down only: Part A, Part B across leaving and a kill, two Fails with reasons; results file validated"
timeout_s = 600
wait_timeout_ms = 60000

env = { vars = { CROSSPOINT_SIM_UPDATE_MS = "3", CROSSPOINT_SIM_CLEAR_MS = "5", CROSSPOINT_SIM_BENCH_TIME_SCALE = "50" } }

