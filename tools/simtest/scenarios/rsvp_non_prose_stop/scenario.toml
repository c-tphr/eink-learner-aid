# The non-prose stop as task R4a defines it (PRD "RSVP"; R5 replaces these expectations with its
# hand-off to page view): chapter 1 of the fixture has an image (the lighthouse figure) between word 107
# ("climb.") and word 108 ("Figure", the caption). Enter RSVP on chapter 1, page 1, step forward eight
# sentences by touch to word 101 ("Then she turned and began to climb.", positions from
# fixtures/books/fixture.expected.json and the sentence rules), and play: after word 107 playback stops
# on its own with the note "An image, table or code block was skipped" and the next word 108. Play
# then continues after the item, from word 108, with every word once and in order. Menu then leaves
# RSVP: the reader opens its menu over page 2 (the page holding the position) and saves that page.
description = "Non-prose stop: playback pauses before an image with a note, and Play continues after it"

env = { vars = { CROSSPOINT_SIM_UPDATE_MS = "0", CROSSPOINT_SIM_CLEAR_MS = "0" } }

sd = [
  { src = "fixtures/books/fixture.epub", dst = "books/fixture.epub" },
  { json = { openEpubPath = "/books/fixture.epub", lastSleepFromReader = true }, dst = ".crosspoint/state.json" },
]

steps = [
  { wait_log = "Progress saved: spine=0 offset=0 page=0" },
  { press = "DOWN", note = "chapter 1, page 1" },
  { wait_log = "Progress saved: spine=1 offset=0 page=0" },
  { press = "DOWN", hold_ms = 900, note = "hold: Speed read" },
  { wait_log = "\\[RSVP\\] enter ch=1 page_offset=0 word=0 " },
  { wait_log = "\\[CTL\\] Pause armed" },
  { tap = [240, 444], note = "Forward one sentence" },
  { wait_log = "\\[RSVP\\] sentence forward ch=1 from=0 to=3" },
  { tap = [240, 444], note = "Forward one sentence" },
  { wait_log = "\\[RSVP\\] sentence forward ch=1 from=3 to=13" },
  { tap = [240, 444], note = "Forward one sentence" },
  { wait_log = "\\[RSVP\\] sentence forward ch=1 from=13 to=32" },
  { tap = [240, 444], note = "Forward one sentence" },
  { wait_log = "\\[RSVP\\] sentence forward ch=1 from=32 to=52" },
  { tap = [240, 444], note = "Forward one sentence" },
  { wait_log = "\\[RSVP\\] sentence forward ch=1 from=52 to=61" },
  { tap = [240, 444], note = "Forward one sentence" },
  { wait_log = "\\[RSVP\\] sentence forward ch=1 from=61 to=73" },
  { tap = [240, 444], note = "Forward one sentence" },
  { wait_log = "\\[RSVP\\] sentence forward ch=1 from=73 to=87" },
  { tap = [240, 444], note = "Forward one sentence" },
  { wait_log = "\\[RSVP\\] sentence forward ch=1 from=87 to=101" },
  { wait_screen = "Page view | Then she turned and began to climb." },
  { tap = [240, 340], note = "Play" },
  { wait_log = "\\[RSVP\\] play ch=1 word=101 " },
  { wait_log = "\\[RSVP\\] frame ch=1 first=101 last=101 words=1 .* text=\"Then\"" },
  { wait_log = "\\[RSVP\\] frame ch=1 first=107 last=107 words=1 .* text=\"climb.\"", note = "the last word before the image" },
  { wait_log = "\\[RSVP\\] pause reason=non-prose ch=1 word=108 target=240 .* audit=ok drawn=7 segments=1 violations=0 gaps=0 repeats=0", note = "stopped by itself, before the item" },
  { wait_log = "\\[RSVP\\] pause screen focus=Play refresh=clear" },
  { wait_log = "\\[CTL\\] Pause armed" },
  { screen_has = "Page view | Figure 1. Gannet Rock light, seen from |", note = "Play starts after the item, at the caption" },
  { screen_has = "| An image, table or code block was skipped |" },
  { shot = "pause_non_prose" },
  { tap = [240, 340], note = "Play: continues after the item" },
  { wait_log = "\\[RSVP\\] play ch=1 word=108 " },
  { wait_log = "\\[RSVP\\] frame ch=1 first=108 last=108 words=1 .* text=\"Figure\"" },
  { wait_log = "\\[RSVP\\] frame ch=1 first=109 last=109 " },
  { wait_log = "\\[RSVP\\] frame ch=1 first=110 last=110 words=1 .* text=\"Gannet\"" },
  { tap = [240, 600], note = "pause" },
  { wait_log = "\\[RSVP\\] pause reason=pause ch=1 word=1\\d\\d .* audit=ok drawn=1\\d segments=1 violations=0 gaps=0 repeats=0", note = "the session audit: 101-107 and 108 onward are one run, no gap, no repeat" },
  { wait_log = "\\[CTL\\] Pause armed" },
  { screen_lacks = "An image, table or code block was skipped", note = "the note belongs to the stop only" },
  { tap = [240, 84], note = "Menu: the position (word 110+) is on page 2, not the entry page" },
  { wait_log = "\\[RSVP\\] leave to=menu ch=1 word=1\\d\\d offset=\\d+" },
  { wait_log = "Progress saved: spine=1 offset=\\d+ page=1", note = "the reader shows page 2 under its menu and saves it" },
  { wait_screen = "| 2/5   16% |", note = "the toolbar menu is open over page 2" },
  { quit = true },
  { expect_file = ".crosspoint/epub_*/progress.bin", hex_prefix = "0100 0100" },
  { compare = "pause_non_prose", mask = [[0, 0, 480, 26]], note = "the delivered WPM varies by run" },
]
