# A reread in page view, left early by the bar and by the hold list, and ended by paging to the section's
# end (task C4; PRD criterion 2; docs/PLAN.md section 7; S4 rows 31 and 32). The prepared fixture's c0002
# (section s0004, chapter 2 words 311-607, ends its chapter). Chapter 2's pages: 3 holds words 282-380
# (s0004 starts at 311 on it), 4 holds 381-489, 5 holds 490-607.
#
# Pass 1, touch: page forward from chapter 2's last page fires c0002 in page view. p1 Reveal, Correct; p2
# Reveal, Incorrect, Reread in page view: the page holding word 311 (page 3) with the top bar "Rereading
# this section" and "Back to the question". A swipe turns to page 4 (the reread place moves to 381 and is
# saved). A tap on the bar's button goes back to p2, answer hidden, "Recorded earlier: Incorrect". Reveal,
# Correct (the stored grade stays Incorrect); p3 Reveal, Correct. Page view resumes at chapter 3's first
# page, the first word after the break.
# Pass 2, keys: Up to chapter 2's last page, Down fires c0002 again. p1 Skip question; p2 Reveal,
# Incorrect, hold on the default Reread in page view. A hold opens the list ("Back to the question" the
# default); hold again: back to p2. Reveal, Incorrect, hold: the reread again. Down three times: pages 4
# and 5, then the advance from page 5 (which shows the section's last word) returns to p2 by itself.
# Reveal, Correct; p3 Skip question. Chapter 3's first page. The grades are pass 1's.
description = "Reread in page view after Incorrect: the top bar, Return early by the bar (touch) and by the hold list (keys), paging past the section's end returns by itself; Correct keeps the stored Incorrect; resume after the break in page view"

env = { vars = { CROSSPOINT_SIM_UPDATE_MS = "0", CROSSPOINT_SIM_CLEAR_MS = "0" } }

sd = [
  { src = "fixtures/books/fixture.prepared.epub", dst = "books/fixture.prepared.epub" },
  { json = { openEpubPath = "/books/fixture.prepared.epub", lastSleepFromReader = true }, dst = ".crosspoint/state.json" },
]

steps = [
  { wait_log = "Progress saved: spine=0 offset=0 page=0", note = "booted into the book's title page" },

  # Pass 1: touch.
  { tap = [240, 400], note = "centre tap: the toolbar" },
  { wait_log = "from clearScreen to displayBuffer" },
  { tap = [95, 752], note = "Contents" },
  { wait_log = "from clearScreen to displayBuffer" },
  { tap = [120, 532], note = "The Fog Season" },
  { wait_log = "Progress saved: spine=2 offset=0 page=0" },
  { swipe = [400, 400, 80, 400] },
  { wait_log = "Progress saved: spine=2 offset=\\d+ page=1" },
  { swipe = [400, 400, 80, 400] },
  { wait_log = "Progress saved: spine=2 offset=\\d+ page=2" },
  { swipe = [400, 400, 80, 400] },
  { wait_log = "Progress saved: spine=2 offset=\\d+ page=3" },
  { swipe = [400, 400, 80, 400] },
  { wait_log = "Progress saved: spine=2 offset=\\d+ page=4" },
  { swipe = [400, 400, 80, 400] },
  { wait_log = "Progress saved: spine=2 offset=\\d+ page=5" },
  { swipe = [400, 400, 80, 400], note = "next page from the page with the section's last word" },
  { wait_log = "\\[CPT\\] fire source=next-page checkpoint=c0002 section=s0004 ch=2 last_word=607 resume_ch=3 resume_word=0 crossed=1" },
  { wait_log = "\\[CPT\\] screen=Prompt question=1/3 prompt=c0002-p1 recorded=none focus=Reveal " },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { tap = [240, 476], note = "Reveal" },
  { wait_log = "\\[CTL\\] Answer armed" },
  { tap = [120, 620], note = "Correct" },
  { wait_log = "\\[CPT\\] saved after=correct prompt=c0002-p1 grade=correct active=c0002 prompt_index=1 position=none ok=1" },
  { wait_log = "\\[CPT\\] screen=Prompt question=2/3 prompt=c0002-p2 recorded=none focus=Reveal " },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { tap = [240, 476], note = "Reveal" },
  { wait_log = "\\[CTL\\] Answer armed" },
  { tap = [360, 620], note = "Incorrect" },
  { wait_log = "\\[CPT\\] saved after=incorrect prompt=c0002-p2 grade=incorrect active=c0002 prompt_index=1 position=none ok=1" },
  { wait_log = "\\[CPT\\] screen=Incorrect question=2/3 prompt=c0002-p2 recorded=incorrect focus=RereadPage " },
  { wait_log = "\\[CTL\\] Incorrect armed" },
  { tap = [240, 348], note = "Reread in page view" },
  { wait_log = "\\[CPT\\] saved after=reread-page prompt=- grade=none active=c0002 prompt_index=1 position=none ok=1 reread=2:311:page" },
  { wait_log = "\\[CPT\\] end result=reread-page prompt=1 ch=2 word=311 mode=page saved=1" },
  { wait_log = "\\[CPT\\] reread start mode=page checkpoint=c0002 section=s0004 prompt=1 ch=2 start=311 last_word=607" },
  { wait_log = "\\[CPT\\] page resume reread-page ch=2 word=311 offset=\\d+" },
  { wait_log = "\\[CPT\\] reread page ch=2 first=282 last=380 any=1 inside=1 word=311", note = "the page holding the section's first word" },
  { wait_log = "\\[CPT\\] reread bar shown" },
  { wait_log = "Progress saved: spine=2 offset=\\d+ page=3" },
  { screen_has = "Rereading this | Back to the" },
  { shot = "t_page_reread_bar" },
  { swipe = [400, 400, 80, 400], note = "a page turn reads on inside the section" },
  { wait_log = "\\[CPT\\] page advance ch=2 first=282 from=311 last=380 step=none reread=s0004" },
  { wait_log = "\\[CPT\\] reread page ch=2 first=381 last=489 any=1 inside=1 word=381" },
  { wait_log = "\\[CPT\\] saved after=reread-moved prompt=- grade=none active=c0002 prompt_index=1 position=none ok=1 reread=2:381:page", note = "the reread place is kept up to date at page turns" },
  { wait_log = "\\[CPT\\] reread bar shown" },
  { wait_log = "Progress saved: spine=2 offset=\\d+ page=4" },
  { tap = [356, 36], note = "the bar's Back to the question: Return early" },
  { wait_log = "\\[CTL\\] RereadBar select=BackToQuestion" },
  { wait_log = "\\[CPT\\] reread end by=bar event=return-early accepted=1 state=prompt-hidden" },
  { wait_log = "\\[CPT\\] saved after=return-early prompt=- grade=none active=c0002 prompt_index=1 position=none ok=1 reread=none" },
  { wait_log = "\\[CPT\\] back checkpoint=c0002 prompt=2/3 mode=page " },
  { wait_log = "\\[CPT\\] screen=Prompt question=2/3 prompt=c0002-p2 recorded=incorrect focus=Reveal " },
  { screen_has = "Recorded earlier: Incorrect" },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { tap = [240, 476], note = "Reveal (retry)" },
  { wait_log = "\\[CTL\\] Answer armed" },
  { tap = [120, 620], note = "Correct: moves on; the stored grade stays Incorrect" },
  { wait_log = "\\[CPT\\] event=correct prompt=c0002-p2 accepted=1 refusal=0 state=prompt-hidden grade_recorded=0 save=now" },
  { wait_log = "\\[CPT\\] screen=Prompt question=3/3 prompt=c0002-p3 recorded=none focus=Reveal " },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { tap = [240, 476], note = "Reveal" },
  { wait_log = "\\[CTL\\] Answer armed" },
  { tap = [120, 620], note = "Correct" },
  { wait_log = "\\[CPT\\] saved after=correct prompt=c0002-p3 grade=correct active=none prompt_index=0 position=3:0:page ok=1" },
  { wait_log = "\\[CPT\\] end result=finished prompt=2 ch=3 word=0 mode=page saved=1" },
  { wait_log = "\\[CPT\\] resume end=finished mode=page ch=3 word=0 reread=1" },
  { wait_log = "\\[CPT\\] page resume chapter ch=3 word=0 " },
  { wait_log = "Progress saved: spine=3 offset=0 page=0", note = "the page holding the first word after the break" },
  { screen_lacks = "Rereading this section" },

  # Pass 2: keys.
  { press = "UP" },
  { wait_log = "Progress saved: spine=2 offset=\\d+ page=5" },
  { press = "DOWN" },
  { wait_log = "\\[CPT\\] fire source=next-page checkpoint=c0002 section=s0004 " },
  { wait_log = "\\[CPT\\] screen=Prompt question=1/3 prompt=c0002-p1 recorded=correct focus=Reveal " },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { press = "DOWN" },
  { wait_log = "\\[CTL\\] Prompt focus=SkipPrompt" },
  { press = "DOWN", hold_ms = 900, note = "Skip question" },
  { wait_log = "\\[CPT\\] screen=Prompt question=2/3 prompt=c0002-p2 recorded=incorrect focus=Reveal " },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { press = "DOWN", hold_ms = 900, note = "Reveal" },
  { wait_log = "\\[CTL\\] Answer armed" },
  { press = "DOWN" },
  { wait_log = "\\[CTL\\] Answer focus=Correct" },
  { press = "DOWN" },
  { wait_log = "\\[CTL\\] Answer focus=Incorrect" },
  { press = "DOWN", hold_ms = 900, note = "Incorrect" },
  { wait_log = "\\[CPT\\] screen=Incorrect question=2/3 prompt=c0002-p2 recorded=incorrect focus=RereadPage " },
  { wait_log = "\\[CTL\\] Incorrect armed" },
  { press = "DOWN", hold_ms = 900, note = "hold: Reread in page view (the default)" },
  { wait_log = "\\[CPT\\] reread start mode=page checkpoint=c0002 section=s0004 prompt=1 " },
  { wait_log = "\\[CPT\\] reread bar shown" },
  { wait_log = "Progress saved: spine=2 offset=\\d+ page=3" },
  { press = "DOWN", hold_ms = 900, note = "hold: the list" },
  { wait_log = "\\[CTL\\] RereadBar hold: the list" },
  { wait_log = "\\[CPT\\] reread list focus=BackToQuestion" },
  { screen_has = "Rereading this section | Back to the question | Speed read from here | Keep reading" },
  { shot = "k_reread_list" },
  { wait_log = "\\[CTL\\] RereadList armed" },
  { press = "DOWN", hold_ms = 900, note = "hold: Back to the question (the default)" },
  { wait_log = "\\[CTL\\] RereadList select=BackToQuestion" },
  { wait_log = "\\[CPT\\] reread end by=list event=return-early accepted=1 state=prompt-hidden" },
  { wait_log = "\\[CPT\\] screen=Prompt question=2/3 prompt=c0002-p2 recorded=incorrect focus=Reveal " },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { press = "DOWN", hold_ms = 900, note = "Reveal" },
  { wait_log = "\\[CTL\\] Answer armed" },
  { press = "DOWN" },
  { wait_log = "\\[CTL\\] Answer focus=Correct" },
  { press = "DOWN" },
  { wait_log = "\\[CTL\\] Answer focus=Incorrect" },
  { press = "DOWN", hold_ms = 900, note = "Incorrect again" },
  { wait_log = "\\[CPT\\] screen=Incorrect question=2/3 prompt=c0002-p2 recorded=incorrect focus=RereadPage " },
  { wait_log = "\\[CTL\\] Incorrect armed" },
  { press = "DOWN", hold_ms = 900, note = "hold: Reread in page view" },
  { wait_log = "\\[CPT\\] reread page ch=2 first=282 last=380 any=1 inside=1 word=311", note = "the same page: nothing new to save" },
  { wait_log = "\\[CPT\\] reread bar shown" },
  { press = "DOWN" },
  { wait_log = "\\[CPT\\] reread page ch=2 first=381 last=489 any=1 inside=1 word=381" },
  { wait_log = "Progress saved: spine=2 offset=\\d+ page=4" },
  { press = "DOWN" },
  { wait_log = "\\[CPT\\] reread page ch=2 first=490 last=607 any=1 inside=1 word=490" },
  { wait_log = "Progress saved: spine=2 offset=\\d+ page=5" },
  { press = "DOWN", note = "the advance from the page with the section's last word returns by itself" },
  { wait_log = "\\[CPT\\] page advance ch=2 first=490 from=490 last=607 step=reread-end reread=s0004", note = "the section's own checkpoint is suppressed" },
  { wait_log = "\\[CPT\\] reread end by=next-page event=reread-reached-end accepted=1 state=prompt-hidden" },
  { wait_log = "\\[CPT\\] screen=Prompt question=2/3 prompt=c0002-p2 recorded=incorrect focus=Reveal " },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { press = "DOWN", hold_ms = 900, note = "Reveal" },
  { wait_log = "\\[CTL\\] Answer armed" },
  { press = "DOWN" },
  { wait_log = "\\[CTL\\] Answer focus=Correct" },
  { press = "DOWN", hold_ms = 900, note = "Correct" },
  { wait_log = "\\[CPT\\] event=correct prompt=c0002-p2 accepted=1 refusal=0 state=prompt-hidden grade_recorded=0 save=now" },
  { wait_log = "\\[CPT\\] screen=Prompt question=3/3 prompt=c0002-p3 recorded=correct focus=Reveal " },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { press = "DOWN" },
  { wait_log = "\\[CTL\\] Prompt focus=SkipPrompt" },
  { press = "DOWN", hold_ms = 900, note = "Skip question: the checkpoint ends" },
  { wait_log = "\\[CPT\\] end result=finished prompt=2 ch=3 word=0 mode=page saved=1" },
  { wait_log = "\\[CPT\\] page resume chapter ch=3 word=0 " },
  { wait_log = "Progress saved: spine=3 offset=0 page=0" },
  { quit = true },

  { expect_json = "books/fixture.prepared.epub.rsvp-state.json", pointer = "/grades/c0002-p1/first", equals = "correct" },
  { expect_json = "books/fixture.prepared.epub.rsvp-state.json", pointer = "/grades/c0002-p2/first", equals = "incorrect" },
  { expect_json = "books/fixture.prepared.epub.rsvp-state.json", pointer = "/grades/c0002-p3/first", equals = "correct" },
  { expect_json = "books/fixture.prepared.epub.rsvp-state.json", pointer = "/position", equals = { chapter = 3, word = 0, mode = "page" } },
  { expect_schema = "books/fixture.prepared.epub.rsvp-state.json", schema = "tools/simtest/scenarios/cp_reread_rsvp_end/final.schema.json" },
  { compare = "t_page_reread_bar" },
  { compare = "k_reread_list" },
]
