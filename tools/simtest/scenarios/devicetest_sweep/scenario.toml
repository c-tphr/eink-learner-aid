# The display benchmark by touch only (task D3a; plan section 10, step 9). Settings > Display >
# Device test is reached by taps. Every prompt is answered by a tap on its row (S4 row 34: rows
# 448x72 from y=72); a touch stops a series or opens the rating.
#
# Stock: the whole sweep, every rated step answered. Trial A: stopped by a touch during its word band
# (after 20 updates), then "Skip the rest of this profile". Trial B: the whole sweep; then "End the
# benchmark": Trials C and D are recorded as not run. Modelled times are small (update 3 ms, clear
# 5 ms) and the benchmark's clock runs 50 times faster (CROSSPOINT_SIM_BENCH_TIME_SCALE), so the
# pacing of the six passages takes a fraction of the real time; the counts, the order check and the
# files are the real logic. The results file is written after every step and checked against the
# JSON Schema at the end.
description = "Display benchmark by touch only: Stock and Trial B in full, Trial A skipped part-way, run ended; results file validated"
timeout_s = 900
wait_timeout_ms = 60000

env = { vars = { CROSSPOINT_SIM_UPDATE_MS = "3", CROSSPOINT_SIM_CLEAR_MS = "5", CROSSPOINT_SIM_BENCH_TIME_SCALE = "50" } }

