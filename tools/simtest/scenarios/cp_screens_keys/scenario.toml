# The checkpoint screens with the two side keys only (task C3a; docs/spikes/S4-control-map.md rows
# 17-29 key paths and section 5.1: a short press of Up or Down moves the highlight on release, never
# wraps and never activates; a 0.7 s hold of either key activates). The same six checkpoints and
# actions as cp_screens_touch, each reached by Up/Down from the screen's default highlight:
#
#   A c0001             hold (Reveal); Down x1, hold (Correct)                      -> finished
#   B c0002             p1 hold, Down x2, hold (Incorrect); Down x1, hold (Continue);
#                       p2 Down x1, hold (Skip question); p3 Up (no wrap: Reveal),
#                       Down x3 (no wrap: Skip checkpoint), hold                     -> skipped
#   C c0002             p1 hold; hold on the one-part answer box (nothing to page);
#                       Down x3, hold (Skip question); p2 hold, Down x4, hold        -> skipped
#   D c0002             p1 hold, Down x2, hold (Incorrect, already recorded);
#                       Down x2, hold (Skip question after Incorrect);
#                       p2 hold, Down x2, hold; Down x3, hold (Skip checkpoint)      -> skipped
#   E c0002             p1 hold, Down x2, hold; Up x1, hold (Reread in RSVP)         -> reread-rsvp
#   F c0002,rsvp        p1 hold, Down x2, hold; default Reread in RSVP; Down x1, hold -> reread-page
#
# Each checkpoint is reached by reading with the same two keys (task C3; C3a used a temporary
# simulator entry): A by paging forward off chapter 1's page 3 (the end of s0001); B by paging on off
# chapter 2's last page (s0004 ends the chapter); C, D and E by Up (back to that page) and Down; F by
# Up, then Speed read and Play by holds, so it fires in RSVP. E and F start the reread (task C4), go
# back to the question at once (E: RSVP's pause screen, Up x2, hold; F: page view's hold list, hold)
# and skip the checkpoint (Down x2, hold), so reading resumes after the break in the mode it fired in
# (E in page view, F on RSVP's pause screen) and the file then holds no checkpoint in progress.
#
# Shots show the highlight on each item it reaches; the grades in the file at the end are the same as
# in cp_screens_touch (the same schema checks them).
description = "Checkpoint screens by Up/Down only: every action once, highlight moves without wrap, holds activate, grades saved"

env = { vars = { CROSSPOINT_SIM_UPDATE_MS = "0", CROSSPOINT_SIM_CLEAR_MS = "0" } }

