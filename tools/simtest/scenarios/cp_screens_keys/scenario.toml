# The checkpoint screens with the two side keys only (task C3a; docs/spikes/S4-control-map.md rows
# 17-29 key paths and section 5.1: a short press of Up or Down moves the highlight on release, never
# wraps and never activates; a 0.7 s hold of either key activates). The same six checkpoints and
# actions as cp_screens_touch, each reached by Up/Down from the screen's default highlight:
#
#   A c0001             hold (Reveal); Down x1, hold (Correct)                      -> finished
#   B c0002             p1 hold, Down x2, hold (Incorrect); Down x1, hold (Continue);
#                       p2 Down x1, hold (Skip question); p3 Up (no wrap: Reveal),
#                       Down x3 (no wrap: Skip checkpoint), hold                     -> skipped
#   C c0002             p1 hold; hold on the one-part answer box (nothing to page);
#                       Down x3, hold (Skip question); p2 hold, Down x4, hold        -> skipped
#   D c0002             p1 hold, Down x2, hold (Incorrect, already recorded);
#                       Down x2, hold (Skip question after Incorrect);
#                       p2 hold, Down x2, hold; Down x3, hold (Skip checkpoint)      -> skipped
#   E c0002             p1 hold, Down x2, hold; Up x1, hold (Reread in RSVP)         -> reread-rsvp
#   F c0002,rsvp        p1 hold, Down x2, hold; default Reread in RSVP; Down x1, hold -> reread-page
#
# Shots show the highlight on each item it reaches; the grades in the file at the end are the same as
# in cp_screens_touch (the same schema checks them).
description = "Checkpoint screens by Up/Down only: every action once, highlight moves without wrap, holds activate, grades saved"

env = { vars = { CROSSPOINT_SIM_UPDATE_MS = "0", CROSSPOINT_SIM_CLEAR_MS = "0", CROSSPOINT_SIM_CHECKPOINT = "c0001;c0002;c0002;c0002;c0002;c0002,rsvp" } }

sd = [
  { src = "fixtures/books/fixture.prepared.epub", dst = "books/fixture.prepared.epub" },
  { json = { openEpubPath = "/books/fixture.prepared.epub", lastSleepFromReader = true }, dst = ".crosspoint/state.json" },
]

steps = [
  { wait_log = "Progress saved: spine=0 offset=0 page=0", note = "booted into the book's title page" },

  # A: c0001.
  { wait_log = "\\[CPT\\] screen=Prompt question=1/1 prompt=c0001-p1 recorded=none focus=Reveal part=1/1 lines=0 refresh=clear" },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { press = "DOWN", hold_ms = 900, note = "hold: Reveal" },
  { wait_log = "\\[CTL\\] Prompt select=Reveal" },
  { wait_log = "\\[CPT\\] screen=Answer question=1/1 prompt=c0001-p1 recorded=none focus=AnswerBox part=1/1 lines=\\d+ refresh=clear" },
  { wait_log = "\\[CTL\\] Answer armed", note = "after the hold's release and 300 ms" },
  { press = "DOWN" },
  { wait_log = "\\[CTL\\] Answer focus=Correct" },
  { wait_log = "\\[CPT\\] screen=Answer question=1/1 prompt=c0001-p1 recorded=none focus=Correct part=1/1 lines=\\d+ refresh=update" },
  { shot = "a_answer_focus_correct" },
  { press = "DOWN", hold_ms = 900, note = "hold: Correct" },
  { wait_log = "\\[CTL\\] Answer select=Correct" },
  { wait_log = "\\[CPT\\] saved after=correct prompt=c0001-p1 grade=correct active=none prompt_index=0 position=1:\\d+:page ok=1" },
  { wait_log = "\\[CPT\\] end result=finished prompt=0 ch=1 word=\\d+ mode=page saved=1" },

  # B: c0002.
  { wait_log = "\\[CPT\\] screen=Prompt question=1/3 prompt=c0002-p1 recorded=none focus=Reveal " },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { press = "DOWN", hold_ms = 900, note = "hold: Reveal" },
  { wait_log = "\\[CPT\\] screen=Answer question=1/3 prompt=c0002-p1 recorded=none focus=AnswerBox " },
  { wait_log = "\\[CTL\\] Answer armed" },
  { press = "DOWN" },
  { wait_log = "\\[CTL\\] Answer focus=Correct" },
  { press = "DOWN" },
  { wait_log = "\\[CTL\\] Answer focus=Incorrect" },
  { wait_log = "\\[CPT\\] screen=Answer question=1/3 prompt=c0002-p1 recorded=none focus=Incorrect .* refresh=update" },
  { shot = "b_answer_focus_incorrect" },
  { press = "DOWN", hold_ms = 900, note = "hold: Incorrect" },
  { wait_log = "\\[CTL\\] Answer select=Incorrect" },
  { wait_log = "\\[CPT\\] saved after=incorrect prompt=c0002-p1 grade=incorrect active=c0002 prompt_index=0 position=none ok=1" },
  { wait_log = "\\[CPT\\] screen=Incorrect question=1/3 prompt=c0002-p1 recorded=incorrect focus=RereadPage .* refresh=clear" },
  { wait_log = "\\[CTL\\] Incorrect armed" },
  { press = "DOWN" },
  { wait_log = "\\[CTL\\] Incorrect focus=Continue" },
  { wait_log = "\\[CPT\\] screen=Incorrect question=1/3 prompt=c0002-p1 recorded=incorrect focus=Continue .* refresh=update" },
  { shot = "b_incorrect_focus_continue" },
  { press = "DOWN", hold_ms = 900, note = "hold: Continue" },
  { wait_log = "\\[CTL\\] Incorrect select=Continue" },
  { wait_log = "\\[CPT\\] saved after=continue prompt=- grade=none active=c0002 prompt_index=1 position=none ok=1" },
  { wait_log = "\\[CPT\\] screen=Prompt question=2/3 prompt=c0002-p2 recorded=none focus=Reveal " },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { press = "DOWN" },
  { wait_log = "\\[CTL\\] Prompt focus=SkipPrompt" },
  { wait_log = "\\[CPT\\] screen=Prompt question=2/3 prompt=c0002-p2 recorded=none focus=SkipPrompt .* refresh=update" },
  { shot = "b_prompt2_focus_skip_question" },
  { press = "DOWN", hold_ms = 900, note = "hold: Skip question" },
  { wait_log = "\\[CTL\\] Prompt select=SkipPrompt" },
  { wait_log = "\\[CPT\\] saved after=skip-prompt prompt=- grade=none active=c0002 prompt_index=2 position=none ok=1" },
  { wait_log = "\\[CPT\\] screen=Prompt question=3/3 prompt=c0002-p3 recorded=none focus=Reveal " },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { press = "UP", note = "no wrap at the top" },
  { wait_log = "\\[CTL\\] Prompt focus=Reveal" },
  { press = "DOWN" },
  { wait_log = "\\[CTL\\] Prompt focus=SkipPrompt" },
  { press = "DOWN" },
  { wait_log = "\\[CTL\\] Prompt focus=SkipCheckpoint" },
  { press = "DOWN", note = "no wrap at the bottom" },
  { wait_log = "\\[CTL\\] Prompt focus=SkipCheckpoint" },
  { wait_log = "\\[CPT\\] screen=Prompt question=3/3 prompt=c0002-p3 recorded=none focus=SkipCheckpoint .* refresh=update" },
  { shot = "b_prompt3_focus_skip_checkpoint" },
  { press = "UP", hold_ms = 900, note = "hold: Skip checkpoint (either key activates)" },
  { wait_log = "\\[CTL\\] Prompt select=SkipCheckpoint" },
  { wait_log = "\\[CPT\\] saved after=skip-checkpoint prompt=- grade=none active=none prompt_index=0 position=3:0:page ok=1" },
  { wait_log = "\\[CPT\\] end result=skipped prompt=2 ch=3 word=0 mode=page saved=1" },

  # C: hold on the one-part answer box; Skip question and Skip checkpoint on the answer screen.
  { wait_log = "\\[CPT\\] screen=Prompt question=1/3 prompt=c0002-p1 recorded=incorrect focus=Reveal " },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { press = "DOWN", hold_ms = 900, note = "hold: Reveal" },
  { wait_log = "\\[CPT\\] screen=Answer question=1/3 prompt=c0002-p1 recorded=incorrect focus=AnswerBox part=1/1 " },
  { wait_log = "\\[CTL\\] Answer armed" },
  { press = "DOWN", hold_ms = 900, note = "hold on the answer box: a one-part answer does not page" },
  { wait_log = "\\[CTL\\] Answer select=AnswerBox" },
  { wait_log = "\\[CPT\\] answer part=1/1 move=cycle changed=0" },
  { press = "DOWN" },
  { wait_log = "\\[CTL\\] Answer focus=Correct" },
  { press = "DOWN" },
  { wait_log = "\\[CTL\\] Answer focus=Incorrect" },
  { press = "DOWN" },
  { wait_log = "\\[CTL\\] Answer focus=SkipPrompt" },
  { press = "DOWN", hold_ms = 900, note = "hold: Skip question" },
  { wait_log = "\\[CTL\\] Answer select=SkipPrompt" },
  { wait_log = "\\[CPT\\] saved after=skip-prompt prompt=- grade=none active=c0002 prompt_index=1 position=none ok=1" },
  { wait_log = "\\[CPT\\] screen=Prompt question=2/3 prompt=c0002-p2 recorded=none focus=Reveal " },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { press = "DOWN", hold_ms = 900, note = "hold: Reveal" },
  { wait_log = "\\[CPT\\] screen=Answer question=2/3 prompt=c0002-p2 " },
  { wait_log = "\\[CTL\\] Answer armed" },
  { press = "DOWN" },
  { wait_log = "\\[CTL\\] Answer focus=Correct" },
  { press = "DOWN" },
  { wait_log = "\\[CTL\\] Answer focus=Incorrect" },
  { press = "DOWN" },
  { wait_log = "\\[CTL\\] Answer focus=SkipPrompt" },
  { press = "DOWN" },
  { wait_log = "\\[CTL\\] Answer focus=SkipCheckpoint" },
  { wait_log = "\\[CPT\\] screen=Answer question=2/3 prompt=c0002-p2 recorded=none focus=SkipCheckpoint .* refresh=update" },
  { shot = "c_answer2_focus_skip_checkpoint" },
  { press = "DOWN", hold_ms = 900, note = "hold: Skip checkpoint" },
  { wait_log = "\\[CTL\\] Answer select=SkipCheckpoint" },
  { wait_log = "\\[CPT\\] end result=skipped prompt=1 ch=3 word=0 mode=page saved=1" },

  # D: Skip question and Skip checkpoint after Incorrect.
  { wait_log = "\\[CPT\\] screen=Prompt question=1/3 prompt=c0002-p1 recorded=incorrect focus=Reveal " },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { press = "DOWN", hold_ms = 900, note = "hold: Reveal" },
  { wait_log = "\\[CPT\\] screen=Answer question=1/3 prompt=c0002-p1 " },
  { wait_log = "\\[CTL\\] Answer armed" },
  { press = "DOWN" },
  { wait_log = "\\[CTL\\] Answer focus=Correct" },
  { press = "DOWN" },
  { wait_log = "\\[CTL\\] Answer focus=Incorrect" },
  { press = "DOWN", hold_ms = 900, note = "hold: Incorrect, again" },
  { wait_log = "\\[CPT\\] event=incorrect prompt=c0002-p1 accepted=1 refusal=0 state=incorrect-choice grade_recorded=0 save=no" },
  { wait_log = "\\[CPT\\] screen=Incorrect question=1/3 prompt=c0002-p1 recorded=incorrect focus=RereadPage " },
  { wait_log = "\\[CTL\\] Incorrect armed" },
  { press = "DOWN" },
  { wait_log = "\\[CTL\\] Incorrect focus=Continue" },
  { press = "DOWN" },
  { wait_log = "\\[CTL\\] Incorrect focus=SkipPrompt" },
  { press = "DOWN", hold_ms = 900, note = "hold: Skip question" },
  { wait_log = "\\[CTL\\] Incorrect select=SkipPrompt" },
  { wait_log = "\\[CPT\\] saved after=skip-prompt prompt=- grade=none active=c0002 prompt_index=1 position=none ok=1" },
  { wait_log = "\\[CPT\\] screen=Prompt question=2/3 prompt=c0002-p2 recorded=none focus=Reveal " },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { press = "DOWN", hold_ms = 900, note = "hold: Reveal" },
  { wait_log = "\\[CPT\\] screen=Answer question=2/3 prompt=c0002-p2 " },
  { wait_log = "\\[CTL\\] Answer armed" },
  { press = "DOWN" },
  { wait_log = "\\[CTL\\] Answer focus=Correct" },
  { press = "DOWN" },
  { wait_log = "\\[CTL\\] Answer focus=Incorrect" },
  { press = "DOWN", hold_ms = 900, note = "hold: Incorrect" },
  { wait_log = "\\[CPT\\] saved after=incorrect prompt=c0002-p2 grade=incorrect active=c0002 prompt_index=1 position=none ok=1" },
  { wait_log = "\\[CPT\\] screen=Incorrect question=2/3 prompt=c0002-p2 recorded=incorrect focus=RereadPage " },
  { wait_log = "\\[CTL\\] Incorrect armed" },
  { press = "DOWN" },
  { wait_log = "\\[CTL\\] Incorrect focus=Continue" },
  { press = "DOWN" },
  { wait_log = "\\[CTL\\] Incorrect focus=SkipPrompt" },
  { press = "DOWN" },
  { wait_log = "\\[CTL\\] Incorrect focus=SkipCheckpoint" },
  { wait_log = "\\[CPT\\] screen=Incorrect question=2/3 prompt=c0002-p2 recorded=incorrect focus=SkipCheckpoint .* refresh=update" },
  { shot = "d_incorrect_focus_skip_checkpoint" },
  { press = "DOWN", hold_ms = 900, note = "hold: Skip checkpoint" },
  { wait_log = "\\[CTL\\] Incorrect select=SkipCheckpoint" },
  { wait_log = "\\[CPT\\] end result=skipped prompt=1 ch=3 word=0 mode=page saved=1" },

  # E: Reread in RSVP (Up x1 from the page-view default).
  { wait_log = "\\[CPT\\] screen=Prompt question=1/3 prompt=c0002-p1 recorded=incorrect focus=Reveal " },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { press = "DOWN", hold_ms = 900, note = "hold: Reveal" },
  { wait_log = "\\[CPT\\] screen=Answer question=1/3 prompt=c0002-p1 " },
  { wait_log = "\\[CTL\\] Answer armed" },
  { press = "DOWN" },
  { wait_log = "\\[CTL\\] Answer focus=Correct" },
  { press = "DOWN" },
  { wait_log = "\\[CTL\\] Answer focus=Incorrect" },
  { press = "DOWN", hold_ms = 900, note = "hold: Incorrect" },
  { wait_log = "\\[CPT\\] screen=Incorrect question=1/3 prompt=c0002-p1 recorded=incorrect focus=RereadPage " },
  { wait_log = "\\[CTL\\] Incorrect armed" },
  { press = "UP" },
  { wait_log = "\\[CTL\\] Incorrect focus=RereadRsvp" },
  { press = "UP", hold_ms = 900, note = "hold: Reread in RSVP" },
  { wait_log = "\\[CTL\\] Incorrect select=RereadRsvp" },
  { wait_log = "\\[CPT\\] saved after=reread-rsvp prompt=- grade=none active=c0002 prompt_index=0 position=none ok=1" },
  { wait_log = "\\[CPT\\] end result=reread-rsvp prompt=0 ch=2 word=311 mode=rsvp saved=1" },

  # F: from RSVP, Reread in RSVP is the default; Down x1 reaches Reread in page view.
  { wait_log = "\\[CPT\\] open checkpoint=c0002 prompts=3 section=s0004 mode=rsvp " },
  { wait_log = "\\[CPT\\] screen=Prompt question=1/3 prompt=c0002-p1 recorded=incorrect focus=Reveal " },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { press = "DOWN", hold_ms = 900, note = "hold: Reveal" },
  { wait_log = "\\[CPT\\] screen=Answer question=1/3 prompt=c0002-p1 " },
  { wait_log = "\\[CTL\\] Answer armed" },
  { press = "DOWN" },
  { wait_log = "\\[CTL\\] Answer focus=Correct" },
  { press = "DOWN" },
  { wait_log = "\\[CTL\\] Answer focus=Incorrect" },
  { press = "DOWN", hold_ms = 900, note = "hold: Incorrect" },
  { wait_log = "\\[CPT\\] screen=Incorrect question=1/3 prompt=c0002-p1 recorded=incorrect focus=RereadRsvp " },
  { wait_log = "\\[CTL\\] Incorrect armed" },
  { press = "DOWN" },
  { wait_log = "\\[CTL\\] Incorrect focus=RereadPage" },
  { press = "DOWN", hold_ms = 900, note = "hold: Reread in page view" },
  { wait_log = "\\[CTL\\] Incorrect select=RereadPage" },
  { wait_log = "\\[CPT\\] end result=reread-page prompt=0 ch=2 word=311 mode=page saved=1" },
  { quit = true },

  { expect_schema = "books/fixture.prepared.epub.rsvp-state.json", schema = "tools/simtest/scenarios/cp_screens_touch/state.schema.json", note = "exactly three grades: c0002-p3 was only skipped" },
  { expect_json = "books/fixture.prepared.epub.rsvp-state.json", pointer = "/grades/c0001-p1/first", equals = "correct" },
  { expect_json = "books/fixture.prepared.epub.rsvp-state.json", pointer = "/grades/c0002-p1/first", equals = "incorrect" },
  { expect_json = "books/fixture.prepared.epub.rsvp-state.json", pointer = "/grades/c0002-p2/first", equals = "incorrect" },
  { expect_json = "books/fixture.prepared.epub.rsvp-state.json", pointer = "/position", equals = { chapter = 3, word = 0, mode = "page" } },
  { expect_json = "books/fixture.prepared.epub.rsvp-state.json", pointer = "/active_checkpoint", equals = { id = "c0002", prompt_index = 0, resume = { chapter = 3, word = 0, mode = "rsvp" }, reread = { mode = "page", chapter = 2, word = 311 } } },
  { compare = "a_answer_focus_correct" },
  { compare = "b_answer_focus_incorrect" },
  { compare = "b_incorrect_focus_continue" },
  { compare = "b_prompt2_focus_skip_question" },
  { compare = "b_prompt3_focus_skip_checkpoint" },
  { compare = "c_answer2_focus_skip_checkpoint" },
  { compare = "d_incorrect_focus_skip_checkpoint" },
]
