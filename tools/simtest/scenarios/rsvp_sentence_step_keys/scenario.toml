# Sentence stepping on the pause screen with the two side keys only (task R4a; S4 rows 4 and 5:
# "Up x1, hold (repeats)" / "Down x1, hold (repeats)"). The card is seeded to boot into the fixture.
#
# Expected positions as in rsvp_sentence_step_touch (fixtures/books/fixture.expected.json,
# text/chapter-1.xhtml: heading words 0-2, a sentence at 3-12, the next at 13). A 1.3 s DOWN hold on
# "Forward one sentence" steps at 0.7 s and repeats at 1.1 s: 0 -> 3 -> 13. Two 0.9 s UP holds on
# "Back one sentence" step 13 -> 3 -> 0. Then Down to Play, a hold plays, any key pauses; three Up
# presses reach Menu and a hold opens the reader menu over the page (S4 row 13).
description = "Sentence forward (with hold repeat) and back with Up/Down only; positions and band text match the fixture"

env = { vars = { CROSSPOINT_SIM_UPDATE_MS = "0", CROSSPOINT_SIM_CLEAR_MS = "0" } }

sd = [
  { src = "fixtures/books/fixture.epub", dst = "books/fixture.epub" },
  { json = { openEpubPath = "/books/fixture.epub", lastSleepFromReader = true }, dst = ".crosspoint/state.json" },
]

steps = [
  { wait_log = "Progress saved: spine=0 offset=0 page=0" },
  { press = "DOWN" },
  { wait_log = "Progress saved: spine=1 offset=0 page=0" },
  { press = "DOWN", hold_ms = 900, note = "Speed read" },
  { wait_log = "\\[RSVP\\] pause screen focus=Play refresh=clear" },
  { wait_log = "\\[CTL\\] Pause armed" },
  { press = "DOWN", note = "Play -> Forward one sentence" },
  { wait_log = "\\[CTL\\] Pause focus=SentenceForward" },
  { wait_log = "\\[RSVP\\] pause screen focus=SentenceForward refresh=update" },
  { press = "DOWN", hold_ms = 1300, note = "hold: one step at 0.7 s, a repeat at 1.1 s" },
  { wait_log = "\\[RSVP\\] sentence forward ch=1 from=0 to=3" },
  { wait_log = "\\[RSVP\\] sentence forward ch=1 from=3 to=13" },
  { wait_screen = "Page view | It had crossed the strait at " },
  { shot = "pause_sentence_13" },
  { press = "UP", note = "-> Play" },
  { wait_log = "\\[CTL\\] Pause focus=Play" },
  { press = "UP", note = "-> Back one sentence" },
  { wait_log = "\\[CTL\\] Pause focus=SentenceBack" },
  { press = "UP", hold_ms = 900, note = "hold: back one sentence" },
  { wait_log = "\\[RSVP\\] sentence back ch=1 from=13 to=3" },
  { wait_screen = "Page view | The supply boat reached Gannet Rock " },
  { press = "UP", hold_ms = 900 },
  { wait_log = "\\[RSVP\\] sentence back ch=1 from=3 to=0" },
  { wait_screen = "Page view | The Lamp Room The supply boat |" },
  { press = "DOWN", note = "-> Play" },
  { wait_log = "\\[CTL\\] Pause focus=Play" },
  { press = "DOWN", hold_ms = 900, note = "hold: Play" },
  { wait_log = "\\[RSVP\\] play ch=1 word=0 " },
  { wait_log = "\\[RSVP\\] frame ch=1 first=0 last=0 " },
  { wait_log = "\\[RSVP\\] frame ch=1 first=1 last=1 " },
  { wait_log = "\\[RSVP\\] frame ch=1 first=2 last=2 words=1 .* text=\"Room\"" },
  { shot = "frame_room" },
  { wait_log = "\\[RSVP\\] frame ch=1 first=3 last=3 .* text=\"The\"" },
  { press = "DOWN", note = "any key pauses" },
  { wait_log = "\\[RSVP\\] pause reason=pause ch=1 word=\\d+ .* audit=ok .* violations=0 gaps=0 repeats=0" },
  { wait_log = "\\[CTL\\] Pause armed" },
  { screen_has = "Exit | Menu | Page view" },
  { press = "UP" },
  { wait_log = "\\[CTL\\] Pause focus=SentenceBack" },
  { press = "UP" },
  { wait_log = "\\[CTL\\] Pause focus=PageView" },
  { press = "UP" },
  { wait_log = "\\[CTL\\] Pause focus=Menu" },
  { press = "UP", hold_ms = 900, note = "hold: Menu (S4 row 13: Up x3, hold)" },
  { wait_log = "\\[CTL\\] Pause select=Menu" },
  { wait_log = "\\[RSVP\\] leave to=menu ch=1 word=\\d+ offset=\\d+" },
  { wait_screen = "| 1/5   10% |", note = "the toolbar's progress row: the reader menu is open over chapter 1, page 1" },
  { compare = "pause_sentence_13" },
  { compare = "frame_room" },
]
