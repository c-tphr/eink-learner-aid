  { press = "UP" },
  { wait_log = "Progress saved: spine=1 offset=0 page=0" },
  { tap = [240, 200], note = "a tap on the page closes the toolbar" },
  { wait_log = "Restored and freed BW buffer chunks" },
  { press = "DOWN" },
  { wait_log = "\\[CPT\\] page advance ch=1 first=0 from=0 last=107 step=none" },
  { press = "DOWN" },
  { wait_log = "\\[CPT\\] page advance ch=1 first=108 from=108 last=183 step=none" },
  { press = "DOWN", note = "reading forward inside the section fires" },
  { wait_log = "\\[CPT\\] page advance ch=1 first=184 from=184 last=294 step=fire" },
  { wait_log = "\\[CPT\\] screen=Prompt question=1/1 prompt=c0001-p1 " },
  { shot = "k_prompt" },
  { quit = true },

  { expect_json = "books/fixture.prepared.epub.rsvp-state.json", pointer = "/active_checkpoint/id", equals = "c0001" },
  { compare = "k_prompt" },
]
