# Non-prose items with the two side keys only (task R5; S4 rows 15-16 key paths: Continue = hold,
# Stay = Down x1, hold). Word positions as in rsvp_nonprose_touch (fixtures/books/fixture.expected.json).
#
# 1. Image, Continue. DOWN turns to chapter 1, page 1; a DOWN hold enters RSVP; DOWN moves to "Forward
#    one sentence" and eight holds step to word 101; UP back to Play, a hold plays. After "climb." RSVP
#    hands over to page 2 (the figure) with the banner, Continue highlighted. UP does not wrap. A DOWN
#    hold is Continue: RSVP at word 108, Play highlighted; a hold plays; DOWN pauses. One audit
#    segment across the hand-over.
# 2. Footnote body. Page view; three page turns to page 5 (word 416); a hold enters RSVP, a hold plays:
#    after chapter 1's last prose word (426) playback passes over the footnote body (words 427-450, a
#    NOTE region) and goes on into chapter 2 without a stop.
# 3. Table, Stay. Page view (chapter 2, page 1); DOWN to page 2; hold, two sentence steps, Play. The
#    table banner; DOWN highlights Stay, a hold selects it: page view stays, the state file says page.
#    A short DOWN then turns the page as usual.
# 4. Code block, Continue. Pages on to chapter 3; hold; six sentence steps to word 102; Play. The code
#    block banner; a hold is Continue: RSVP at word 141, after the code block. Play, pause: the audit
#    counts the code block's 25 word indexes as the one skip a non-prose stop allows.
# The restart while a banner shows is in rsvp_nonprose_touch: after a kill the firmware boots to Home,
# and only touch or Confirm opens the book from there.
description = "Non-prose items by Up/Down only: image and code block Continue, footnote body passed over, table Stay"

timeout_s = 300
env = { vars = { CROSSPOINT_SIM_UPDATE_MS = "0", CROSSPOINT_SIM_CLEAR_MS = "0" } }

sd = [
  { src = "fixtures/books/fixture.epub", dst = "books/fixture.epub" },
  { json = { openEpubPath = "/books/fixture.epub", lastSleepFromReader = true }, dst = ".crosspoint/state.json" },
]

steps = [
