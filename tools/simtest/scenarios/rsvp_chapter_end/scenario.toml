# Playing through a chapter end (task R4a, item 7): enter RSVP from the last page of chapter 1 (page
# 5/5, which starts at word 416), play its last prose words (416-426; words 427-450 are the chapter's
# footnote body, a NOTE region the source passes over), continue into chapter 2 without a stop (its
# word index is built on the way), pause there, and leave to page view: the reader opens chapter 2 at
# the page holding the position and saves that as its progress.
description = "Play through the end of chapter 1 into chapter 2, pause, Page view lands in chapter 2 and saves it"

env = { vars = { CROSSPOINT_SIM_UPDATE_MS = "0", CROSSPOINT_SIM_CLEAR_MS = "0" } }

sd = [
  { src = "fixtures/books/fixture.epub", dst = "books/fixture.epub" },
]

steps = [
  { wait_screen = "Browse Files" },
  { tap = [240, 346] },
  { wait_screen = "SD card | books" },
  { tap = [240, 138] },
  { wait_screen = "fixture | .epub" },
  { tap = [240, 138] },
  { wait_log = "Progress saved: spine=0 offset=0 page=0" },
  { swipe = [400, 400, 80, 400] },
  { wait_log = "Progress saved: spine=1 offset=0 page=0" },
  { swipe = [400, 400, 80, 400] },
  { wait_log = "Progress saved: spine=1 offset=\\d+ page=1" },
  { swipe = [400, 400, 80, 400] },
  { wait_log = "Progress saved: spine=1 offset=\\d+ page=2" },
  { swipe = [400, 400, 80, 400] },
  { wait_log = "Progress saved: spine=1 offset=\\d+ page=3" },
  { swipe = [400, 400, 80, 400] },
  { wait_log = "Progress saved: spine=1 offset=\\d+ page=4" },
  { screen_has = "The Lamp Room | 5/5" },
  { tap = [240, 400] },
  { wait_log = "from clearScreen to displayBuffer" },
  { tap = [385, 752] },
  { wait_screen = "More | 1/3" },
  { tap = [240, 388], note = "Speed read" },
  { wait_log = "\\[RSVP\\] enter ch=1 page_offset=\\d+ word=416 chapter_words=451" },
  { wait_log = "\\[RSVP\\] pause screen focus=Play refresh=clear" },
  { wait_log = "\\[CTL\\] Pause armed" },
  { screen_has = "The Lamp Room · chapter 92% · book 32%" },
  { shot = "pause_entry" },
  { tap = [240, 340], note = "Play" },
  { wait_log = "\\[RSVP\\] play ch=1 word=416 " },
  { wait_log = "\\[RSVP\\] frame ch=1 first=416 last=416 " },
  { wait_log = "\\[RSVP\\] frame ch=1 first=426 last=426 ", note = "the chapter's last prose word" },
  { wait_log = "\\[RSVP\\] Index (built|open) spine=2 ", note = "chapter 2's index, built on the way" },
  { wait_log = "\\[RSVP\\] chapter ch=2 word=0 chapter_words=608" },
  { wait_log = "\\[RSVP\\] frame ch=2 first=0 last=0 words=1 .* text=\"The\"" },
  { wait_log = "\\[RSVP\\] frame ch=2 first=1 last=1 words=1 .* text=\"Fog\"" },
  { wait_log = "\\[RSVP\\] frame ch=2 first=2 last=2 words=1 .* text=\"Season\"" },
  { shot = "frame_season" },
  { wait_log = "\\[RSVP\\] frame ch=2 first=3 last=3 " },
  { tap = [240, 600], note = "pause" },
  { wait_log = "\\[RSVP\\] pause reason=pause ch=2 word=\\d+ .* audit=ok drawn=\\d+ segments=2 violations=0 gaps=0 repeats=0", note = "two segments: chapter 1's end, then chapter 2" },
  { wait_log = "\\[CTL\\] Pause armed" },
  { screen_has = "The Fog Season · chapter " },
  { shot = "pause_ch2" },
  { tap = [396, 84], note = "Page view" },
  { wait_log = "\\[RSVP\\] leave to=page-view ch=2 word=\\d+ offset=\\d+" },
  { wait_log = "Progress saved: spine=2 offset=0 page=0", note = "the reader shows chapter 2, page 1, and saves it" },
  { screen_has = "The Fog Season | 1/" },
  { shot = "page_view_ch2" },
  { quit = true },
  { expect_file = ".crosspoint/epub_*/rsvp/1.wix", hex_prefix = "4350 5749" },
  { expect_file = ".crosspoint/epub_*/rsvp/2.wix", hex_prefix = "4350 5749" },
  { expect_file = ".crosspoint/epub_*/progress.bin", hex_prefix = "0200 0000" },
  { compare = "pause_entry" },
  { compare = "frame_season" },
  { compare = "pause_ch2", mask = [[0, 0, 480, 50], [0, 124, 480, 72]] },
  { compare = "page_view_ch2" },
]
