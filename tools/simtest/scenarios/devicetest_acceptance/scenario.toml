# The guided acceptance by touch only (task D3b; plan section 10, step 10). Settings > Display >
# Device test > Guided acceptance is reached by taps; every answer is a tap on its row (S4 row 34:
# rows 448x72 from y=72, 8 px apart, so row k is centred at y = 108 + 80 k).
#
# Part A on the chosen profile (Stock: nothing stored): the passage at 240 WPM, answered readable;
# the 600 WPM run stopped by a touch part-way, repeated, then answered readable and slower. Part B:
# step 1 passed; step 2 left to the reader ("Leave to do this step"), the prepared book opened, the
# device test opened again: the walk-through resumes at step 2's question, answered Fail with a
# reason; step 3 left to the reader, then the simulator is killed (a battery pull); after the restart
# the menu row says "step 3 of 12" and Guided acceptance resumes at step 3's question, answered Skip;
# steps 4 to 12 passed. The summary, the results file (checked against the JSON Schema) and the
# progress file. Modelled times are small (update 3 ms, clear 5 ms) and the device test's clock runs
# 50 times faster, as in devicetest_sweep: counts, order checks, answers and files are the real logic.
description = "Guided acceptance by touch: Part A with a stopped run, Part B across leaving to the reader and a kill, a Fail with a reason; results file validated"
timeout_s = 600
wait_timeout_ms = 60000

env = { vars = { CROSSPOINT_SIM_UPDATE_MS = "3", CROSSPOINT_SIM_CLEAR_MS = "5", CROSSPOINT_SIM_BENCH_TIME_SCALE = "50" } }

sd = [
  { src = "fixtures/books/fixture.prepared.epub", dst = "books/fixture.prepared.epub" },
]

steps = [
  { wait_screen = "Browse Files | Library | File Transfer | Settings" },
  { tap = [240, 562], note = "Settings on Home" },
  { wait_screen = "Settings | dev-simulator | System" },
  { tap = [240, 200], note = "Display" },
  { wait_screen = "Display | Device test" },
  { screen_lacks = "Speed read display", note = "no trial kept: no row" },
  { tap = [240, 138], note = "Device test, the first row" },
  { wait_log = "\\[DTS\\] open panel=simulator setting=0" },
  { wait_log = "\\[CTL\\] DeviceTest armed screen=menu" },
  { screen_has = "Guided acceptance | Choose a profile | Clearing refresh" },
  { shot = "menu" },
  { tap = [240, 268], note = "Guided acceptance" },
  { wait_log = "\\[DTS\\] acceptance open state=start step=1/12 answered=0" },
  { wait_log = "\\[DTS\\] screen acceptance-start focus=0" },
  { screen_has = "Display profile: Stock" },
  { shot = "acc_start" },
  { wait_log = "\\[CTL\\] DeviceTest armed screen=acceptance-start" },
  { tap = [240, 108], note = "Start part A" },
  { wait_log = "\\[DTS\\] acceptance start run=1 file=/rsvp-bench/0001-acceptance.json profile=stock setting=0 panel=simulator" },
  { wait_log = "\\[DTS\\] acceptance part_a choice=start profile=stock" },

  # Part A, run 1: 240 WPM
  { wait_log = "\\[DTS\\] step start profile=stock step=acceptance-240-1 attempt=1" },
  { wait_log = "\\[DTS\\] result profile=stock step=acceptance-240-1 target=240 words_per_update=1 delivered=\\d+\\.\\d words=150 frames=150 .* order=ok drawn=150 segments=1 violations=0 gaps=0 repeats=0" },
  { tap = [240, 700], note = "the owner has looked: a touch opens the question" },
  { wait_log = "\\[DTS\\] screen acceptance-readable focus=0 refresh=clear" },
  { screen_has = "Was the last sentence readable?" },
  { shot = "part_a_readable" },
  { wait_log = "\\[CTL\\] DeviceTest armed screen=acceptance-readable" },
  { tap = [240, 188], note = "Yes, it was readable" },
  { wait_log = "\\[DTS\\] acceptance readable run=acceptance-240-1 choice=yes" },

  # Part A, run 2: 600 WPM, stopped by a touch, repeated
  { wait_log = "\\[DTS\\] step start profile=stock step=acceptance-600-1 attempt=1" },
  { wait_log = "\\[DSP\\] update n=20 profile=stock" },
  { tap = [240, 700], note = "stop the run part-way" },
  { wait_log = "\\[DTS\\] result profile=stock step=acceptance-600-1 outcome=stopped attempt=1" },
  { wait_log = "\\[DTS\\] screen acceptance-stopped focus=0 refresh=clear" },
  { shot = "part_a_run_stopped" },
  { wait_log = "\\[CTL\\] DeviceTest armed screen=acceptance-stopped" },
  { tap = [240, 108], note = "Repeat the run" },
  { wait_log = "\\[DTS\\] acceptance stopped run=acceptance-600-1 choice=repeat" },
  { wait_log = "\\[DTS\\] step start profile=stock step=acceptance-600-1 attempt=2" },
  { wait_log = "\\[DTS\\] result profile=stock step=acceptance-600-1 target=600 words_per_update=1 delivered=\\d+\\.\\d words=150 frames=150 .* order=ok drawn=150 segments=1 violations=0 gaps=0 repeats=0" },
  { tap = [240, 700], note = "the owner has looked" },
  { wait_log = "\\[CTL\\] DeviceTest armed screen=acceptance-readable" },
  { tap = [240, 188], note = "Yes, it was readable" },
  { wait_log = "\\[DTS\\] acceptance readable run=acceptance-600-1 choice=yes" },
  { wait_log = "\\[DTS\\] screen acceptance-slower focus=0" },
  { screen_has = "Was it slower than 600 WPM?" },
  { shot = "part_a_slower" },
  { wait_log = "\\[CTL\\] DeviceTest armed screen=acceptance-slower" },
  { tap = [240, 188], note = "Yes: slower, no word missing" },
  { wait_log = "\\[DTS\\] acceptance slower run=acceptance-600-1 choice=yes" },
  { wait_log = "\\[DTS\\] acceptance part_a status=done measured=pass owner=pass" },
  { wait_log = "\\[DTS\\] screen acceptance-part-a focus=0" },
  { shot = "part_a_done" },
  { wait_log = "\\[CTL\\] DeviceTest armed screen=acceptance-part-a" },
  { tap = [240, 108], note = "Continue to part B" },

  # Part B, step 1: passed at once
  { wait_log = "\\[DTS\\] screen acceptance-step focus=0" },
  { screen_has = "Step 1 of 12 | Short checkpoint in RSVP, by touch" },
  { shot = "step_instructions" },
  { wait_log = "\\[CTL\\] DeviceTest armed screen=acceptance-step" },
  { tap = [240, 188], note = "Done: give the result" },
  { wait_log = "\\[DTS\\] screen acceptance-result focus=0" },
  { shot = "step_result" },
  { wait_log = "\\[CTL\\] DeviceTest armed screen=acceptance-result" },
  { tap = [240, 188], note = "Pass" },
  { wait_log = "\\[DTS\\] acceptance step n=1 id=c0001-rsvp-touch result=pass reason=none answers=1" },
  { wait_log = "\\[DTS\\] saved file=/rsvp-bench/0001-acceptance.json bytes=\\d+ status=running ok=1 progress=1" },

  # Step 2: leave to the reader, come back, Fail with a reason
  { wait_log = "\\[CTL\\] DeviceTest armed screen=acceptance-step" },
  { screen_has = "Step 2 of 12" },
  { tap = [240, 108], note = "Leave to do this step" },
  { wait_log = "\\[DTS\\] acceptance leave step n=2 id=c0001-page-keys" },
  { wait_log = "\\[DTS\\] saved file=/rsvp-bench/0001-acceptance.json bytes=\\d+ status=running ok=1 progress=1" },
  { wait_screen = "Display | Device test", note = "back in Settings" },
  { swipe = [240, 780, 240, 300], note = "bottom-edge swipe: Home" },
  { wait_log = "Entering activity: Home" },
  { tap = [240, 346], note = "Browse Files" },
  { wait_screen = "SD card | books" },
  { tap = [240, 138], note = "the books folder" },
  { wait_screen = "fixture.prepared | .epub" },
  { tap = [240, 138], note = "open the prepared fixture" },
  { wait_log = "Progress saved: spine=0 offset=0 page=0" },
  { swipe = [400, 400, 80, 400], note = "the owner reads on" },
  { wait_log = "Progress saved: spine=1 offset=0 page=0" },
  { swipe = [240, 780, 240, 300], note = "Home" },
  { wait_log = "Entering activity: Home" },
  { wait_log = "No known cover image for thumbnail" },
  { tap = [240, 562], note = "Settings" },
  { wait_screen = "Settings | dev-simulator | System" },
  { tap = [240, 200], note = "Display" },
  { wait_screen = "Display | Device test" },
  { tap = [240, 138], note = "Device test" },
  { wait_log = "\\[CTL\\] DeviceTest armed screen=menu" },
  { screen_has = "Guided acceptance: step 2 of 12" },
  { shot = "menu_step_2" },
  { tap = [240, 268], note = "Guided acceptance: resumes at step 2's question" },
  { wait_log = "\\[DTS\\] acceptance open state=result step=2/12 answered=1" },
  { wait_log = "\\[CTL\\] DeviceTest armed screen=acceptance-result" },
  { screen_has = "Step 2: how did it go?" },
  { tap = [240, 268], note = "Fail" },
  { wait_log = "\\[DTS\\] screen acceptance-reason focus=0" },
  { shot = "fail_reasons" },
  { wait_log = "\\[CTL\\] DeviceTest armed screen=acceptance-reason" },
  { tap = [240, 348], note = "Wrong mode after it" },
  { wait_log = "\\[DTS\\] acceptance step n=2 id=c0001-page-keys result=fail reason=wrong-mode answers=1" },

  # Step 3: leave, then a battery pull
  { wait_log = "\\[CTL\\] DeviceTest armed screen=acceptance-step" },
  { screen_has = "Step 3 of 12" },
  { tap = [240, 108], note = "Leave to do this step" },
  { wait_log = "\\[DTS\\] acceptance leave step n=3 id=toc-jump" },
  { wait_log = "\\[DTS\\] saved file=/rsvp-bench/0001-acceptance.json bytes=\\d+ status=running ok=1 progress=1" },
  { wait_screen = "Display | Device test" },
  { kill = true },
  { expect_file = ".crosspoint/acceptance-progress.txt", contains = "part_b 2 1" },
  { expect_json = "rsvp-bench/0001-acceptance.json", pointer = "/part_b/current", equals = "toc-jump" },
  { expect_json = "rsvp-bench/0001-acceptance.json", pointer = "/part_b/away", equals = true },
  { start = true },
  { wait_screen = "Browse Files | Library | File Transfer | Settings" },
  { tap = [240, 562], note = "Settings" },
  { wait_screen = "Settings | dev-simulator | System" },
  { tap = [240, 200], note = "Display" },
  { wait_screen = "Display | Device test" },
  { tap = [240, 138], note = "Device test" },
  { wait_log = "\\[DTS\\] acceptance resume run=1 file=/rsvp-bench/0001-acceptance.json part_a=done step=3/12 answered=2 away=1 status=running" },
  { wait_log = "\\[CTL\\] DeviceTest armed screen=menu" },
  { screen_has = "Guided acceptance: step 3 of 12" },
  { tap = [240, 268], note = "Guided acceptance" },
  { wait_log = "\\[DTS\\] acceptance open state=result step=3/12 answered=2" },
  { wait_log = "\\[CTL\\] DeviceTest armed screen=acceptance-result" },
  { tap = [240, 348], note = "Skip this step" },
  { wait_log = "\\[DTS\\] acceptance step n=3 id=toc-jump result=skipped reason=none answers=1" },

  # Steps 4 to 12: passed
  { wait_log = "\\[CTL\\] DeviceTest armed screen=acceptance-step" },
  { tap = [240, 188], note = "step 4: Done: give the result" },
  { wait_log = "\\[CTL\\] DeviceTest armed screen=acceptance-result" },
  { tap = [240, 188], note = "Pass" },
  { wait_log = "\\[DTS\\] acceptance step n=4 id=c0002-rsvp-keys result=pass reason=none answers=1" },
  { wait_log = "\\[CTL\\] DeviceTest armed screen=acceptance-step" },
  { tap = [240, 188], note = "step 5: Done: give the result" },
  { wait_log = "\\[CTL\\] DeviceTest armed screen=acceptance-result" },
  { tap = [240, 188], note = "Pass" },
  { wait_log = "\\[DTS\\] acceptance step n=5 id=reread-rsvp-end result=pass reason=none answers=1" },
  { wait_log = "\\[CTL\\] DeviceTest armed screen=acceptance-step" },
  { tap = [240, 188], note = "step 6: Done: give the result" },
  { wait_log = "\\[CTL\\] DeviceTest armed screen=acceptance-result" },
  { tap = [240, 188], note = "Pass" },
  { wait_log = "\\[DTS\\] acceptance step n=6 id=reread-page-early result=pass reason=none answers=1" },
  { wait_log = "\\[CTL\\] DeviceTest armed screen=acceptance-step" },
  { tap = [240, 188], note = "step 7: Done: give the result" },
  { wait_log = "\\[CTL\\] DeviceTest armed screen=acceptance-result" },
  { tap = [240, 188], note = "Pass" },
  { wait_log = "\\[DTS\\] acceptance step n=7 id=skip-question-resume result=pass reason=none answers=1" },
  { wait_log = "\\[CTL\\] DeviceTest armed screen=acceptance-step" },
  { tap = [240, 188], note = "step 8: Done: give the result" },
  { wait_log = "\\[CTL\\] DeviceTest armed screen=acceptance-result" },
  { tap = [240, 188], note = "Pass" },
  { wait_log = "\\[DTS\\] acceptance step n=8 id=later-pass-grades result=pass reason=none answers=1" },
  { wait_log = "\\[CTL\\] DeviceTest armed screen=acceptance-step" },
  { tap = [240, 188], note = "step 9: Done: give the result" },
  { wait_log = "\\[CTL\\] DeviceTest armed screen=acceptance-result" },
  { tap = [240, 188], note = "Pass" },
  { wait_log = "\\[DTS\\] acceptance step n=9 id=close-in-question result=pass reason=none answers=1" },
  { wait_log = "\\[CTL\\] DeviceTest armed screen=acceptance-step" },
  { tap = [240, 188], note = "step 10: Done: give the result" },
  { wait_log = "\\[CTL\\] DeviceTest armed screen=acceptance-result" },
  { tap = [240, 188], note = "Pass" },
  { wait_log = "\\[DTS\\] acceptance step n=10 id=sleep-in-reread result=pass reason=none answers=1" },
  { wait_log = "\\[CTL\\] DeviceTest armed screen=acceptance-step" },
  { tap = [240, 188], note = "step 11: Done: give the result" },
  { wait_log = "\\[CTL\\] DeviceTest armed screen=acceptance-result" },
  { tap = [240, 188], note = "Pass" },
  { wait_log = "\\[DTS\\] acceptance step n=11 id=ordinary-book-items result=pass reason=none answers=1" },
  { wait_log = "\\[CTL\\] DeviceTest armed screen=acceptance-step" },
  { tap = [240, 188], note = "step 12: Done: give the result" },
  { wait_log = "\\[CTL\\] DeviceTest armed screen=acceptance-result" },
  { tap = [240, 188], note = "Pass" },
  { wait_log = "\\[DTS\\] acceptance step n=12 id=pause-screen-600 result=pass reason=none answers=1" },
  { wait_log = "\\[DTS\\] acceptance criteria c1=fail c2=pass c3=pass c4=pass c5=pass measured=pass owner=pass pause_screen=pass answered=12 status=complete" },
  { wait_log = "\\[DTS\\] screen acceptance-summary focus=0" },
  { screen_has = "Guided acceptance done | Saved as /rsvp-bench/0001-acceptance.json" },
  { shot = "summary" },
  { wait_log = "\\[CTL\\] DeviceTest armed screen=acceptance-summary" },
  { tap = [240, 108], note = "Back to the device test menu" },
  { wait_log = "\\[CTL\\] DeviceTest armed screen=menu" },
  { screen_has = "Guided acceptance: done" },
  { quit = true },

  # The results file: valid, with both runs, the answers, the Fail's reason and the verdicts
  { expect_schema = "rsvp-bench/0001-acceptance.json", schema = "tools/device/schema/rsvp-bench.schema.json" },
  { expect_no_file = "rsvp-bench/*.tmp" },
  { expect_no_file = ".crosspoint/*.tmp" },
  { expect_json = "rsvp-bench/0001-acceptance.json", pointer = "/status", equals = "complete" },
  { expect_json = "rsvp-bench/0001-acceptance.json", pointer = "/profile/key", equals = "stock" },
  { expect_json = "rsvp-bench/0001-acceptance.json", pointer = "/part_a/runs/0/playback/order/words_drawn", equals = 150 },
  { expect_json = "rsvp-bench/0001-acceptance.json", pointer = "/part_a/runs/0/measured_ok", equals = true },
  { expect_json = "rsvp-bench/0001-acceptance.json", pointer = "/part_a/runs/1/attempts", equals = 2 },
  { expect_json = "rsvp-bench/0001-acceptance.json", pointer = "/part_a/runs/1/playback/order/in_order", equals = true },
  { expect_json = "rsvp-bench/0001-acceptance.json", pointer = "/part_a/runs/1/playback/words_shown", equals = 150 },
  { expect_json = "rsvp-bench/0001-acceptance.json", pointer = "/part_a/slower", equals = "yes" },
  { expect_file = "rsvp-bench/0001-acceptance.json", contains = "\"current\":null" },
  { expect_json = "rsvp-bench/0001-acceptance.json", pointer = "/part_b/answered", equals = 12 },
  { expect_json = "rsvp-bench/0001-acceptance.json", pointer = "/part_b/steps/1/result", equals = "fail" },
  { expect_json = "rsvp-bench/0001-acceptance.json", pointer = "/part_b/steps/1/reason", equals = "wrong-mode" },
  { expect_json = "rsvp-bench/0001-acceptance.json", pointer = "/part_b/steps/2/result", equals = "skipped" },
  { expect_json = "rsvp-bench/0001-acceptance.json", pointer = "/criteria/0/result", equals = "fail" },
  { expect_json = "rsvp-bench/0001-acceptance.json", pointer = "/criteria/4/result", equals = "pass" },
  { expect_json = "rsvp-bench/0001-acceptance.json", pointer = "/criterion_5/measured_pass", equals = true },
  { expect_json = "rsvp-bench/0001-acceptance.json", pointer = "/criterion_5/owner_pass", equals = true },
  { expect_file = ".crosspoint/acceptance-progress.txt", contains = "part_b 12 0" },
  { compare = "acc_start" },
  { compare = "step_instructions" },
  { compare = "step_result" },
  { compare = "fail_reasons" },
  { compare = "summary" },
]
