# A power loss during a reread (task C5; PRD criterion 4; docs/PLAN.md section 7, "State file": an
# active reread is restored first). Replaces cp_reread_restart, which proved that task C4 saved what
# this restore needs and that reopening did not restore it yet. The prepared fixture's c0002 (section
# s0004, chapter 2 words 311-607; chapter 2's pages hold 282-380, 381-489 and 490-607 at its end). The
# book's state file sets 1000 WPM.
#
# Pass 1, touch, page view: c0002 fires on leaving chapter 2's last page. p1 Correct; p2 Incorrect;
# Reread in page view; one swipe (the reread place moves to word 381, saved before that page shows);
# kill. Restart: Home's card reopens the book in the reread, on that page, with the bar. The bar's
# button: question 2 of 3 with the answer hidden and "Recorded earlier: Incorrect". Reveal, Correct (the
# file keeps Incorrect); p3 Skip question: page view resumes at chapter 3 word 0, where it fired.
# Pass 2, keys, RSVP: Up to chapter 2's last page, hold: Speed read, hold: Play: c0002 fires in RSVP. p1
# Skip question; p2 Reveal, Incorrect (nothing saved), hold: Reread in RSVP (the default), hold: Play,
# any key pauses inside the section: the reread place is saved; kill. Restart: ENTER on Home reopens the
# book on RSVP's reread pause screen at the saved word, Play highlighted, nothing playing. Up, Up, hold:
# Back to the question; Reveal, Correct (the file keeps Incorrect); p3 Skip question: RSVP resumes at
# chapter 3 word 0, the mode the checkpoint fired in.
description = "Kill during a reread in page view and in RSVP: reopening restores the reread in its mode at the saved place; the way back gives the same question with the answer hidden; the first grade stays; finishing resumes after the break in the original mode"

env = { vars = { CROSSPOINT_SIM_UPDATE_MS = "0", CROSSPOINT_SIM_CLEAR_MS = "0" } }

sd = [
  { src = "fixtures/books/fixture.prepared.epub", dst = "books/fixture.prepared.epub" },
  { json = { openEpubPath = "/books/fixture.prepared.epub", lastSleepFromReader = true }, dst = ".crosspoint/state.json" },
  { text = "{\"version\": 1, \"overrides\": {\"wpm\": 1000}}\n", dst = "books/fixture.prepared.epub.rsvp-state.json" },
]

steps = [
  { wait_log = "Progress saved: spine=0 offset=0 page=0", note = "booted into the book's title page" },

  # Pass 1: touch, a reread in page view.
  { tap = [240, 400], note = "centre tap: the toolbar" },
  { wait_log = "from clearScreen to displayBuffer" },
  { tap = [95, 752], note = "Contents" },
  { wait_log = "from clearScreen to displayBuffer" },
  { tap = [120, 532], note = "The Fog Season" },
  { wait_log = "Progress saved: spine=2 offset=0 page=0" },
  { swipe = [400, 400, 80, 400] },
  { wait_log = "Progress saved: spine=2 offset=\\d+ page=1" },
  { swipe = [400, 400, 80, 400] },
  { wait_log = "Progress saved: spine=2 offset=\\d+ page=2" },
  { swipe = [400, 400, 80, 400] },
  { wait_log = "Progress saved: spine=2 offset=\\d+ page=3" },
  { swipe = [400, 400, 80, 400] },
  { wait_log = "Progress saved: spine=2 offset=\\d+ page=4" },
  { swipe = [400, 400, 80, 400] },
  { wait_log = "Progress saved: spine=2 offset=\\d+ page=5" },
  { swipe = [400, 400, 80, 400] },
  { wait_log = "\\[CPT\\] fire source=next-page checkpoint=c0002 section=s0004 " },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { tap = [240, 476], note = "Reveal" },
  { wait_log = "\\[CTL\\] Answer armed" },
  { tap = [120, 620], note = "Correct" },
  { wait_log = "\\[CPT\\] screen=Prompt question=2/3 prompt=c0002-p2 recorded=none focus=Reveal " },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { tap = [240, 476], note = "Reveal" },
  { wait_log = "\\[CTL\\] Answer armed" },
  { tap = [360, 620], note = "Incorrect" },
  { wait_log = "\\[CTL\\] Incorrect armed" },
  { tap = [240, 348], note = "Reread in page view" },
  { wait_log = "\\[CPT\\] saved after=reread-page prompt=- grade=none active=c0002 prompt_index=1 position=none ok=1 reread=2:311:page" },
  { wait_log = "\\[CPT\\] reread bar shown" },
  { wait_log = "Progress saved: spine=2 offset=\\d+ page=3" },
  { swipe = [400, 400, 80, 400], note = "one page on, inside the section" },
  { wait_log = "\\[CPT\\] reread page ch=2 first=381 last=489 any=1 inside=1 word=381" },
  { wait_log = "\\[CPT\\] saved after=reread-moved prompt=- grade=none active=c0002 prompt_index=1 position=none ok=1 reread=2:381:page", note = "saved before the page shows" },
  { wait_log = "\\[CPT\\] reread bar shown top=773 " },
  { wait_log = "Progress saved: spine=2 offset=\\d+ page=4" },
  { shot = "t_before_kill_reread_page" },
  { kill = true, note = "power loss during the reread" },

  { expect_json = "books/fixture.prepared.epub.rsvp-state.json", pointer = "/active_checkpoint", equals = { id = "c0002", prompt_index = 1, resume = { chapter = 3, word = 0, mode = "page" }, reread = { mode = "page", chapter = 2, word = 381 } } },
  { expect_json = "books/fixture.prepared.epub.rsvp-state.json", pointer = "/grades/c0002-p2/first", equals = "incorrect" },
  { expect_json = "books/fixture.prepared.epub.rsvp-state.json", pointer = "/position", equals = { chapter = 2, word = 490, mode = "page" }, note = "not moved by the reread" },

  { start = true },
  { wait_log = "No known cover image for thumbnail", note = "after a kill the firmware boots to Home" },
  { tap = [240, 175], note = "the continue-reading card" },
  { wait_log = "\\[CPT\\] restore view=reread checkpoint=c0002 prompt=2/3 place=2:381:page resume=3:0:page notes=none " },
  { wait_log = "\\[CPT\\] restore open show=reread speed_read=0 jump=1 ch=2 offset=\\d+" },
  { wait_log = "\\[CPT\\] reread page ch=2 first=381 last=489 any=1 inside=1 word=381", note = "the saved page, not the reader's progress" },
  { wait_log = "\\[CPT\\] reread bar shown top=773 button=216,774,248,26 clear_of_text=1 label=\"Rereading\"" },
  { wait_log = "Progress saved: spine=2 offset=\\d+ page=4" },
  { screen_has = "Rereading | Back to the question" },
  { shot = "t_after_restore_reread_page" },
  { tap = [340, 787], note = "the bar's Back to the question" },
  { wait_log = "\\[CPT\\] reread end by=bar event=return-early accepted=1 state=prompt-hidden" },
  { wait_log = "\\[CPT\\] saved after=return-early prompt=- grade=none active=c0002 prompt_index=1 position=none ok=1 reread=none" },
  { wait_log = "\\[CPT\\] screen=Prompt question=2/3 prompt=c0002-p2 recorded=incorrect focus=Reveal ", note = "the same question, answer hidden" },
  { screen_has = "Recorded earlier: Incorrect" },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { tap = [240, 476], note = "Reveal (retry)" },
  { wait_log = "\\[CTL\\] Answer armed" },
  { tap = [120, 620], note = "Correct: the stored grade stays Incorrect" },
  { wait_log = "\\[CPT\\] event=correct prompt=c0002-p2 accepted=1 refusal=0 state=prompt-hidden grade_recorded=0 save=now" },
  { wait_log = "\\[CPT\\] screen=Prompt question=3/3 prompt=c0002-p3 recorded=none focus=Reveal " },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { tap = [364, 712], note = "Skip question: the last one" },
  { wait_log = "\\[CPT\\] end result=finished prompt=2 ch=3 word=0 mode=page saved=1" },
  { wait_log = "\\[CPT\\] page resume chapter ch=3 word=0 " },
  { wait_log = "Progress saved: spine=3 offset=0 page=0" },
  { screen_lacks = "Back to the question" },

  # Pass 2: keys, a reread in RSVP.
  { press = "UP" },
  { wait_log = "Progress saved: spine=2 offset=\\d+ page=5" },
  { press = "DOWN", hold_ms = 900, note = "hold: Speed read" },
  { wait_log = "\\[RSVP\\] enter ch=2 page_offset=\\d+ word=490 .* from=page" },
  { wait_log = "\\[CTL\\] Pause armed" },
  { press = "DOWN", hold_ms = 900, note = "Play" },
  { wait_log = "\\[CPT\\] fire source=rsvp-playback checkpoint=c0002 section=s0004 ", timeout_ms = 60000 },
  { wait_log = "\\[CPT\\] screen=Prompt question=1/3 prompt=c0002-p1 recorded=correct focus=Reveal " },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { press = "DOWN" },
  { wait_log = "\\[CTL\\] Prompt focus=SkipPrompt" },
  { press = "DOWN", hold_ms = 900, note = "Skip question" },
  { wait_log = "\\[CPT\\] screen=Prompt question=2/3 prompt=c0002-p2 recorded=incorrect focus=Reveal " },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { press = "DOWN", hold_ms = 900, note = "Reveal" },
  { wait_log = "\\[CTL\\] Answer armed" },
  { press = "DOWN" },
  { wait_log = "\\[CTL\\] Answer focus=Correct" },
  { press = "DOWN" },
  { wait_log = "\\[CTL\\] Answer focus=Incorrect" },
  { press = "DOWN", hold_ms = 900, note = "Incorrect: nothing saved" },
  { wait_log = "\\[CPT\\] screen=Incorrect question=2/3 prompt=c0002-p2 recorded=incorrect focus=RereadRsvp " },
  { wait_log = "\\[CTL\\] Incorrect armed" },
  { press = "DOWN", hold_ms = 900, note = "hold: Reread in RSVP (the default)" },
  { wait_log = "\\[CPT\\] saved after=reread-rsvp prompt=- grade=none active=c0002 prompt_index=1 position=none ok=1 reread=2:311:rsvp" },
  { wait_log = "\\[RSVP\\] pause screen focus=Play refresh=clear status=\"Rereading · " },
  { wait_log = "\\[CTL\\] Pause armed" },
  { press = "DOWN", hold_ms = 900, note = "Play" },
  { wait_log = "\\[RSVP\\] frame ch=2 first=330 " },
  { press = "DOWN", note = "any key pauses" },
  { wait_log = "\\[RSVP\\] pause reason=pause ch=2 word=3\\d\\d " },
  { wait_log = "\\[CPT\\] reread moved by=pause source=rsvp-playback mode=rsvp ch=2 word=3\\d\\d state=rereading left_section=0" },
  { wait_log = "\\[CPT\\] saved after=reread-moved prompt=- grade=none active=c0002 prompt_index=1 position=none ok=1 reread=2:3\\d\\d:rsvp", note = "saved before the pause screen shows" },
  { wait_log = "\\[RSVP\\] pause screen focus=Play refresh=clear status=\"Rereading · " },
  { wait_log = "\\[CTL\\] Pause armed" },
  { shot = "k_before_kill_reread_rsvp" },
  { kill = true, note = "power loss while the RSVP reread is paused" },

  { expect_schema = "books/fixture.prepared.epub.rsvp-state.json", schema = "tools/simtest/scenarios/cp_kill_in_reread/rsvp_killed.schema.json", note = "the reread in RSVP at a word of the section; resume after the break in RSVP" },
  { expect_json = "books/fixture.prepared.epub.rsvp-state.json", pointer = "/position", equals = { chapter = 2, word = 607, mode = "rsvp" }, note = "the frame on screen when it fired" },

  { start = true },
  { wait_log = "No known cover image for thumbnail" },
  { press = "ENTER", note = "reopen the book" },
  { wait_log = "\\[CPT\\] restore view=reread checkpoint=c0002 prompt=2/3 place=2:3\\d\\d:rsvp resume=3:0:rsvp notes=none " },
  { wait_log = "\\[CPT\\] restore open show=reread speed_read=1 jump=1 ch=2 offset=\\d+", note = "the reread's mode, RSVP, not the mode saved in position" },
  { wait_log = "Progress saved: spine=2 offset=\\d+ page=3", note = "the page under RSVP holds the reread word" },
  { wait_log = "\\[RSVP\\] enter ch=2 page_offset=\\d+ word=3\\d\\d .* from=reread" },
  { wait_log = "\\[RSVP\\] pause screen focus=Play refresh=clear status=\"Rereading · 1000 WPM target · -- actual\"", note = "paused, Play highlighted: nothing plays by itself" },
  { wait_log = "\\[CTL\\] Pause armed" },
  { screen_has = "Back to the question" },
  { shot = "k_after_restore_reread_rsvp" },
  { press = "UP" },
  { wait_log = "\\[CTL\\] Pause focus=SentenceBack" },
  { press = "UP" },
  { wait_log = "\\[CTL\\] Pause focus=BackToQuestion" },
  { press = "UP", hold_ms = 900, note = "Back to the question" },
  { wait_log = "\\[CPT\\] reread end by=pause-screen event=return-early accepted=1 state=prompt-hidden" },
  { wait_log = "\\[CPT\\] screen=Prompt question=2/3 prompt=c0002-p2 recorded=incorrect focus=Reveal " },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { press = "DOWN", hold_ms = 900, note = "Reveal (retry)" },
  { wait_log = "\\[CTL\\] Answer armed" },
  { press = "DOWN" },
  { wait_log = "\\[CTL\\] Answer focus=Correct" },
  { press = "DOWN", hold_ms = 900, note = "Correct: the stored grade stays Incorrect" },
  { wait_log = "\\[CPT\\] event=correct prompt=c0002-p2 accepted=1 refusal=0 state=prompt-hidden grade_recorded=0 save=now" },
  { wait_log = "\\[CPT\\] screen=Prompt question=3/3 prompt=c0002-p3 recorded=none focus=Reveal " },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { press = "DOWN" },
  { wait_log = "\\[CTL\\] Prompt focus=SkipPrompt" },
  { press = "DOWN", hold_ms = 900, note = "Skip question: the checkpoint ends" },
  { wait_log = "\\[CPT\\] end result=finished prompt=2 ch=3 word=0 mode=rsvp saved=1" },
  { wait_log = "\\[RSVP\\] pause screen focus=Play refresh=clear status=\"Checkpoint done · " },
  { wait_log = "\\[CTL\\] Pause armed" },
  { screen_has = "The Keeper's Log · chapter 0% " },
  { quit = true },

  { expect_json = "books/fixture.prepared.epub.rsvp-state.json", pointer = "/grades/c0002-p1/first", equals = "correct" },
  { expect_json = "books/fixture.prepared.epub.rsvp-state.json", pointer = "/grades/c0002-p2/first", equals = "incorrect", note = "the first grade, after two Corrects on retries" },
  { expect_json = "books/fixture.prepared.epub.rsvp-state.json", pointer = "/position", equals = { chapter = 3, word = 0, mode = "rsvp" } },
  { expect_schema = "books/fixture.prepared.epub.rsvp-state.json", schema = "tools/simtest/scenarios/cp_kill_in_reread/final.schema.json" },
  { expect_no_file = "books/fixture.prepared.epub.rsvp-state.json.*" },
  { compare = "t_after_restore_reread_page", same_as = "t_before_kill_reread_page", note = "the same page with the same bar" },
  { compare = "t_before_kill_reread_page" },
  { compare = "k_after_restore_reread_rsvp", same_as = "k_before_kill_reread_rsvp", mask = [[0, 0, 480, 40]], note = "the same pause screen; the status line's delivered WPM starts again (-- actual)" },
  { compare = "k_before_kill_reread_rsvp", mask = [[0, 0, 480, 40]] },
]
