# A power loss while a question shows (task C5; PRD criterion 4; docs/PLAN.md section 7: "Every
# transition saves state first, so closing the book at any point restores the same screen", and the
# restore order in "State file"). The prepared fixture's c0002 (section s0004, chapter 2 words 311-607,
# ends its chapter; resume chapter 3 word 0). The book's state file sets 1000 WPM.
#
# Pass 1, touch, fired in page view: p1 Reveal, Correct; p2 Reveal; kill with p2's answer on screen.
# The file: p1 correct, the checkpoint in progress at question 2 (prompt_index 1), resume 3:0:page.
# Restart: Home's continue-reading card reopens the book directly at question 2 of 3 with the answer
# hidden (the revealed state is not saved), before any page of the book is drawn. Sleep and wake: the
# firmware reopens the book at the same question (it was remembered although no page was drawn).
# Reveal, Correct; p3 Reveal, Correct: page view resumes at chapter 3 word 0.
# Pass 2, keys, fired in RSVP: Up to chapter 2's last page, hold: Speed read, hold: Play. p1 (recorded
# Correct) Reveal, Correct; p2 Reveal; kill. Restart: ENTER on Home reopens the book at question 2 of 3
# ("Recorded earlier: Correct"), answer hidden. Reveal, Incorrect (nothing saved: p2 has its first grade),
# Continue; p3 Skip question: RSVP opens at chapter 3 word 0, the mode the checkpoint fired in, paused.
description = "Kill while a question shows: reopening shows the same question with the answer hidden and earlier grades recorded; finishing resumes after the break in the mode the checkpoint fired in"

env = { vars = { CROSSPOINT_SIM_UPDATE_MS = "0", CROSSPOINT_SIM_CLEAR_MS = "0" } }

sd = [
  { src = "fixtures/books/fixture.prepared.epub", dst = "books/fixture.prepared.epub" },
  { json = { openEpubPath = "/books/fixture.prepared.epub", lastSleepFromReader = true }, dst = ".crosspoint/state.json" },
  { text = "{\"version\": 1, \"overrides\": {\"wpm\": 1000}}\n", dst = "books/fixture.prepared.epub.rsvp-state.json" },
]

steps = [
  { wait_log = "Progress saved: spine=0 offset=0 page=0", note = "booted into the book's title page" },

  # Pass 1: touch, page view.
  { tap = [240, 400], note = "centre tap: the toolbar" },
  { wait_log = "from clearScreen to displayBuffer" },
  { tap = [95, 752], note = "Contents" },
  { wait_log = "from clearScreen to displayBuffer" },
  { tap = [120, 532], note = "The Fog Season" },
  { wait_log = "Progress saved: spine=2 offset=0 page=0" },
  { swipe = [400, 400, 80, 400] },
  { wait_log = "Progress saved: spine=2 offset=\\d+ page=1" },
  { swipe = [400, 400, 80, 400] },
  { wait_log = "Progress saved: spine=2 offset=\\d+ page=2" },
  { swipe = [400, 400, 80, 400] },
  { wait_log = "Progress saved: spine=2 offset=\\d+ page=3" },
  { swipe = [400, 400, 80, 400] },
  { wait_log = "Progress saved: spine=2 offset=\\d+ page=4" },
  { swipe = [400, 400, 80, 400] },
  { wait_log = "Progress saved: spine=2 offset=\\d+ page=5" },
  { swipe = [400, 400, 80, 400], note = "leaving chapter 2's last page fires c0002" },
  { wait_log = "\\[CPT\\] fire source=next-page checkpoint=c0002 section=s0004 ch=2 last_word=607 resume_ch=3 resume_word=0 crossed=1" },
  { wait_log = "\\[CPT\\] screen=Prompt question=1/3 prompt=c0002-p1 recorded=none focus=Reveal " },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { tap = [240, 476], note = "Reveal" },
  { wait_log = "\\[CTL\\] Answer armed" },
  { tap = [120, 620], note = "Correct" },
  { wait_log = "\\[CPT\\] saved after=correct prompt=c0002-p1 grade=correct active=c0002 prompt_index=1 position=none ok=1", note = "saved before question 2 shows" },
  { wait_log = "\\[CPT\\] screen=Prompt question=2/3 prompt=c0002-p2 recorded=none focus=Reveal " },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { shot = "t_prompt2_first_shown" },
  { tap = [240, 476], note = "Reveal: not saved" },
  { wait_log = "\\[CPT\\] event=reveal prompt=c0002-p2 accepted=1 refusal=0 state=answer-shown grade_recorded=0 save=no" },
  { wait_log = "\\[CPT\\] screen=Answer question=2/3 prompt=c0002-p2 recorded=none " },
  { wait_log = "\\[CTL\\] Answer armed" },
  { shot = "t_before_kill_answer_shown" },
  { kill = true, note = "power loss with question 2's answer on screen" },

  { expect_json = "books/fixture.prepared.epub.rsvp-state.json", pointer = "/active_checkpoint", equals = { id = "c0002", prompt_index = 1, resume = { chapter = 3, word = 0, mode = "page" } }, note = "question 2 in progress; no reread; the answer's state is not saved" },
  { expect_json = "books/fixture.prepared.epub.rsvp-state.json", pointer = "/grades/c0002-p1/first", equals = "correct" },
  { expect_json = "books/fixture.prepared.epub.rsvp-state.json", pointer = "/position", equals = { chapter = 2, word = 490, mode = "page" }, note = "before the break, written when it fired" },
  { expect_schema = "books/fixture.prepared.epub.rsvp-state.json", schema = "tools/simtest/scenarios/cp_kill_in_prompt/killed.schema.json" },
  { expect_no_file = "books/fixture.prepared.epub.rsvp-state.json.*", note = "no temporary or set-aside file" },

  { start = true },
  { wait_log = "No known cover image for thumbnail", note = "after a kill the firmware boots to Home" },
  { tap = [240, 175], note = "the continue-reading card" },
  { wait_log = "\\[RSVP\\] book state read mode=page ch=2 word=490" },
  { wait_log = "\\[CPT\\] restore view=prompt checkpoint=c0002 prompt=2/3 place=3:0:page resume=3:0:page notes=none progress_bytes=\\d+" },
  { wait_log = "\\[CPT\\] restore open show=prompt speed_read=0 jump=0 " },
  { wait_log = "\\[CPT\\] back checkpoint=c0002 prompt=2/3 mode=page " },
  { wait_log = "\\[CPT\\] screen=Prompt question=2/3 prompt=c0002-p2 recorded=none focus=Reveal ", note = "the answer is hidden" },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { screen_lacks = "Loading", note = "no page of the book was drawn first" },
  { shot = "t_after_restore_prompt2" },
  { sleep = true, note = "sleep while the restored question shows: no page was drawn, the book must still reopen" },
  { wait_log = "Entering deep sleep" },
  { wake = "POWER" },
  { wait_log = "\\[CPT\\] restore view=prompt checkpoint=c0002 prompt=2/3 place=3:0:page resume=3:0:page notes=none ", note = "the firmware reopened the book by itself" },
  { wait_log = "\\[CPT\\] screen=Prompt question=2/3 prompt=c0002-p2 recorded=none focus=Reveal " },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { tap = [240, 476], note = "Reveal" },
  { wait_log = "\\[CTL\\] Answer armed" },
  { tap = [120, 620], note = "Correct" },
  { wait_log = "\\[CPT\\] saved after=correct prompt=c0002-p2 grade=correct active=c0002 prompt_index=2 position=none ok=1" },
  { wait_log = "\\[CPT\\] screen=Prompt question=3/3 prompt=c0002-p3 recorded=none focus=Reveal " },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { tap = [240, 476], note = "Reveal" },
  { wait_log = "\\[CTL\\] Answer armed" },
  { tap = [120, 620], note = "Correct" },
  { wait_log = "\\[CPT\\] saved after=correct prompt=c0002-p3 grade=correct active=none prompt_index=0 position=3:0:page ok=1" },
  { wait_log = "\\[CPT\\] end result=finished prompt=2 ch=3 word=0 mode=page saved=1" },
  { wait_log = "\\[CPT\\] resume end=finished mode=page ch=3 word=0 reread=1" },
  { wait_log = "\\[CPT\\] page resume chapter ch=3 word=0 " },
  { wait_log = "Progress saved: spine=3 offset=0 page=0", note = "page view after the break" },

  # Pass 2: keys, RSVP.
  { press = "UP" },
  { wait_log = "Progress saved: spine=2 offset=\\d+ page=5" },
  { press = "DOWN", hold_ms = 900, note = "hold: Speed read" },
  { wait_log = "\\[RSVP\\] enter ch=2 page_offset=\\d+ word=490 .* from=page" },
  { wait_log = "\\[CTL\\] Pause armed" },
  { press = "DOWN", hold_ms = 900, note = "Play" },
  { wait_log = "\\[CPT\\] fire source=rsvp-playback checkpoint=c0002 section=s0004 ch=2 last_word=607 resume_ch=3 resume_word=0 crossed=1", timeout_ms = 60000 },
  { wait_log = "\\[CPT\\] screen=Prompt question=1/3 prompt=c0002-p1 recorded=correct focus=Reveal " },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { press = "DOWN", hold_ms = 900, note = "Reveal" },
  { wait_log = "\\[CTL\\] Answer armed" },
  { press = "DOWN" },
  { wait_log = "\\[CTL\\] Answer focus=Correct" },
  { press = "DOWN", hold_ms = 900, note = "Correct" },
  { wait_log = "\\[CPT\\] saved after=correct prompt=- grade=none active=c0002 prompt_index=1 position=none ok=1" },
  { wait_log = "\\[CPT\\] screen=Prompt question=2/3 prompt=c0002-p2 recorded=correct focus=Reveal " },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { press = "DOWN", hold_ms = 900, note = "Reveal: not saved" },
  { wait_log = "\\[CPT\\] screen=Answer question=2/3 prompt=c0002-p2 recorded=correct " },
  { wait_log = "\\[CTL\\] Answer armed" },
  { shot = "k_before_kill_answer_shown" },
  { kill = true, note = "power loss with question 2's answer on screen, in an RSVP checkpoint" },

  { expect_json = "books/fixture.prepared.epub.rsvp-state.json", pointer = "/active_checkpoint", equals = { id = "c0002", prompt_index = 1, resume = { chapter = 3, word = 0, mode = "rsvp" } } },
  { expect_json = "books/fixture.prepared.epub.rsvp-state.json", pointer = "/position", equals = { chapter = 2, word = 607, mode = "rsvp" }, note = "the frame on screen when it fired" },
  { expect_schema = "books/fixture.prepared.epub.rsvp-state.json", schema = "tools/simtest/scenarios/cp_kill_in_prompt/killed.schema.json" },

  { start = true },
  { wait_log = "No known cover image for thumbnail" },
  { press = "ENTER", note = "reopen the book (the card is selected)" },
  { wait_log = "\\[RSVP\\] book state read mode=rsvp ch=2 word=607" },
  { wait_log = "\\[CPT\\] restore view=prompt checkpoint=c0002 prompt=2/3 place=3:0:rsvp resume=3:0:rsvp notes=none " },
  { wait_log = "\\[CPT\\] restore open show=prompt speed_read=0 jump=0 ", note = "not RSVP's pause screen: the prompt first" },
  { wait_log = "\\[CPT\\] screen=Prompt question=2/3 prompt=c0002-p2 recorded=correct focus=Reveal " },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { screen_has = "Recorded earlier: Correct" },
  { shot = "k_after_restore_prompt2" },
  { press = "DOWN", hold_ms = 900, note = "Reveal" },
  { wait_log = "\\[CTL\\] Answer armed" },
  { press = "DOWN" },
  { wait_log = "\\[CTL\\] Answer focus=Correct" },
  { press = "DOWN" },
  { wait_log = "\\[CTL\\] Answer focus=Incorrect" },
  { press = "DOWN", hold_ms = 900, note = "Incorrect: p2 has its first grade, nothing is saved" },
  { wait_log = "\\[CPT\\] event=incorrect prompt=c0002-p2 accepted=1 refusal=0 state=incorrect-choice grade_recorded=0 save=no" },
  { wait_log = "\\[CPT\\] screen=Incorrect question=2/3 prompt=c0002-p2 recorded=correct focus=RereadRsvp ", note = "the reread in the mode the checkpoint fired in" },
  { wait_log = "\\[CTL\\] Incorrect armed" },
  { press = "DOWN" },
  { wait_log = "\\[CTL\\] Incorrect focus=RereadPage" },
  { press = "DOWN" },
  { wait_log = "\\[CTL\\] Incorrect focus=Continue" },
  { press = "DOWN", hold_ms = 900, note = "Continue" },
  { wait_log = "\\[CPT\\] screen=Prompt question=3/3 prompt=c0002-p3 recorded=correct focus=Reveal " },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { press = "DOWN" },
  { wait_log = "\\[CTL\\] Prompt focus=SkipPrompt" },
  { press = "DOWN", hold_ms = 900, note = "Skip question: the last one, the checkpoint ends" },
  { wait_log = "\\[CPT\\] end result=finished prompt=2 ch=3 word=0 mode=rsvp saved=1" },
  { wait_log = "\\[CPT\\] resume end=finished mode=rsvp ch=3 word=0 reread=1" },
  { wait_log = "\\[CPT\\] page resume rsvp ch=3 word=0" },
  { wait_log = "Progress saved: spine=3 offset=0 page=0", note = "the page under RSVP, drawn first: no page was shown before the prompt" },
  { wait_log = "\\[RSVP\\] enter ch=\\d+ page_offset=\\d+ word=\\d+ .* from=checkpoint" },
  { wait_log = "\\[RSVP\\] pause screen focus=Play refresh=clear status=\"Checkpoint done · 1000 WPM target · -- actual\"", note = "RSVP after the break, paused" },
  { wait_log = "\\[CTL\\] Pause armed" },
  { screen_has = "The Keeper's Log · chapter 0% " },
  { quit = true },

  { expect_json = "books/fixture.prepared.epub.rsvp-state.json", pointer = "/grades/c0002-p1/first", equals = "correct" },
  { expect_json = "books/fixture.prepared.epub.rsvp-state.json", pointer = "/grades/c0002-p2/first", equals = "correct", note = "the later Incorrect changed nothing" },
  { expect_json = "books/fixture.prepared.epub.rsvp-state.json", pointer = "/grades/c0002-p3/first", equals = "correct" },
  { expect_json = "books/fixture.prepared.epub.rsvp-state.json", pointer = "/position", equals = { chapter = 3, word = 0, mode = "rsvp" } },
  { expect_schema = "books/fixture.prepared.epub.rsvp-state.json", schema = "tools/simtest/scenarios/cp_kill_in_prompt/final.schema.json" },
  { expect_no_file = "books/fixture.prepared.epub.rsvp-state.json.*" },
  { compare = "t_after_restore_prompt2", same_as = "t_prompt2_first_shown", note = "the same screen as before the reveal: answer hidden" },
  { compare = "t_before_kill_answer_shown" },
  { compare = "t_prompt2_first_shown" },
  { compare = "k_before_kill_answer_shown" },
  { compare = "k_after_restore_prompt2" },
]
