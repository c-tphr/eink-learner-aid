# Non-prose items by touch (task R5; docs/PLAN.md section 1, "Non-prose content"; S4 rows 15-16).
# Word positions from fixtures/books/fixture.expected.json (firmware spine = chapter number): chapter 1
# has the lighthouse figure (an IMAGE marker before word 108, the caption "Figure 1. ..." is prose) and
# a footnote reference mark after word 183 ("one."); chapter 2 a table (words 161-202, two pages);
# chapter 3 a code block (words 116-140). Endnotes (spine 4) are all note text.
#
# 1. Image, Continue. RSVP from chapter 1, page 1; eight sentence steps to word 101; Play. After
#    "climb." (107) RSVP hands over to page view on page 2, which starts with the figure, with the banner.
#    The banner stays up 3 s (viewing the item); Continue opens RSVP at word 108 with Play highlighted
#    (plan section 6: RSVP always waits for Play). Play, pause: one session, one audit segment, every
#    word once, and the 3 s on the banner are not playback time.
# 2. Footnote mark. Sentence steps to "Dr. Vane had read about such lenses, but she had never stood
#    beside one." and Play: the mark "1" is not shown ("one." is the frame) and nothing pauses there.
# 3. Table, swipe. Page view, swipe on to chapter 2, page 2; RSVP; two sentence steps; Play. RSVP hands
#    over at the table's first page with the table banner. A page-turn swipe is Stay and turns the page:
#    page 3 shows the rest of the table. Swipe back, RSVP from page 2 again, Play: the same banner; a
#    left-edge swipe (Back) is Stay. Once more: a tap on Stay leaves page view in place. Each Stay
#    writes the state file's mode as page.
# 4. Code block, restart. Swipe on to chapter 3; RSVP; six sentence steps to word 102; Play. The code
#    block banner. The light panel (top-edge swipe) opens over it and closes again: the reader draws
#    the page again and the banner returns. SIGKILL while it shows; restart and reopen the book from
#    its Home card (a kill with the reader open boots to Home): the reader shows the code block's page
#    and RSVP opens by itself at word 141, after the code block.
# 5. End of the book: from chapter 3's last page, Play to its end; the endnotes document holds no
#    prose word, so playback passes over it and pauses with "End of the book".
description = "Non-prose items by touch: image Continue, table Stay (swipe, Back, tap), code block restart, footnote mark, end of book"

timeout_s = 300
env = { vars = { CROSSPOINT_SIM_UPDATE_MS = "0", CROSSPOINT_SIM_CLEAR_MS = "0" } }

sd = [
  { src = "fixtures/books/fixture.epub", dst = "books/fixture.epub" },
  { json = { openEpubPath = "/books/fixture.epub", lastSleepFromReader = true }, dst = ".crosspoint/state.json" },
]

