# A reread in RSVP that returns to the prompt by itself at the section's end (task C4; PRD criterion 2;
# docs/PLAN.md section 7, "Trigger rules" sixth bullet and "Per-prompt flow" points 4-6; S4 rows 30 and
# 32). The prepared fixture's c0002 (section s0004, chapter 2 words 311-607, ends its chapter). The book's
# state file sets 1000 WPM so the reread plays in about 20 s.
#
# Pass 1, touch: chapter 2's last page, Speed read, Play: c0002 fires after "lamp.". p1 Reveal, Correct;
# p2 Reveal, Incorrect, Reread in RSVP. RSVP's pause screen at word 311 with "Back to the question" and
# the status "Rereading"; Play plays the section again and stops after "lamp." (the section's own
# checkpoint does not fire: step=reread-end); p2 comes back by itself with its answer hidden and
# "Recorded earlier: Incorrect". Reveal, Correct (the stored grade stays Incorrect); p3 Reveal, Correct.
# RSVP resumes at chapter 3 word 0, "Checkpoint done".
# Pass 2, keys: Page view, Up to chapter 2's last page, hold: Speed read, hold: Play; c0002 fires again.
# p1 Skip question; p2 Reveal, Incorrect (nothing saved: it has a first grade), hold on the default
# Reread in RSVP, hold: Play, the prompt comes back at the end; Reveal, Correct; p3 Skip question. RSVP
# resumes at chapter 3 word 0 again. The grades are pass 1's: p1 correct, p2 incorrect, p3 correct.
description = "Reread in RSVP after Incorrect: the section plays again, its checkpoint does not fire, the prompt returns by itself at the end with the answer hidden; Correct keeps the stored Incorrect; resume after the break in RSVP"

env = { vars = { CROSSPOINT_SIM_UPDATE_MS = "0", CROSSPOINT_SIM_CLEAR_MS = "0" } }

sd = [
  { src = "fixtures/books/fixture.prepared.epub", dst = "books/fixture.prepared.epub" },
  { json = { openEpubPath = "/books/fixture.prepared.epub", lastSleepFromReader = true }, dst = ".crosspoint/state.json" },
  { text = "{\"version\": 1, \"overrides\": {\"wpm\": 1000}}\n", dst = "books/fixture.prepared.epub.rsvp-state.json" },
]

steps = [
  { wait_log = "Progress saved: spine=0 offset=0 page=0", note = "booted into the book's title page" },

  # Pass 1: touch.
  { tap = [240, 400], note = "centre tap: the toolbar" },
  { wait_log = "from clearScreen to displayBuffer" },
  { tap = [95, 752], note = "Contents" },
  { wait_log = "from clearScreen to displayBuffer" },
  { tap = [120, 532], note = "The Fog Season" },
  { wait_log = "Progress saved: spine=2 offset=0 page=0" },
  { swipe = [400, 400, 80, 400] },
  { wait_log = "Progress saved: spine=2 offset=\\d+ page=1" },
  { swipe = [400, 400, 80, 400] },
  { wait_log = "Progress saved: spine=2 offset=\\d+ page=2" },
  { swipe = [400, 400, 80, 400] },
  { wait_log = "Progress saved: spine=2 offset=\\d+ page=3" },
  { swipe = [400, 400, 80, 400] },
  { wait_log = "Progress saved: spine=2 offset=\\d+ page=4" },
  { swipe = [400, 400, 80, 400] },
  { wait_log = "Progress saved: spine=2 offset=\\d+ page=5" },
  { tap = [240, 400], note = "centre tap: the toolbar" },
  { wait_log = "from clearScreen to displayBuffer" },
  { tap = [385, 752], note = "More" },
  { wait_screen = "More | 1/3" },
  { tap = [240, 388], note = "Speed read" },
  { wait_log = "\\[RSVP\\] enter ch=2 page_offset=\\d+ word=490 .* from=page" },
  { wait_log = "\\[CTL\\] Pause armed" },
  { tap = [240, 340], note = "Play" },
  { wait_log = "\\[CPT\\] fire source=rsvp-playback checkpoint=c0002 section=s0004 ch=2 last_word=607 resume_ch=3 resume_word=0 crossed=1", timeout_ms = 60000 },
  { wait_log = "\\[CPT\\] screen=Prompt question=1/3 prompt=c0002-p1 recorded=none focus=Reveal " },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { tap = [240, 476], note = "Reveal" },
  { wait_log = "\\[CTL\\] Answer armed" },
  { tap = [120, 620], note = "Correct" },
  { wait_log = "\\[CPT\\] saved after=correct prompt=c0002-p1 grade=correct active=c0002 prompt_index=1 position=none ok=1" },
  { wait_log = "\\[CPT\\] screen=Prompt question=2/3 prompt=c0002-p2 recorded=none focus=Reveal " },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { tap = [240, 476], note = "Reveal" },
  { wait_log = "\\[CTL\\] Answer armed" },
  { tap = [360, 620], note = "Incorrect" },
  { wait_log = "\\[CPT\\] saved after=incorrect prompt=c0002-p2 grade=incorrect active=c0002 prompt_index=1 position=none ok=1" },
  { wait_log = "\\[CPT\\] screen=Incorrect question=2/3 prompt=c0002-p2 recorded=incorrect focus=RereadRsvp " },
  { wait_log = "\\[CTL\\] Incorrect armed" },
  { tap = [240, 256], note = "Reread in RSVP" },
  { wait_log = "\\[CPT\\] saved after=reread-rsvp prompt=- grade=none active=c0002 prompt_index=1 position=none ok=1 reread=2:311:rsvp", note = "written before the reread screen: active_checkpoint with reread, resume unchanged" },
  { wait_log = "\\[CPT\\] end result=reread-rsvp prompt=1 ch=2 word=311 mode=rsvp saved=1" },
  { wait_log = "\\[CPT\\] reread start mode=rsvp checkpoint=c0002 section=s0004 prompt=1 ch=2 start=311 last_word=607" },
  { wait_log = "\\[RSVP\\] reread ch=2 word=311" },
  { wait_log = "\\[RSVP\\] pause screen focus=Play refresh=clear status=\"Rereading · 1000 WPM target · \\d+ actual\"" },
  { wait_log = "\\[CTL\\] Pause armed" },
  { screen_has = "Back to the question" },
  { screen_has = "The Visitor from the Mainland On the", note = "where Play starts: the next words, moved to the row above the key hint" },
  { shot = "t_rsvp_reread_pause" },
  { tap = [240, 340], note = "Play: the section again" },
  { wait_log = "\\[RSVP\\] play ch=2 word=311 wpm=1000 words_per_update=1" },
  { wait_log = "\\[RSVP\\] frame ch=2 first=607 last=607 words=1 .* text=\"lamp.\"", timeout_ms = 90000 },
  { wait_log = "\\[CPT\\] rsvp stop ch=2 last=607 next=\\d+ step=reread-end reread=s0004", note = "the section's own checkpoint is suppressed" },
  { wait_log = "\\[RSVP\\] pause reason=reread-end ch=2 word=608 .* audit=ok .* violations=0 ", note = "the jump back is a new audit segment, not a violation" },
  { wait_log = "\\[CPT\\] reread end by=rsvp-playback event=reread-reached-end accepted=1 state=prompt-hidden" },
  { wait_log = "\\[CPT\\] saved after=reread-reached-end prompt=- grade=none active=c0002 prompt_index=1 position=none ok=1 reread=none" },
  { wait_log = "\\[CPT\\] back checkpoint=c0002 prompt=2/3 mode=rsvp " },
  { wait_log = "\\[CPT\\] screen=Prompt question=2/3 prompt=c0002-p2 recorded=incorrect focus=Reveal ", note = "the same prompt, answer hidden" },
  { screen_has = "Recorded earlier: Incorrect" },
  { shot = "t_prompt_after_reread" },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { tap = [240, 476], note = "Reveal (retry)" },
  { wait_log = "\\[CPT\\] screen=Answer question=2/3 prompt=c0002-p2 recorded=incorrect " },
  { wait_log = "\\[CTL\\] Answer armed" },
  { tap = [120, 620], note = "Correct: moves on; the stored grade stays Incorrect" },
  { wait_log = "\\[CPT\\] event=correct prompt=c0002-p2 accepted=1 refusal=0 state=prompt-hidden grade_recorded=0 save=now" },
  { wait_log = "\\[CPT\\] saved after=correct prompt=- grade=none active=c0002 prompt_index=2 position=none ok=1" },
  { wait_log = "\\[CPT\\] screen=Prompt question=3/3 prompt=c0002-p3 recorded=none focus=Reveal " },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { tap = [240, 476], note = "Reveal" },
  { wait_log = "\\[CTL\\] Answer armed" },
  { tap = [120, 620], note = "Correct" },
  { wait_log = "\\[CPT\\] saved after=correct prompt=c0002-p3 grade=correct active=none prompt_index=0 position=3:0:rsvp ok=1" },
  { wait_log = "\\[CPT\\] end result=finished prompt=2 ch=3 word=0 mode=rsvp saved=1" },
  { wait_log = "\\[CPT\\] resume end=finished mode=rsvp ch=3 word=0 reread=1" },
  { wait_log = "\\[RSVP\\] pause screen focus=Play refresh=clear status=\"Checkpoint done · 1000 WPM target · \\d+ actual\"" },
  { wait_log = "\\[CTL\\] Pause armed" },
  { screen_has = "The Keeper's Log · chapter 0% " },

  # Pass 2: keys.
  { press = "UP" },
  { wait_log = "\\[CTL\\] Pause focus=SentenceBack" },
  { press = "UP" },
  { wait_log = "\\[CTL\\] Pause focus=PageView" },
  { press = "UP", hold_ms = 900, note = "Page view" },
  { wait_log = "\\[RSVP\\] leave to=page-view ch=3 word=0 " },
  { wait_log = "Progress saved: spine=3 offset=0 page=0" },
  { press = "UP" },
  { wait_log = "Progress saved: spine=2 offset=\\d+ page=5" },
  { press = "DOWN", hold_ms = 900, note = "hold: Speed read" },
  { wait_log = "\\[RSVP\\] enter ch=2 page_offset=\\d+ word=490 .* from=page" },
  { wait_log = "\\[CTL\\] Pause armed" },
  { press = "DOWN", hold_ms = 900, note = "Play" },
  { wait_log = "\\[CPT\\] fire source=rsvp-playback checkpoint=c0002 section=s0004 ", timeout_ms = 60000 },
  { wait_log = "\\[CPT\\] screen=Prompt question=1/3 prompt=c0002-p1 recorded=correct focus=Reveal " },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { press = "DOWN" },
  { wait_log = "\\[CTL\\] Prompt focus=SkipPrompt" },
  { press = "DOWN", hold_ms = 900, note = "Skip question" },
  { wait_log = "\\[CPT\\] screen=Prompt question=2/3 prompt=c0002-p2 recorded=incorrect focus=Reveal " },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { press = "DOWN", hold_ms = 900, note = "Reveal" },
  { wait_log = "\\[CTL\\] Answer armed" },
  { press = "DOWN" },
  { wait_log = "\\[CTL\\] Answer focus=Correct" },
  { press = "DOWN" },
  { wait_log = "\\[CTL\\] Answer focus=Incorrect" },
  { press = "DOWN", hold_ms = 900, note = "Incorrect: p2 already has its first grade, nothing is saved" },
  { wait_log = "\\[CPT\\] event=incorrect prompt=c0002-p2 accepted=1 refusal=0 state=incorrect-choice grade_recorded=0 save=no" },
  { wait_log = "\\[CPT\\] screen=Incorrect question=2/3 prompt=c0002-p2 recorded=incorrect focus=RereadRsvp " },
  { wait_log = "\\[CTL\\] Incorrect armed" },
  { press = "DOWN", hold_ms = 900, note = "hold: Reread in RSVP (the default)" },
  { wait_log = "\\[CPT\\] saved after=reread-rsvp prompt=- grade=none active=c0002 prompt_index=1 position=none ok=1 reread=2:311:rsvp" },
  { wait_log = "\\[RSVP\\] pause screen focus=Play refresh=clear status=\"Rereading · " },
  { wait_log = "\\[CTL\\] Pause armed" },
  { press = "DOWN", hold_ms = 900, note = "Play" },
  { wait_log = "\\[RSVP\\] play ch=2 word=311 wpm=1000 words_per_update=1" },
  { wait_log = "\\[CPT\\] rsvp stop ch=2 last=607 next=\\d+ step=reread-end reread=s0004", timeout_ms = 90000 },
  { wait_log = "\\[CPT\\] screen=Prompt question=2/3 prompt=c0002-p2 recorded=incorrect focus=Reveal " },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { press = "DOWN", hold_ms = 900, note = "Reveal" },
  { wait_log = "\\[CTL\\] Answer armed" },
  { press = "DOWN" },
  { wait_log = "\\[CTL\\] Answer focus=Correct" },
  { press = "DOWN", hold_ms = 900, note = "Correct" },
  { wait_log = "\\[CPT\\] event=correct prompt=c0002-p2 accepted=1 refusal=0 state=prompt-hidden grade_recorded=0 save=now" },
  { wait_log = "\\[CPT\\] screen=Prompt question=3/3 prompt=c0002-p3 recorded=correct focus=Reveal " },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { press = "DOWN" },
  { wait_log = "\\[CTL\\] Prompt focus=SkipPrompt" },
  { press = "DOWN", hold_ms = 900, note = "Skip question: the last prompt, the checkpoint ends" },
  { wait_log = "\\[CPT\\] end result=finished prompt=2 ch=3 word=0 mode=rsvp saved=1" },
  { wait_log = "\\[RSVP\\] pause screen focus=Play refresh=clear status=\"Checkpoint done · " },
  { wait_log = "\\[CTL\\] Pause armed" },
  { quit = true },

  { expect_json = "books/fixture.prepared.epub.rsvp-state.json", pointer = "/grades/c0002-p1/first", equals = "correct" },
  { expect_json = "books/fixture.prepared.epub.rsvp-state.json", pointer = "/grades/c0002-p2/first", equals = "incorrect" },
  { expect_json = "books/fixture.prepared.epub.rsvp-state.json", pointer = "/grades/c0002-p3/first", equals = "correct" },
  { expect_json = "books/fixture.prepared.epub.rsvp-state.json", pointer = "/position", equals = { chapter = 3, word = 0, mode = "rsvp" } },
  { expect_schema = "books/fixture.prepared.epub.rsvp-state.json", schema = "tools/simtest/scenarios/cp_reread_rsvp_end/final.schema.json" },
  { compare = "t_rsvp_reread_pause", mask = [[0, 0, 480, 24]] },
  { compare = "t_prompt_after_reread" },
]
