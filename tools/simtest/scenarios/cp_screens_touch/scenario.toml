  { tap = [240, 476], note = "Reveal" },
  { wait_log = "\\[CPT\\] screen=Answer question=1/3 prompt=c0002-p1 " },
  { wait_log = "\\[CTL\\] Answer armed" },
  { tap = [360, 620], note = "Incorrect, again: the first grade is already recorded" },
  { wait_log = "\\[CPT\\] event=incorrect prompt=c0002-p1 accepted=1 refusal=0 state=incorrect-choice grade_recorded=0 save=no" },
  { wait_log = "\\[CPT\\] screen=Incorrect question=1/3 prompt=c0002-p1 recorded=incorrect focus=RereadPage " },
  { wait_log = "\\[CTL\\] Incorrect armed" },
  { tap = [364, 712], note = "Skip question" },
  { wait_log = "\\[CTL\\] Incorrect select=SkipPrompt" },
  { wait_log = "\\[CPT\\] saved after=skip-prompt prompt=- grade=none active=c0002 prompt_index=1 position=none ok=1" },
  { wait_log = "\\[CPT\\] screen=Prompt question=2/3 prompt=c0002-p2 recorded=none focus=Reveal " },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { tap = [240, 476], note = "Reveal" },
  { wait_log = "\\[CPT\\] screen=Answer question=2/3 prompt=c0002-p2 " },
  { wait_log = "\\[CTL\\] Answer armed" },
  { tap = [360, 620], note = "Incorrect" },
  { wait_log = "\\[CPT\\] saved after=incorrect prompt=c0002-p2 grade=incorrect active=c0002 prompt_index=1 position=none ok=1" },
  { wait_log = "\\[CPT\\] screen=Incorrect question=2/3 prompt=c0002-p2 recorded=incorrect focus=RereadPage " },
  { wait_log = "\\[CTL\\] Incorrect armed" },
  { tap = [116, 712], note = "Skip checkpoint" },
  { wait_log = "\\[CTL\\] Incorrect select=SkipCheckpoint" },
  { wait_log = "\\[CPT\\] end result=skipped prompt=1 ch=3 word=0 mode=page saved=1" },

  # E: Reread in RSVP.
  { wait_log = "\\[CPT\\] screen=Prompt question=1/3 prompt=c0002-p1 recorded=incorrect focus=Reveal " },
