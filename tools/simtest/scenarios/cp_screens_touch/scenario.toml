  { wait_log = "Progress saved: spine=0 offset=0 page=0", note = "booted into the book's title page" },

  # A: c0001, one prompt, reached by swiping forward off chapter 1's page 3.
  { swipe = [400, 400, 80, 400] },
  { wait_log = "Progress saved: spine=1 offset=0 page=0" },
  { swipe = [400, 400, 80, 400] },
  { wait_log = "Progress saved: spine=1 offset=\\d+ page=1" },
  { swipe = [400, 400, 80, 400] },
  { wait_log = "Progress saved: spine=1 offset=\\d+ page=2" },
  { swipe = [400, 400, 80, 400], note = "leaving the page that shows s0001's last word" },
  { wait_log = "\\[CPT\\] fire source=next-page checkpoint=c0001 " },
  { wait_log = "\\[CPT\\] open checkpoint=c0001 prompts=1 section=s0001 mode=page .* state=read grades=0 " },
  { wait_log = "\\[CPT\\] saved after=start prompt=- grade=none active=c0001 prompt_index=0 position=1:184:page ok=1", note = "the checkpoint in progress and the position before the break" },
