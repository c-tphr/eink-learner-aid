  # C: Skip question on the answer screen, Skip checkpoint on the answer screen.
  { wait_log = "\\[CPT\\] open checkpoint=c0002 prompts=3 section=s0004 mode=page .* grades=2 " },
  { wait_log = "\\[CPT\\] screen=Prompt question=1/3 prompt=c0002-p1 recorded=incorrect focus=Reveal " },
  { screen_has = "Recorded earlier: Incorrect" },
  { shot = "c_prompt1_recorded" },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { tap = [240, 476], note = "Reveal" },
