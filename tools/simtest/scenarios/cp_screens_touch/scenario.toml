  { quit = true },

  { expect_json = "books/fixture.prepared.epub.rsvp-state.json", pointer = "/book_sha256", equals = "9b35113fe38d8374524edd01a5ef06e20f3035e1fdb4232eb0ed58e0a16ca92c" },
  { expect_json = "books/fixture.prepared.epub.rsvp-state.json", pointer = "/grades/c0001-p1/first", equals = "correct" },
  { expect_json = "books/fixture.prepared.epub.rsvp-state.json", pointer = "/grades/c0002-p1/first", equals = "incorrect" },
  { expect_json = "books/fixture.prepared.epub.rsvp-state.json", pointer = "/grades/c0002-p2/first", equals = "incorrect" },
  { expect_schema = "books/fixture.prepared.epub.rsvp-state.json", schema = "tools/simtest/scenarios/cp_screens_touch/state.schema.json", note = "exactly three grades: c0002-p3 was only skipped" },
  { expect_json = "books/fixture.prepared.epub.rsvp-state.json", pointer = "/position", equals = { chapter = 3, word = 0, mode = "page" } },
  { expect_json = "books/fixture.prepared.epub.rsvp-state.json", pointer = "/active_checkpoint", equals = { id = "c0002", prompt_index = 0, resume = { chapter = 3, word = 0, mode = "rsvp" }, reread = { mode = "page", chapter = 2, word = 311 } } },
  { expect_file = ".crosspoint/epub_*/rsvp/checkpoints-*-2805.json", contains = "\"rsvp-checkpoints\"" },
