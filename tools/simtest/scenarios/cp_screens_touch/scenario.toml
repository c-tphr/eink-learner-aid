# The checkpoint screens by touch only (task C3a; docs/spikes/S4-control-map.md rows 17-29, touch
# tokens of section 9). Six checkpoints of the prepared fixture, each reached by reading (task C3;
# C3a used a temporary simulator entry): c0001 (one prompt) by swiping forward off chapter 1's page 3
# (the end of s0001), then c0002 (three prompts) five times: by swiping on off chapter 2's last page
# (s0004 ends the chapter), then three times by a swipe back to that page and forward again, and
# the sixth time in RSVP (Speed read from the toolbar's More panel, Play). E and F start the reread
# (task C4), go back to the question at once and skip the checkpoint, so reading resumes after the
# break in the mode it fired in (E in page view, F on RSVP's pause screen) and the file then holds no
# checkpoint in progress. Every action of the three screens is done once by a tap:
#
#   A c0001             Reveal, Correct                                        -> finished
#   B c0002             p1 Reveal, Incorrect, Continue; p2 Skip question;
#                       p3 Skip checkpoint (prompt screen)                     -> skipped
#   C c0002             p1 ("recorded earlier: Incorrect") Reveal, tap the one-part answer box
#                       (nothing to page), Skip question (answer screen);
#                       p2 Reveal, Skip checkpoint (answer screen)             -> skipped
#   D c0002             p1 Reveal, Incorrect (already recorded: nothing saved),
#                       Skip question (after Incorrect); p2 Reveal, Incorrect,
#                       Skip checkpoint (after Incorrect)                      -> skipped
#   E c0002             p1 Reveal, Incorrect, Reread in RSVP                   -> reread-rsvp,
#                       Back to the question, Skip checkpoint                  -> skipped
#   F c0002,rsvp        p1 Reveal, Incorrect: the default is now Reread in RSVP;
#                       Reread in page view                                    -> reread-page,
#                       the bar's Back to the question, Skip checkpoint        -> skipped
#
# Every screen is shot. The fixture's c0002 is section s0004, chapter 2 words 311-607, so reading
# resumes at chapter 3 word 0. Grades in the file at the end: p1 Incorrect (A's second answer and D's
# did not overwrite it), p2 Incorrect, c0001-p1 Correct; p3 was only skipped and stays ungraded.
description = "Checkpoint screens by touch: every action of the prompt, answer and after-Incorrect screens once, defaults, grades saved"

env = { vars = { CROSSPOINT_SIM_UPDATE_MS = "0", CROSSPOINT_SIM_CLEAR_MS = "0" } }

sd = [
  { src = "fixtures/books/fixture.prepared.epub", dst = "books/fixture.prepared.epub" },
  { json = { openEpubPath = "/books/fixture.prepared.epub", lastSleepFromReader = true }, dst = ".crosspoint/state.json" },
  { text = "{\"version\": 1, \"overrides\": {\"wpm\": 1000}}\n", dst = "books/fixture.prepared.epub.rsvp-state.json" },
]

