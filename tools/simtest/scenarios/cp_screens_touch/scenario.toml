  { wait_log = "\\[CTL\\] Answer armed" },
  { tap = [116, 712], note = "Skip checkpoint" },
  { wait_log = "\\[CTL\\] Answer select=SkipCheckpoint" },
  { wait_log = "\\[CPT\\] saved after=skip-checkpoint prompt=- grade=none active=none prompt_index=0 position=3:0:page ok=1" },
