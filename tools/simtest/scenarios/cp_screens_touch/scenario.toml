  { screen_has = "Checkpoint · question 1 of 1 | How could sailors tell the | Gannet Rock light apart | from the other lights on the | coast? | Reveal answer | Skip checkpoint | Skip question" },
  { shot = "a_prompt" },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { tap = [240, 476], note = "Reveal" },
  { wait_log = "\\[CTL\\] Prompt select=Reveal" },
  { wait_log = "\\[CPT\\] event=reveal prompt=c0001-p1 accepted=1 refusal=0 state=answer-shown grade_recorded=0 save=no" },
  { wait_log = "\\[CPT\\] screen=Answer question=1/1 prompt=c0001-p1 recorded=none focus=AnswerBox part=1/1 lines=\\d+ refresh=clear" },
  { screen_has = "| Every light had " },
  { shot = "a_answer" },
  { wait_log = "\\[CTL\\] Answer armed" },
  { tap = [120, 620], note = "Correct" },
