# RSVP by touch only (task R4a; docs/spikes/S4-control-map.md rows 1, 2, 3, 12): open the fixture at
# chapter 1, page 1; centre tap -> toolbar -> More -> "Speed read" (first row); the pause screen opens
# at the page's first word with Play highlighted; tap Play; the firmware's frame log shows words 0, 1,
# 2, ... strictly in order; a touch-down pauses (on the Play button itself: the lift must not press
# it); the pause screen shows the delivered WPM; tap "Page view": the reader shows the page holding the
# next word.
#
# The display model is 0 ms so the run is short. Shots: the entry pause screen (deterministic), the
# word frame "Room" (word 2, a heading end: its ~560 ms hold leaves the shot plenty of time), the
# pause screen after playing (its status line and next-words row depend on where the pause landed, so
# they are masked), and the page after "Page view".
description = "RSVP by touch: More > Speed read, Play, frames in order, touch pauses, delivered WPM shown, Page view"

env = { vars = { CROSSPOINT_SIM_UPDATE_MS = "0", CROSSPOINT_SIM_CLEAR_MS = "0" } }

sd = [
  { src = "fixtures/books/fixture.epub", dst = "books/fixture.epub" },
]

steps = [
  { wait_screen = "Browse Files" },
  { tap = [240, 346], note = "Browse Files" },
  { wait_screen = "SD card | books" },
  { tap = [240, 138], note = "the books folder" },
  { wait_screen = "fixture | .epub" },
  { tap = [240, 138], note = "open the fixture" },
  { wait_log = "Progress saved: spine=0 offset=0 page=0" },
  { swipe = [400, 400, 80, 400], note = "next page: chapter 1, page 1" },
  { wait_log = "Progress saved: spine=1 offset=0 page=0" },
  { tap = [240, 400], note = "centre tap: the toolbar" },
  { wait_log = "from clearScreen to displayBuffer" },
  { tap = [385, 752], note = "More" },
  { wait_screen = "More | 1/3" },
  { screen_has = "Speed read", note = "the More list's first row (drawn over the page, so its words interleave)" },
  { tap = [240, 388], note = "Speed read" },
  { wait_log = "\\[RSVP\\] enter ch=1 page_offset=0 word=0 " },
  { wait_log = "\\[RSVP\\] pause screen focus=Play refresh=clear status=\"Paused · 240 WPM target · -- actual\"" },
  { wait_log = "\\[CTL\\] Pause armed" },
  { screen_has = "The Lamp Room · chapter 0% · book 4% | Exit | Menu | Page view | The Lamp Room The supply boat | « Back one sentence | Play | Forward one sentence » | 240 WPM | 1 word per update" },
  { shot = "pause_entry" },
  { tap = [240, 340], note = "Play" },
  { wait_log = "\\[CTL\\] Pause select=Play" },
  { wait_log = "\\[RSVP\\] play ch=1 word=0 wpm=240 words_per_update=1" },
  { wait_log = "\\[RSVP\\] frame ch=1 first=0 last=0 words=1 .* text=\"The\"" },
  { wait_log = "\\[RSVP\\] frame ch=1 first=1 last=1 words=1 .* text=\"Lamp\"" },
  { wait_log = "\\[RSVP\\] frame ch=1 first=2 last=2 words=1 .* text=\"Room\"" },
  { shot = "frame_room" },
  { wait_log = "\\[RSVP\\] frame ch=1 first=3 last=3 " },
  { wait_log = "\\[RSVP\\] frame ch=1 first=4 last=4 " },
  { wait_log = "\\[RSVP\\] frame ch=1 first=5 last=5 " },
  { wait_log = "\\[RSVP\\] frame ch=1 first=6 last=6 " },
  { wait_log = "\\[RSVP\\] frame ch=1 first=7 last=7 " },
  { tap = [240, 340], note = "touch-down pauses; this lift lands on Play and must do nothing" },
  { wait_log = "\\[CTL\\] Playing pause=touch" },
  { wait_log = "\\[RSVP\\] pause reason=pause ch=1 word=\\d+ target=240 delivered=\\d+\\.\\d .* audit=ok drawn=\\d+ segments=1 violations=0 gaps=0 repeats=0 skipped=0 declared=0" },
  { wait_log = "\\[RSVP\\] pause screen focus=Play refresh=clear status=\"Paused · 240 WPM target · \\d+ actual\"" },
  { wait_log = "\\[CTL\\] Pause armed" },
  { screen_has = "Exit | Menu | Page view" },
  { screen_lacks = "-- actual" },
  { shot = "pause_after_play" },
  { tap = [396, 84], note = "Page view" },
  { wait_log = "\\[CTL\\] Pause select=PageView" },
  { wait_log = "\\[RSVP\\] leave to=page-view ch=1 word=\\d+ offset=\\d+" },
  { wait_log = "Rendered page in" },
  { screen_has = "The Lamp Room | 1/5", note = "the page holding the next word: chapter 1, page 1" },
  { shot = "page_view" },
  { quit = true },
  { expect_file = ".crosspoint/epub_*/rsvp/1.wix", hex_prefix = "4350 5749", note = "the chapter's word index, built on entry" },
  { expect_file = ".crosspoint/epub_*/progress.bin", hex_prefix = "0100 0000" },
  { compare = "pause_entry" },
  { compare = "frame_room" },
  { compare = "pause_after_play", mask = [[0, 0, 480, 50], [0, 124, 480, 72]] },
  { compare = "page_view" },
]
