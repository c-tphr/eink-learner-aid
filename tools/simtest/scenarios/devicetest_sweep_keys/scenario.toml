# The display benchmark by the two side keys only (task D3a; plan section 10, step 9; S4 row 34:
# a short press moves, a 0.7 s hold chooses). Settings > Display > Device test is reached with ENTER
# (upstream's lists need Confirm or touch on the Picco, S4 section 4.4); every screen of ours is
# operated with UP and DOWN alone, and a key press stops a series or opens the rating.
#
# Stock: the whole sweep, rated Clean, one Tolerable, endurance residue "no". Trial A: Unreadable at
# 180 WPM with "skip the rest of this profile" (the plan's stop condition), so the rest is skipped.
# Trial B: the whole sweep, endurance residue "yes"; then "End the benchmark": Trials C and D are
# recorded as not run. Modelled times are small (update 3 ms, clear 5 ms) and the benchmark's clock
# runs 50 times faster (CROSSPOINT_SIM_BENCH_TIME_SCALE), so the pacing of the six passages takes a
# fraction of the real time; the counts, the order check and the files are the real logic.
description = "Display benchmark by Up/Down only: Stock and Trial B in full, Trial A skipped part-way, run ended; results file validated"
timeout_s = 900
wait_timeout_ms = 60000

env = { vars = { CROSSPOINT_SIM_UPDATE_MS = "3", CROSSPOINT_SIM_CLEAR_MS = "5", CROSSPOINT_SIM_BENCH_TIME_SCALE = "50" } }

