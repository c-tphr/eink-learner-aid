# A later pass after a restart shows every first grade as recorded, and a different answer changes
# nothing (task C5; PRD criterion 4, second half; docs/PLAN.md section 7, "Trigger rules" fifth bullet and
# "Grade rules"). The prepared fixture's c0002 (section s0004, chapter 2 words 311-607, resume chapter 3
# word 0). The book's state file sets 1000 WPM.
#
# Run 1, touch, page view: the full pass. p1 Correct; p2 Incorrect, Continue; p3 Correct. Page view
# resumes at chapter 3. Quit.
# Run 2, touch, page view, after the restart: one page back, one page on: c0002 fires again from its
# first prompt. p1 "Recorded earlier: Correct": Reveal, Incorrect (nothing saved), Continue; p2
# "Recorded earlier: Incorrect": Reveal, Correct (nothing saved); p3 "Recorded earlier: Correct": Reveal,
# Incorrect (nothing saved), Continue. Kill.
# Run 3, keys, RSVP, after the restart: Up, hold: Speed read, hold: Play: c0002 fires again in RSVP, and
# the same different answers change nothing. Quit. The file's grades are run 1's after each run.
description = "After a full pass and a restart, reading through the section again in page view and in RSVP shows every first grade as recorded; different answers change nothing in the file"

env = { vars = { CROSSPOINT_SIM_UPDATE_MS = "0", CROSSPOINT_SIM_CLEAR_MS = "0" } }

sd = [
  { src = "fixtures/books/fixture.prepared.epub", dst = "books/fixture.prepared.epub" },
  { json = { openEpubPath = "/books/fixture.prepared.epub", lastSleepFromReader = true }, dst = ".crosspoint/state.json" },
  { text = "{\"version\": 1, \"overrides\": {\"wpm\": 1000}}\n", dst = "books/fixture.prepared.epub.rsvp-state.json" },
]

steps = [
  { wait_log = "Progress saved: spine=0 offset=0 page=0", note = "booted into the book's title page" },

  # Run 1: the full pass, touch.
  { tap = [240, 400], note = "centre tap: the toolbar" },
  { wait_log = "from clearScreen to displayBuffer" },
  { tap = [95, 752], note = "Contents" },
  { wait_log = "from clearScreen to displayBuffer" },
  { tap = [120, 532], note = "The Fog Season" },
  { wait_log = "Progress saved: spine=2 offset=0 page=0" },
  { swipe = [400, 400, 80, 400] },
  { wait_log = "Progress saved: spine=2 offset=\\d+ page=1" },
  { swipe = [400, 400, 80, 400] },
  { wait_log = "Progress saved: spine=2 offset=\\d+ page=2" },
  { swipe = [400, 400, 80, 400] },
  { wait_log = "Progress saved: spine=2 offset=\\d+ page=3" },
  { swipe = [400, 400, 80, 400] },
  { wait_log = "Progress saved: spine=2 offset=\\d+ page=4" },
  { swipe = [400, 400, 80, 400] },
  { wait_log = "Progress saved: spine=2 offset=\\d+ page=5" },
  { swipe = [400, 400, 80, 400] },
  { wait_log = "\\[CPT\\] fire source=next-page checkpoint=c0002 section=s0004 " },
  { wait_log = "\\[CPT\\] screen=Prompt question=1/3 prompt=c0002-p1 recorded=none focus=Reveal " },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { tap = [240, 476], note = "Reveal" },
  { wait_log = "\\[CTL\\] Answer armed" },
  { tap = [120, 620], note = "Correct" },
  { wait_log = "\\[CPT\\] screen=Prompt question=2/3 prompt=c0002-p2 recorded=none focus=Reveal " },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { tap = [240, 476], note = "Reveal" },
  { wait_log = "\\[CTL\\] Answer armed" },
  { tap = [360, 620], note = "Incorrect" },
  { wait_log = "\\[CTL\\] Incorrect armed" },
  { tap = [240, 440], note = "Continue" },
  { wait_log = "\\[CPT\\] screen=Prompt question=3/3 prompt=c0002-p3 recorded=none focus=Reveal " },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { tap = [240, 476], note = "Reveal" },
  { wait_log = "\\[CTL\\] Answer armed" },
  { tap = [120, 620], note = "Correct" },
  { wait_log = "\\[CPT\\] end result=finished prompt=2 ch=3 word=0 mode=page saved=1" },
  { wait_log = "Progress saved: spine=3 offset=0 page=0" },
  { quit = true },
  { expect_schema = "books/fixture.prepared.epub.rsvp-state.json", schema = "tools/simtest/scenarios/cp_second_pass_grades/grades.schema.json", note = "p1 correct, p2 incorrect, p3 correct; nothing in progress" },

  # Run 2: a later pass in page view, touch.
  { start = true },
  { wait_log = "No known cover image for thumbnail" },
  { tap = [240, 175], note = "the continue-reading card" },
  { wait_log = "\\[RSVP\\] book state read mode=page ch=3 word=0" },
  { wait_log = "Progress saved: spine=3 offset=0 page=0", note = "nothing in progress: the reader's own page" },
  { swipe = [80, 400, 400, 400], note = "previous page: chapter 2's last page" },
  { wait_log = "Progress saved: spine=2 offset=\\d+ page=5" },
  { swipe = [400, 400, 80, 400], note = "reading on through the section's end" },
  { wait_log = "\\[CPT\\] fire source=next-page checkpoint=c0002 section=s0004 " },
  { wait_log = "\\[CPT\\] open checkpoint=c0002 prompts=3 section=s0004 mode=page .* state=read grades=3 " },
  { wait_log = "\\[CPT\\] screen=Prompt question=1/3 prompt=c0002-p1 recorded=correct focus=Reveal ", note = "every prompt again, from the first" },
  { screen_has = "Recorded earlier: Correct" },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { tap = [240, 476], note = "Reveal" },
  { wait_log = "\\[CTL\\] Answer armed" },
  { tap = [360, 620], note = "Incorrect this time" },
  { wait_log = "\\[CPT\\] event=incorrect prompt=c0002-p1 accepted=1 refusal=0 state=incorrect-choice grade_recorded=0 save=no" },
  { wait_log = "\\[CTL\\] Incorrect armed" },
  { tap = [240, 440], note = "Continue" },
  { wait_log = "\\[CPT\\] screen=Prompt question=2/3 prompt=c0002-p2 recorded=incorrect focus=Reveal " },
  { screen_has = "Recorded earlier: Incorrect" },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { shot = "t_second_pass_p2_recorded" },
  { tap = [240, 476], note = "Reveal" },
  { wait_log = "\\[CTL\\] Answer armed" },
  { tap = [120, 620], note = "Correct this time" },
  { wait_log = "\\[CPT\\] event=correct prompt=c0002-p2 accepted=1 refusal=0 state=prompt-hidden grade_recorded=0 save=now" },
  { wait_log = "\\[CPT\\] saved after=correct prompt=- grade=none active=c0002 prompt_index=2 position=none ok=1", note = "only the prompt moved on" },
  { wait_log = "\\[CPT\\] screen=Prompt question=3/3 prompt=c0002-p3 recorded=correct focus=Reveal " },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { tap = [240, 476], note = "Reveal" },
  { wait_log = "\\[CTL\\] Answer armed" },
  { tap = [360, 620], note = "Incorrect this time" },
  { wait_log = "\\[CPT\\] event=incorrect prompt=c0002-p3 accepted=1 refusal=0 state=incorrect-choice grade_recorded=0 save=no" },
  { wait_log = "\\[CTL\\] Incorrect armed" },
  { tap = [240, 440], note = "Continue: the last prompt, the checkpoint ends" },
  { wait_log = "\\[CPT\\] end result=finished prompt=2 ch=3 word=0 mode=page saved=1" },
  { wait_log = "Progress saved: spine=3 offset=0 page=0" },
  { kill = true },
  { expect_schema = "books/fixture.prepared.epub.rsvp-state.json", schema = "tools/simtest/scenarios/cp_second_pass_grades/grades.schema.json", note = "unchanged by the different answers" },
  { expect_json = "books/fixture.prepared.epub.rsvp-state.json", pointer = "/position", equals = { chapter = 3, word = 0, mode = "page" } },

  # Run 3: a later pass in RSVP, keys.
  { start = true },
  { wait_log = "No known cover image for thumbnail" },
  { press = "ENTER", note = "reopen the book" },
  { wait_log = "Progress saved: spine=3 offset=0 page=0" },
  { press = "UP" },
  { wait_log = "Progress saved: spine=2 offset=\\d+ page=5" },
  { press = "DOWN", hold_ms = 900, note = "hold: Speed read" },
  { wait_log = "\\[RSVP\\] enter ch=2 page_offset=\\d+ word=490 .* from=page" },
  { wait_log = "\\[CTL\\] Pause armed" },
  { press = "DOWN", hold_ms = 900, note = "Play" },
  { wait_log = "\\[CPT\\] fire source=rsvp-playback checkpoint=c0002 section=s0004 ", timeout_ms = 60000 },
  { wait_log = "\\[CPT\\] screen=Prompt question=1/3 prompt=c0002-p1 recorded=correct focus=Reveal " },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { press = "DOWN", hold_ms = 900, note = "Reveal" },
  { wait_log = "\\[CTL\\] Answer armed" },
  { press = "DOWN" },
  { wait_log = "\\[CTL\\] Answer focus=Correct" },
  { press = "DOWN" },
  { wait_log = "\\[CTL\\] Answer focus=Incorrect" },
  { press = "DOWN", hold_ms = 900, note = "Incorrect this time" },
  { wait_log = "\\[CPT\\] event=incorrect prompt=c0002-p1 accepted=1 refusal=0 state=incorrect-choice grade_recorded=0 save=no" },
  { wait_log = "\\[CTL\\] Incorrect armed" },
  { press = "DOWN" },
  { wait_log = "\\[CTL\\] Incorrect focus=RereadPage" },
  { press = "DOWN" },
  { wait_log = "\\[CTL\\] Incorrect focus=Continue" },
  { press = "DOWN", hold_ms = 900, note = "Continue" },
  { wait_log = "\\[CPT\\] screen=Prompt question=2/3 prompt=c0002-p2 recorded=incorrect focus=Reveal " },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { press = "DOWN", hold_ms = 900, note = "Reveal" },
  { wait_log = "\\[CTL\\] Answer armed" },
  { press = "DOWN" },
  { wait_log = "\\[CTL\\] Answer focus=Correct" },
  { press = "DOWN", hold_ms = 900, note = "Correct this time" },
  { wait_log = "\\[CPT\\] event=correct prompt=c0002-p2 accepted=1 refusal=0 state=prompt-hidden grade_recorded=0 save=now" },
  { wait_log = "\\[CPT\\] screen=Prompt question=3/3 prompt=c0002-p3 recorded=correct focus=Reveal " },
  { screen_has = "Recorded earlier: Correct" },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { shot = "k_second_pass_p3_recorded" },
  { press = "DOWN", hold_ms = 900, note = "Reveal" },
  { wait_log = "\\[CTL\\] Answer armed" },
  { press = "DOWN" },
  { wait_log = "\\[CTL\\] Answer focus=Correct" },
  { press = "DOWN" },
  { wait_log = "\\[CTL\\] Answer focus=Incorrect" },
  { press = "DOWN", hold_ms = 900, note = "Incorrect this time" },
  { wait_log = "\\[CPT\\] event=incorrect prompt=c0002-p3 accepted=1 refusal=0 state=incorrect-choice grade_recorded=0 save=no" },
  { wait_log = "\\[CTL\\] Incorrect armed" },
  { press = "DOWN" },
  { wait_log = "\\[CTL\\] Incorrect focus=RereadPage" },
  { press = "DOWN" },
  { wait_log = "\\[CTL\\] Incorrect focus=Continue" },
  { press = "DOWN", hold_ms = 900, note = "Continue: the checkpoint ends" },
  { wait_log = "\\[CPT\\] end result=finished prompt=2 ch=3 word=0 mode=rsvp saved=1" },
  { wait_log = "\\[RSVP\\] pause screen focus=Play refresh=clear status=\"Checkpoint done · " },
  { wait_log = "\\[CTL\\] Pause armed" },
  { quit = true },
  { expect_schema = "books/fixture.prepared.epub.rsvp-state.json", schema = "tools/simtest/scenarios/cp_second_pass_grades/grades.schema.json", note = "unchanged again" },
  { expect_json = "books/fixture.prepared.epub.rsvp-state.json", pointer = "/position", equals = { chapter = 3, word = 0, mode = "rsvp" } },
  { expect_no_file = "books/fixture.prepared.epub.rsvp-state.json.*" },
  { compare = "t_second_pass_p2_recorded" },
  { compare = "k_second_pass_p3_recorded" },
]
