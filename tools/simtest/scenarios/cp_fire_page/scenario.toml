  { wait_log = "Progress saved: spine=0 offset=0 page=0", note = "booted into the book's title page" },

  # Pass 1: touch.
  { swipe = [400, 400, 80, 400], note = "next page: chapter 1, page 1" },
  { wait_log = "Progress saved: spine=1 offset=0 page=0" },
  { swipe = [400, 400, 80, 400] },
  { wait_log = "\\[CPT\\] page advance ch=1 first=0 from=0 last=107 step=none" },
  { wait_log = "Progress saved: spine=1 offset=\\d+ page=1" },
  { swipe = [400, 400, 80, 400] },
  { wait_log = "\\[CPT\\] page advance ch=1 first=108 from=108 last=183 step=none", note = "not earlier" },
  { wait_log = "Progress saved: spine=1 offset=\\d+ page=2" },
  { screen_has = "same." },
  { swipe = [400, 400, 80, 400], note = "leave the page that shows the section's last word" },
  { wait_log = "\\[CPT\\] page advance ch=1 first=184 from=184 last=294 step=fire" },
