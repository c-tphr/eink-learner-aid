# Checkpoints fire in page view on a next-page action (task C2; docs/PLAN.md section 7, trigger rules;
# lib/CheckpointCore/README.md trigger rules 4, 5 and 8). The prepared fixture: c0001 is section s0001,
# chapter 1 words 0-232; its last word "same." is on page 3 of chapter 1 (words 184-294). c0002 is
# s0004, chapter 2 words 311-607, which ends its chapter; its last word is on chapter 2's last page
# (page 6, words 490-607). Every next-page action in a chapter with a checkpoint logs
# "[CPT] page advance ch=<c> first=<page's first word> from=<word counted from> last=<page's last word>
# step=<none|fire>".
#
# Pass 1, touch (swipe left = next page, swipe right = previous page):
#   - chapter 1: leaving pages 1 and 2 fires nothing; leaving page 3 (which shows "same.") fires c0001,
#     before page 4 is shown. Skip checkpoint: page view shows page 3 again (it holds word 233, the
#     first word after the break), and the next page action counts from word 233, so it fires nothing.
#   - page 4 -> page 3 (backward across the end): nothing fires; page 3 -> page 4 fires again.
#   - on through chapter 2: leaving its last page fires c0002 (a section that ends its chapter);
#     after Skip checkpoint the reader shows chapter 3's first page.
# Pass 2, keys (Down = next page, Up = previous page; the checkpoint by Up/Down only):
#   - Up: chapter 2's last page (backward across s0004's end: nothing); Down fires c0002 again.
#   - Up to chapter 1 page 3 (nine pages back, nothing fires); Down fires c0001.
description = "Page view: a checkpoint fires on the next-page action from the page showing its section's last word, not before; back never fires; forward again fires again"

env = { vars = { CROSSPOINT_SIM_UPDATE_MS = "0", CROSSPOINT_SIM_CLEAR_MS = "0" } }

sd = [
  { src = "fixtures/books/fixture.prepared.epub", dst = "books/fixture.prepared.epub" },
  { json = { openEpubPath = "/books/fixture.prepared.epub", lastSleepFromReader = true }, dst = ".crosspoint/state.json" },
]

steps = [
