  { wait_log = "\\[CPT\\] saved after=start prompt=- grade=none active=c0001 prompt_index=0 position=1:184:page ok=1", note = "the position before the break: page 3's first word" },
  { wait_log = "\\[CPT\\] screen=Prompt question=1/1 prompt=c0001-p1 " },
  { shot = "t_prompt_c0001" },
  { wait_log = "\\[CTL\\] Prompt armed" },
  { tap = [116, 712], note = "Skip checkpoint" },
  { wait_log = "\\[CPT\\] end result=skipped prompt=0 ch=1 word=233 mode=page saved=1" },
  { wait_log = "\\[CPT\\] page resume this-page ch=1 word=233 " },
  { wait_log = "\\[CPT\\] page advance ch=1 first=184 from=233 last=294 step=none", note = "trigger rule 7: no other section end on this page" },
  { wait_log = "Rendered page in" },
  { screen_has = "The Lamp Room | 3/5" },
  { shot = "t_page_resume" },
  { swipe = [400, 400, 80, 400], note = "next page: counts from word 233, past the break" },
  { wait_log = "\\[CPT\\] page advance ch=1 first=184 from=233 last=294 step=none" },
  { wait_log = "Progress saved: spine=1 offset=\\d+ page=3" },
