  { swipe = [400, 400, 80, 400], note = "leave chapter 2's last page: s0004 ends the chapter (trigger rule 8)" },
  { wait_log = "\\[CPT\\] page advance ch=2 first=490 from=490 last=607 step=fire" },
  { wait_log = "\\[CPT\\] fire source=next-page checkpoint=c0002 section=s0004 ch=2 last_word=607 resume_ch=3 resume_word=0 crossed=1" },
