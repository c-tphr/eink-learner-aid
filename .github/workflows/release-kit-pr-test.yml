# TEMPORARY copy of release-kit.yml for testing on a pull request (workflow_dispatch needs the
# file on the default branch). Generated mechanically; removed before the pull request is final.
name: Release kit (temporary PR test)

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: release-kit-pr-test-${{ github.ref }}
  cancel-in-progress: false

env:
  PLATFORMIO_SETTING_ENABLE_TELEMETRY: "No"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.inputs.outputs.version }}
      commit: ${{ steps.inputs.outputs.commit }}
    steps:
      - name: Branch and inputs
        id: inputs
        env:
          VERSION: 2.0.1
          KIND: preview
          PUBLISH: false
          ALLOW_BRANCH: ${{ github.ref_name }}
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [[ "$REF_TYPE" == branch ]] || fail "run this workflow on a branch, not on the $REF_TYPE $REF_NAME"
          if [[ "$REF" != refs/heads/main ]]; then
            [[ -n "$ALLOW_BRANCH" && "$ALLOW_BRANCH" == "$REF_NAME" ]] ||
              fail "release kits are built from main; to test the branch $REF_NAME, set allow_branch to exactly '$REF_NAME'"
            [[ "$PUBLISH" != true ]] || fail "publish=true is allowed on main only"
            echo "::warning::running on branch $REF_NAME (allow_branch): build and checks only, no release"
          fi
          [[ "$VERSION" =~ ^(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})$ ]] ||
            fail "version '$VERSION' is not MAJOR.MINOR.PATCH (digits only, no leading zeros, e.g. 2.0.1)"
          [[ "$KIND" == preview || "$KIND" == final ]] || fail "kind must be preview or final"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          {
            echo "### Release kit v$VERSION ($KIND)"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Commit | \`$COMMIT\` on \`$REF_NAME\` |"
            echo "| Publish a draft release | $PUBLISH |"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: The version is new (tags and published releases; drafts are checked again in the release job)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.inputs.outputs.version }}
        run: python3 .github/scripts/release_preflight.py "$VERSION"

  build:
    # One build; every file in the kit and every hash in it comes from this job.
    name: build and assemble
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EINK_RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
      COMMIT: ${{ needs.preflight.outputs.commit }}
      KIND: preview
      NOTES: Temporary pull-request test run (publish=false).
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          submodules: recursive
          persist-credentials: false
      - name: Restore PlatformIO packages (read-only; a release run writes no cache)
        uses: actions/cache/restore@v5
        with:
          path: ~/.platformio
          key: pio-packages-v2-ubuntu24-${{ hashFiles('platformio.ini', 'platformio.project.ini', 'scripts/cloud-setup.sh', 'scripts/pio_prefetch.py') }}
          restore-keys: pio-packages-v2-ubuntu24-
      - name: Commit and version
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$COMMIT"
          echo "commit $COMMIT, CROSSPOINT_VERSION will be $(python3 scripts/release_version.py "$EINK_RELEASE_VERSION")"
      - name: scripts/cloud-setup.sh
        run: ./scripts/cloud-setup.sh
      - name: pio run -e picco_2slot -t envdump (before the build, docs/CI.md)
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p build
          pio run -e picco_2slot -t envdump > build/envdump-picco_2slot.txt 2>&1 || { tail -50 build/envdump-picco_2slot.txt; exit 1; }
          want="('CROSSPOINT_VERSION', '\\\\\"${EINK_RELEASE_VERSION}-picco2\\\\\"')"
          grep -F "$want" build/envdump-picco_2slot.txt || { echo "::error::the envdump does not define $want"; exit 1; }
      - name: pio run -e picco_2slot
        run: |
          set -o pipefail
          export PATH="$HOME/.local/bin:$PATH"
          pio run -e picco_2slot 2>&1 | tee build/pio-picco_2slot.log
          grep -F "eink-learner-aid version: release build, CROSSPOINT_VERSION=${EINK_RELEASE_VERSION}-picco2" build/pio-picco_2slot.log
      - name: Size gate
        run: |
          set -o pipefail
          .github/scripts/firmware-size.sh picco_2slot build/pio-picco_2slot.log --gate | tee build/size-picco_2slot.txt
      - name: Licence notices for the firmware (scripts/build_release_license.py)
        run: python3 scripts/build_release_license.py --env picco_2slot --repository "$GITHUB_REPOSITORY" --output build/LICENSES.txt
      - name: Virtualenv from tools/device/requirements-test.txt
        run: |
          python3 -m venv build/venv-device
          build/venv-device/bin/python -m pip install -q -r tools/device/requirements-test.txt
      - name: Tests of the device tool and the kit builder (a skipped test fails the job)
        run: |
          build/venv-device/bin/python -m pytest tools/device scripts/tests -q -rs --junitxml=build/release-junit.xml
          python3 .github/scripts/no_skips.py build/release-junit.xml
      - name: Assemble the kit, unpack it and rehearse (scripts/make_release_kit.py)
        run: |
          build/venv-device/bin/python scripts/make_release_kit.py --version "$EINK_RELEASE_VERSION" --kind "$KIND" \
            --envdump build/envdump-picco_2slot.txt --license build/LICENSES.txt --notes "$NOTES" --out build/release-kit
          cat build/release-kit/dist/release-notes.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the kit
        uses: actions/upload-artifact@v6
        with:
          name: release-kit-v${{ needs.preflight.outputs.version }}
          path: build/release-kit/dist/
          if-no-files-found: error
          compression-level: 0
      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-kit-v${{ needs.preflight.outputs.version }}-reports
          path: |
            build/release-kit/release-kit-report.txt
            build/release-kit/stage/device-kit/kit-report.txt
            build/pio-picco_2slot.log
            build/size-picco_2slot.txt
            build/release-junit.xml
          if-no-files-found: warn

  windows:
    # The owner's path: Explorer's "Extract All" into a folder whose path has a space, then
    # session.ps1 under both shells, as CI's device-tool-windows job does with synthetic images.
    name: windows (${{ matrix.shell }})
    needs: [preflight, build]
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shell: powershell   # Windows PowerShell 5.1
            exe: powershell.exe
          - shell: pwsh         # PowerShell 7
            exe: pwsh.exe
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      MATRIX_EXE: ${{ matrix.exe }}
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v6
        with:
          name: release-kit-v${{ needs.preflight.outputs.version }}
          path: ${{ runner.temp }}\dist
      - name: Shell version and the zip's checksum
        run: |
          $PSVersionTable | Format-Table -AutoSize | Out-String -Width 200
          $zip = Join-Path $env:RUNNER_TEMP "dist\picco-2slot-$env:VERSION.zip"
          $want = ((Get-Content -LiteralPath "$zip.sha256" -Raw).Trim() -split '\s+')[0]
          $got = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          Write-Host "zip SHA-256 $got (published $want)"
          if ($got -ne $want) { Write-Host '::error::the zip does not match its .sha256 file'; exit 1 }
      - name: Extract All (Explorer's zip folder) and tar.exe, each into a path with a space
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "dist\picco-2slot-$env:VERSION.zip"
          # Mark the zip as downloaded from the internet, as the owner's browser does.
          Set-Content -LiteralPath $zip -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z = [System.IO.Compression.ZipFile]::OpenRead($zip); $count = $z.Entries.Count; $z.Dispose()
          $dest = Join-Path $env:RUNNER_TEMP "picco kit\picco-2slot-$env:VERSION"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $shell = New-Object -ComObject Shell.Application
          $from = $shell.NameSpace($zip)
          if ($null -eq $from) { Write-Host '::error::the Windows shell cannot open the zip'; exit 1 }
          # 4: no progress window, 16: yes to all, 1024: no error dialog
          $shell.NameSpace($dest).CopyHere($from.Items(), 4 + 16 + 1024)
          $deadline = (Get-Date).AddMinutes(3)
          do {
            Start-Sleep -Seconds 2
            $n = @(Get-ChildItem -LiteralPath $dest -Recurse -File).Count
          } while ($n -lt $count -and (Get-Date) -lt $deadline)
          Write-Host "Explorer's zip folder extracted $n of $count files into '$dest'"
          if ($n -ne $count) { Write-Host '::error::Extract All did not produce every file'; exit 1 }
          $mark = @(Get-Item -LiteralPath (Join-Path $dest 'session.ps1') -Stream * | Where-Object Stream -eq 'Zone.Identifier').Count
          Write-Host "session.ps1 carries the downloaded-file mark: $($mark -gt 0)"
          $tarDest = Join-Path $env:RUNNER_TEMP "tar kit\picco-2slot-$env:VERSION"
          New-Item -ItemType Directory -Force -Path $tarDest | Out-Null
          & "$env:SystemRoot\System32\tar.exe" -xf $zip -C $tarDest
          if ($LASTEXITCODE -ne 0) { Write-Host '::error::tar.exe could not extract the zip'; exit 1 }
          Write-Host "tar.exe extracted $(@(Get-ChildItem -LiteralPath $tarDest -Recurse -File).Count) files"
      - name: MANIFEST.sha256 verifies in both folders
        run: |
          foreach ($root in (Join-Path $env:RUNNER_TEMP "picco kit\picco-2slot-$env:VERSION"), (Join-Path $env:RUNNER_TEMP "tar kit\picco-2slot-$env:VERSION")) {
            $listed = @{}
            foreach ($line in Get-Content -LiteralPath (Join-Path $root 'MANIFEST.sha256')) {
              $hash, $path = $line -split '  ', 2
              $listed[$path] = $hash
            }
            $bad = @()
            foreach ($path in $listed.Keys) {
              $file = Join-Path $root ($path -replace '/', '\')
              if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { $bad += "missing: $path"; continue }
              if ((Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash.ToLowerInvariant() -ne $listed[$path]) { $bad += "hash differs: $path" }
            }
            $prefix = $root.Length + 1
            foreach ($f in Get-ChildItem -LiteralPath $root -Recurse -File) {
              $path = $f.FullName.Substring($prefix) -replace '\\', '/'
              if ($path -ne 'MANIFEST.sha256' -and -not $listed.ContainsKey($path)) { $bad += "not listed: $path" }
            }
            Write-Host "$root : $($listed.Count) files listed, problems: $($bad.Count)"
            $bad | ForEach-Object { Write-Host "  $_" }
            if ($bad.Count -gt 0) { Write-Host '::error::MANIFEST.sha256 does not verify'; exit 1 }
          }
      - name: Fake-device work folder (identify and backup of a FAKE stock Picco, tools/device/tests)
        run: |
          python -m pip install -q -r tools/device/requirements-test.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $work = Join-Path $env:RUNNER_TEMP "picco kit\picco-2slot-$env:VERSION\work"
          python -c "import sys; sys.path.insert(0, 'scripts'); import make_release_kit as m; m.make_fake_work(sys.argv[1])" $work
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem -LiteralPath $work -File | ForEach-Object { Write-Host "  $($_.Name)" }
      - name: session.ps1 setup, plan, flash -DryRun from the extracted kit
        run: |
          $ErrorActionPreference = 'Continue'
          $kitDir = Join-Path $env:RUNNER_TEMP "picco kit\picco-2slot-$env:VERSION"
          $logDir = Join-Path $env:RUNNER_TEMP 'session-logs'
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null
          $script = Join-Path $kitDir 'session.ps1'
          $steps = @(
            @('setup',        @('setup'),         0, 'piccoflash 1.0'),
            @('plan',         @('plan'),          0, 'Plan verified'),
            @('flash-dryrun', @('flash', '-DryRun'), 0, 'DRY RUN RESULT: READY')
          )
          $results = @()
          Push-Location $kitDir
          foreach ($s in $steps) {
            $name, $cmdArgs, $expect, $text = $s
            $log = Join-Path $logDir "$name.log"
            Write-Host "::group::$name ($env:MATRIX_EXE -File session.ps1 $($cmdArgs -join ' '))"
            $out = & $env:MATRIX_EXE -NoProfile -ExecutionPolicy Bypass -File $script @cmdArgs 2>&1 | ForEach-Object { "$_" }
            $code = $LASTEXITCODE
            $out | Set-Content -LiteralPath $log -Encoding UTF8
            $out | ForEach-Object { Write-Host $_ }
            Write-Host "::endgroup::"
            $found = [bool]($out | Select-String -SimpleMatch $text)
            $results += [pscustomobject]@{ Command = "session.ps1 $($cmdArgs -join ' ')"; Exit = $code; Expected = $expect; Shows = $text; Found = $found; OK = ($code -eq $expect -and $found) }
          }
          Pop-Location
          $results | Format-Table -AutoSize | Out-String -Width 220 | Tee-Object -FilePath (Join-Path $logDir 'results.txt') | Write-Host
          if ($results | Where-Object { -not $_.OK }) { Write-Host '::error::a session.ps1 command did not succeed from the extracted kit'; exit 1 }
          exit 0
      - name: Upload session logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-kit-windows-${{ matrix.shell }}
          path: |
            ${{ runner.temp }}\session-logs
            ${{ runner.temp }}\picco kit\picco-2slot-${{ needs.preflight.outputs.version }}\work\logs
          if-no-files-found: warn

  release:
    # Only with publish=true on main (preflight refuses it elsewhere). Creates a DRAFT; publishing
    # is a separate, deliberate step (docs/RELEASING.md).
    name: draft release
    needs: [preflight, build, windows]
    if: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.preflight.outputs.version }}
      COMMIT: ${{ needs.preflight.outputs.commit }}
      KIND: preview
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v6
        with:
          name: release-kit-v${{ needs.preflight.outputs.version }}
          path: dist
      - name: Checksums and asset names
        run: |
          set -euo pipefail
          cd dist
          ls -l
          sha256sum -c "picco-2slot-$VERSION.zip.sha256" "eink-learner-aid-v$VERSION-picco2.bin.sha256"
          python3 - <<'EOF'
          import json, os
          info = json.load(open("kit-info.json"))
          v = os.environ["VERSION"]
          assert info["version"] == v and info["tag"] == "v" + v, info
          assert info["commit"] == os.environ["COMMIT"] and info["kind"] == os.environ["KIND"], info
          assert info["wifi_asset"]["name"] == info["updater"]["asset_name_for_tag"] == "eink-learner-aid-v%s-picco2.bin" % v
          print("kit-info.json: version, tag, commit, kind and the updater's asset name agree")
          EOF
      - name: The version is new (with a token that also sees draft releases)
        run: python3 .github/scripts/release_preflight.py "$VERSION"
      - name: Build provenance attestation
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/picco-2slot-${{ needs.preflight.outputs.version }}.zip
            dist/eink-learner-aid-v${{ needs.preflight.outputs.version }}-picco2.bin
            dist/kit-info.json
      - name: Create the draft release and upload the assets
        id: create
        run: |
          set -euo pipefail
          prerelease=false
          title="v$VERSION"
          if [[ "$KIND" == preview ]]; then prerelease=true; title="v$VERSION (preview kit)"; fi
          id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
                 -f tag_name="v$VERSION" -f target_commitish="$COMMIT" -f name="$title" \
                 -F body=@dist/release-notes.md -F draft=true -F prerelease="$prerelease" --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "draft release $id created"
          for f in "picco-2slot-$VERSION.zip" "picco-2slot-$VERSION.zip.sha256" \
                   "eink-learner-aid-v$VERSION-picco2.bin" "eink-learner-aid-v$VERSION-picco2.bin.sha256" kit-info.json; do
            curl -sS --fail-with-body -X POST -o /dev/null \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/octet-stream" --data-binary "@dist/$f" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$id/assets?name=$f"
            echo "uploaded $f"
          done
      - name: Check the draft as GitHub stores it
        env:
          RELEASE_ID: ${{ steps.create.outputs.id }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > release.json
          python3 - <<'EOF'
          import hashlib, json, os
          r = json.load(open("release.json"))
          v, kind = os.environ["VERSION"], os.environ["KIND"]
          assert r["draft"] is True, "not a draft"
          assert r["prerelease"] is (kind == "preview"), "prerelease flag"
          assert r["tag_name"] == "v" + v and r["target_commitish"] == os.environ["COMMIT"], (r["tag_name"], r["target_commitish"])
          want = ["picco-2slot-%s.zip" % v, "picco-2slot-%s.zip.sha256" % v, "eink-learner-aid-v%s-picco2.bin" % v,
                  "eink-learner-aid-v%s-picco2.bin.sha256" % v, "kit-info.json"]
          got = {a["name"]: a for a in r["assets"]}
          assert sorted(got) == sorted(want), sorted(got)
          for name in want:
              data = open(os.path.join("dist", name), "rb").read()
              a = got[name]
              assert a["size"] == len(data), name
              if a.get("digest"):
                  assert a["digest"] == "sha256:" + hashlib.sha256(data).hexdigest(), name
              print("%-45s %10d bytes  %s" % (name, a["size"], a.get("digest") or "(no digest reported)"))
          print("draft %s: tag %s at %s, prerelease=%s" % (r["html_url"], r["tag_name"], r["target_commitish"], r["prerelease"]))
          EOF
          echo "Draft release: $(python3 -c 'import json;print(json.load(open("release.json"))["html_url"])')" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the incomplete draft this run created
        if: ${{ failure() && steps.create.outputs.id != '' }}
        env:
          RELEASE_ID: ${{ steps.create.outputs.id }}
        run: |
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID"
          echo "::error::the draft release $RELEASE_ID was incomplete or wrong and has been deleted; nothing else changed"
