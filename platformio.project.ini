; Project-owned PlatformIO environments for eink-learner-aid.
;
; Upstream's platformio.ini stays byte-identical to the pinned commit except
; for one line, which adds this file to [platformio] extra_configs ahead of the
; personal platformio.local.ini. Every environment this project adds lives
; here. See docs/BASE.md, "What differs from the pinned commit".
;
; [env:simulator] and [env:simulator_picco] are taken from
; sample-platformio-linux-wsl.ini of crosspoint-reader/crosspoint-simulator at
; the commit pinned below. Differences from the sample:
;   - the simulator library is pinned to one commit (the sample tracks the
;     default branch);
;   - the other device profiles of the sample are left out;
;   - the library's pre-script is found through ${platformio.libdeps_dir}
;     instead of the literal .pio/libdeps, so PLATFORMIO_LIBDEPS_DIR works;
;   - scripts/patch_simulator.py applies scripts/simulator_patches/ (HAL stubs
;     the pinned simulator lacks for our firmware) before anything compiles.
; To move the pin, change the commit here, re-check every patch in
; scripts/simulator_patches/ against the new commit, and update docs/BASE.md.

[simulator_pin]
; crosspoint-reader/crosspoint-simulator, default branch head on 2026-11-16:
; "feat: add Metalio E-Ink 4 Plus simulator profile (#63)", 2026-11-10.
commit = 84c3421da6f707d6ebe919b3fafca7387ff06464

[env:simulator]
platform = native
lib_ldf_mode = deep+
lib_compat_mode = off
build_src_filter =
  +<*>
  ; Firmware-update code remains non-destructive in the simulator.
  -<network/FirmwareFlasher.cpp>
  -<network/OtaBootSwitch.cpp>
  -<network/OtaUpdater.cpp>
  -<platform/skip_efuse_blk_check.c>
  -<platform/S31NimbleMemory.cpp>
build_flags =
  -std=gnu++2a
  !sdl2-config --cflags --libs
  -lssl
  -lcrypto
  -Wno-deprecated-declarations
  -Wno-narrowing
  -DSIMULATOR
  -DFREEINK_DEVICE_X4=1
  -DCROSSPOINT_SIMULATOR_PROJECT_WEBSERVER
  -DCROSSPOINT_VERSION=\"dev-simulator\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DMINIZ_NO_ZLIB_COMPATIBLE_NAMES=1
  -DXML_GE=0
  -DXML_CONTEXT_BYTES=1024
  -DUSE_UTF8_LONG_NAMES=1
  -DPNG_MAX_BUFFERED_PIXELS=16416
  -DDISABLE_FS_H_WARNING=1
  -DDESTRUCTOR_CLOSES_FILE=1
  -Isrc
  -Ifreeink-sdk/libs/network/BleKeyboardHost/include
; The simulator supplies host network shims instead of embedded SecureNet.
lib_ignore = hal, PNGdec, JPEGDEC, WebSockets, SecureNet
extra_scripts =
  ; First: stubs the pinned simulator needs for this firmware (scripts/simulator_patches/).
  pre:scripts/patch_simulator.py
  pre:${platformio.libdeps_dir}/$PIOENV/simulator/skip_device_content_protection.py
  pre:scripts/gen_i18n.py
  pre:scripts/git_branch.py
  pre:scripts/build_html.py
lib_deps =
  simulator=https://github.com/crosspoint-reader/crosspoint-simulator.git#${simulator_pin.commit}
  JsonSax=symlink://freeink-sdk/libs/network/JsonSax
  Opds=symlink://freeink-sdk/libs/network/Opds
  SecureNet=symlink://freeink-sdk/libs/network/SecureNet
  CatalogList=symlink://freeink-sdk/libs/network/CatalogList
  FreeInkUI=symlink://freeink-sdk/libs/ui/FreeInkUI
  Icons=symlink://freeink-sdk/libs/assets/Icons
  FreeInkFont=symlink://freeink-sdk/libs/font/FreeInkFont
  bblanchon/ArduinoJson @ 7.4.2
  ricmoo/QRCode @ ^0.0.1
  https://github.com/bitbank2/AnimatedGIF.git#d01888f0255fd0781fc2b8600b9111b14c999584
  links2004/WebSockets @ 2.7.3

; BOOX Picco profile: 800x480 panel, touch, slide switch, warm/cool frontlight.
; See docs/picco.md in the simulator repo.
[env:simulator_picco]
extends = env:simulator
build_flags =
  ${env:simulator.build_flags}
  -DSIMULATOR_DEVICE_PICCO
  -UFREEINK_DEVICE_X4
  -DFREEINK_DEVICE_PICCO=1
  -DBOARD_HAS_PSRAM
  ; RSVP reading and checkpoints (docs/ARCHITECTURE-RSVP.md); also set in platformio.ini for the Picco.
  -DCROSSPOINT_RSVP=1
extra_scripts =
  ${env:simulator.extra_scripts}
  ; The display timing model's measured times: docs/device/picco-timings.json, validated and
  ; compiled in when present (src/display/, lib/DisplayProfileCore/README.md "Timing model").
  pre:scripts/gen_display_timings.py

; --- Onyx Picco, two-slot layout (task D4; docs/TWO_SLOT.md, spike S3) ----------
; The firmware the owner's Picco runs after the one-time move to two app slots.
; Same firmware as [env:picco] (it extends it); differences:
;   - partitions_picco_2slot.csv: app0 0x20000 and app1 0x800000, 0x7E0000 each;
;     nvs 0x9000 and otadata 0x15000 keep their stock offsets and sizes;
;   - boot_app0.bin is placed at the otadata offset 0x15000 instead of the
;     framework's fixed default 0xE000, which lies inside the stock NVS
;     (arduino-esp32 3.3.11 tools/pioarduino-build.py reads the board key
;     upload.arduino.boot_app0);
;   - CROSSPOINT_VERSION ends in -picco2, so About and the serial log show the
;     layout build;
;   - no upload, erase or debug target: scripts/picco_2slot_pre.py stops them
;     before anything runs (scripts/app_only_upload.py of [env:picco] is not
;     used: it does not keep the extra images out of the upload, docs/BASE.md).
; Flash it only with tools/device (kit: scripts/make_device_kit.py).
; build_flags repeat [env:picco]'s with another CROSSPOINT_VERSION; the pre
; script fails the build if the two lists drift apart.
[env:picco_2slot]
extends = env:picco
board_build.partitions = partitions_picco_2slot.csv
board_upload.arduino.boot_app0 = 0x15000
extra_scripts =
  pre:scripts/picco_2slot_pre.py
  ${base.extra_scripts}
  post:scripts/picco_2slot_post.py
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_PICCO=1
  -DFREEINK_CAP_USB_MSC=1
  -DBOARD_HAS_PSRAM
  -DUSB_PRODUCT=\"CrossPoint_Picco\"
  -DUSB_MANUFACTURER=\"CrossPoint\"
  -DCROSSPOINT_VERSION=\"${crosspoint.version}-picco2\"
  -DENABLE_SERIAL_LOG
  -DCROSSPOINT_WAIT_FOR_USB_SERIAL
  -DLOG_LEVEL=2
  ; Picco SD is native SDMMC (4-bit), mounted through SdFat's block-device API.
  -DUSE_BLOCK_DEVICE_INTERFACE=1
  -DCROSSPOINT_RSVP=1
